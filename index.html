ipio de razonabilidad cuando, por ejemplo, se produce la emisión de medidas de requerimiento, cuando el propio inspector es informado previamente de que el sujeto inspeccionado no contaba con actividad económica, según medios de prueba atendibles, tales como los reportes de SUNAT (Resolución N° 624-2022-SUNAFIL/TFL-Primera Sala). De otro lado, esta Sala también se ha pronunciado sobre la irrazonabilidad cuando se produce el otorgamiento de un plazo muy limitado para que el sujeto inspeccionado de total cumplimiento de una orden contenida en la medida inspectiva de requerimiento, cuando la actividad a ser realizada tome un tiempo mayor al concedido, debiendo conciliarse el deber de colaboración con el referido principio de razonabilidad, en consideración de la naturaleza de la obligación objeto de requerimiento (si es sencilla o si revista complejidad) y los ámbitos objetivos y subjetivos de tal obligación, esto es, la naturaleza de la actividad a ser realizada, las características y número de trabajadores sobre los que esta actividad recae (Resoluciones Nº 377-2022-SUNAFIL/ TFL-Primera Sala y Nº 994-2022-SUNAFIL/TFL-Primera Sala). 6.10 Sin embargo, existen supuestos específicos —como el caso materia de autos— en el cual la naturaleza de los incumplimientos y la reincidencia en el incumplimiento de las conductas obligan a efectuar un análisis que comprenda tanto al plazo otorgado por los inspectores comisionados (evaluando si el mismo era suficiente para el cumplimiento de lo conminado), como al lapso transcurrido durante en el que el sujeto inspeccionado pudo adoptar acciones tendientes a cumplir con conductas que le eran conocidas de antemano, al haber sido objeto de sanción previamente o al haber tomado conocimiento de los acontecimientos constituyentes de incumplimiento durante las actuaciones inspectivas."}, {"fundamento": "6.14", "texto": "Un análisis circunscrito únicamente al plazo otorgado en la medida inspectiva de requerimiento conllevaría a concluir, apriorísticamente, el quiebre del principio de razonabilidad (arguyéndose a la “razonabilidad” del tiempo otorgado al sujeto inspeccionado como fundamento). Sin embargo, tal conclusión constituye un resultado que es contradictorio al contenido de dicho principio, como manifestación de una adecuada proporción entre los medios y fines dispuestos ante un caso concreto. Por ello, el plazo otorgado en la medida inspectiva de requerimiento debe analizarse de acuerdo con el contexto en el que dicha facultad de la inspección del trabajo es ejercida, lo que incluye a los hechos derivados del propio expediente así como a situaciones directamente acreditadas en otros expedientes que puedan ser un antecedente concretamente invocable."}, {"fundamento": "6.16", "texto": "En ese sentido, al expedirse la medida inspectiva de requerimiento no solo se debe de contemplar el plazo a otorgar al sujeto inspeccionado frente al plazo restante de las actuaciones inspectivas, sino también las particularidades del caso concreto, lo cual implica la gravedad de la infracción o las infracciones al ordenamiento jurídico sociolaboral debidamente comprobadas (por el impacto que causen hacia el trabajador o los trabajadores afectados) y el comportamiento previo del sujeto inspeccionado (si conocía de antemano la infracción, o si había sido sancionado previamente bajo la misma causa); y otros supuestos derivados del contexto en el que se desarrolló el procedimiento inspectivo, que justifiquen la adopción de dicha medida."}]}, {"id": "2023-001", "anio": 2023, "numero": "001-2023", "tipo": "Precedente", "titulo": "Principio de licitud en el procedimiento administrativo sancionador", "criterio": "Criterio referido al principio de licitud en el procedimiento administrativo sancionador (fund. 6.19 a 6.22).", "fundamentos": "6.19, 6.20, 6.21 y 6.22", "palabras": ["licitud", "principio de licitud", "procedimiento sancionador"], "temas": [["Procedimiento sancionador y principios", "Principios del procedimiento", "Licitud"]], "archivo": "pdf/2023-001.pdf", "archivo_nombre": "Resolucion-001-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.19", "texto": "En tal sentido, con el objeto de contradecir el principio de licitud, que protege la actuación de los administrados, y acreditar fehacientemente los hechos, a la ocurrencia de alguna infracción a la normativa sociolaboral, la Administración debe determinar el cumplimiento del principio de verdad material.19 Así, conforme esta directriz, la autoridad administrativa competente debe verificar suficientemente los hechos que sirven de motivo para sus respectivas decisiones, esto es, la determinación de multas u obligaciones al sujeto inspeccionado; para lo cual, la autoridad fiscalizadora y sancionadora deben evaluar ampliamente la prueba directa e indirecta actuada en el expediente, así como extender todas las medidas razonables para satisfacer la carga probatoria que recae sobre la Administración, junto con la exigible participación necesaria del deber de colaboración de los sujetos inspeccionados, conforme a Ley."}, {"fundamento": "6.20", "texto": "En efecto, en el marco del procedimiento de fiscalización y sancionador se deben obtener los indicios suficientes o elementos de convicción que permitan la comprobación de alguna infracción a las normas de trabajo que sean pasibles de sanción. Esto resulta necesario para poder sostener una imputación de responsabilidad administrativa al sujeto inspeccionado, para lo cual se deben agotar los medios conferidos por el TUO de la LPAG, la LGIT y el RLGIT, citados precedentemente."}, {"fundamento": "6.21", "texto": "Cabe precisar que esta carga de la prueba que recae sobre la administración para determinar el reproche administrativo al sujeto inspeccionado atiende al derecho fundamental de prueba que tiene este para ofrecer los medios de prueba que considere pertinentes para sustentar sus alegaciones. Tales actuados, cuando efectivamente sean pertinentes para la determinación de si existe responsabilidad administrativa o no, deberán ser analizados y valorados por la autoridad administrativa al resolver si corresponde o no la determinación de una sanción."}, {"fundamento": "6.22", "texto": "Lo señalado anteriormente, no implica que la mera alegación del principio/derecho a la presunción de licitud por parte del administrado, sea sustento suficiente para desvirtuar la comisión de infracción o infracciones imputadas; por el contrario, si durante el desarrollo del procedimiento la administración sustenta la responsabilidad del sujeto inspeccionado, la carga de la prueba se traslada a éste, por lo que podrá desestimar los reproches administrativos alegados o la configuración de algún eximente de responsabilidad, a través de la presentación de los medios de prueba que considere oportunos; correspondiendo a la administración resolver sobre la base de la valoración conjunta de las pruebas aportadas al procedimiento."}]}, {"id": "2023-002", "anio": 2023, "numero": "002-2023", "tipo": "Precedente (Acuerdo Plenario)", "titulo": "Notificación de requerimientos de información por SINEL y casilla electrónica", "criterio": "Criterio referido a los casos de notificación de los requerimientos de información a través del Sistema de Notificación Electrónica de la SUNAFIL (SINEL) y al uso de la casilla electrónica (fund. 13 a 32).", "fundamentos": "13, 14, 22, 23, 28, 29, 30, 31 y 32", "palabras": ["SINEL", "notificación electrónica", "casilla electrónica", "requerimiento de información", "notificación"], "temas": [["Función inspectiva y medidas inspectivas", "Requerimientos de información", "Notificación electrónica (SINEL)"]], "archivo": "pdf/2023-002.pdf", "archivo_nombre": "Resolucion-002-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "13", "texto": "En ese sentido, reconociendo la discrepancia existente (la que habría de resolverse en cuanto haya más Salas del TFL implementadas), la Primera Sala mínimamente ha consensuado un supuesto de responsabilidad administrativa: si, luego de la consulta con la Oficina General de Tecnologías de la Información y Comunicaciones (OGTIC) de la SUNAFIL, se identifica que la fecha de ingreso del usuario de la casilla electrónica (entiéndase, el administrado) es previa o simultánea al requerimiento de información que fue objeto del procedimiento sancionador y el usuario no cumplió con registrar sus datos de contacto respectivos (a través de los cuales se depositarían las alertas complementarias a la notificación por vía de la casilla electrónica)."}, {"fundamento": "14", "texto": "En tal supuesto, resulta procedente la sanción por incumplimiento del requerimiento o de los requerimientos de información que se hubieren depositado en la casilla electrónica. De esta forma, es factible la sanción encausada por el inciso 46.3 del artículo 46 del RLGIT contra el administrado que, por omisión culposa, deja de registrar el contacto respectivo en la casilla electrónica, impidiendo de esa forma la comunicación a la que se refiere el segundo párrafo del artículo 6 del Decreto Supremo Nº 003-2020-TR."}, {"fundamento": "22", "texto": "Así, conforme con las resoluciones invocadas en el numeral 16 del presente Acuerdo Plenario, es preciso establecer la existencia de actos de hostilidad cuando se despliegan medidas disciplinarias contra trabajadores sin haberse seguido un procedimiento que cumpla con los derechos fundamentales a la defensa, al debido proceso o a la prueba, derechos constitucionales que deben tener plena vigencia en la relación de trabajo, conforme con el tercer párrafo del artículo 23 de la Constitución."}, {"fundamento": "23", "texto": "En ese sentido, la autoridad instructiva y sancionadora, durante la tramitación del procedimiento sancionador respectivo, deberá examinar que en la inspección de trabajo donde se analice la presunta comisión de actos de hostilidad en contra de trabajadores sancionados con medidas disciplinarias; se haya verificado si previamente a la imposición de la sanción, el empleador siguió un debido procedimiento cautelando el derecho a la defensa y a la prueba; preservándose el ejercicio disciplinario que sea justo y respetuoso de tales derechos. C) La prueba producida por el empleador y su valoración."}, {"fundamento": "28", "texto": "En ese sentido, debe puntualizarse que el comportamiento de todos los componentes del Sistema de Inspección del Trabajo respecto al derecho fundamental a probar de los inspeccionados (y de los terceros con interés) debe ser observado a fin de que las competencias ejercidas por fiscalizadores y órganos del procedimiento sancionador se ejecuten en términos compatibles con el debido procedimiento administrativo. Conforme con la Sentencia citada precedentemente, la evaluación de las pruebas aportadas permite garantizar el respeto del debido procedimiento administrativo."}, {"fundamento": "29", "texto": "Así, los órganos sancionadores deben verificar si durante la fiscalización laboral, los inspectores de trabajo han considerado los medios de prueba presentados por los inspeccionados, motivando sus propuestas o justificando sus decisiones; siendo así que la motivación en las Actas de Infracción debe contemplar la valoración de los medios de prueba pertinentes que haya aportado el inspeccionado para acreditar la licitud de su comportamiento."}, {"fundamento": "30", "texto": "De lo anterior, cabe señalar que, los medios de prueba que son analizados en la inspección del trabajo, incluyen a los informes de parte presentados por el sujeto inspeccionado, siempre que se trate de documentación pertinente; es decir, que constituya un instrumento adecuado para la apreciación y valoración de los componente de un caso concreto, conforme con el deber de buena fe ante la Administración. Así, por ejemplo, en materia de seguridad y salud en el trabajo, los empleadores se encuentran en la obligación de realizar e implementar las obligaciones en materia de prevención de riesgos, por lo que el personal a su cargo, conforme con sus funciones, puede emitir informes que deben ser examinados por los inspectores actuantes como medios de prueba aportados por la interesada. Sin embargo, la presentación o exhibición de información impertinente; es decir, no conducente a probar alguna conducta o hecho materia de análisis o no idónea para ello, suponiendo un puro recargo documental, podrá ser calificada como un acto contrario al deber de colaboración, conforme con los hechos ocurridos en cada caso."}, {"fundamento": "31", "texto": "Sobre el particular, siguiendo una nutrida corriente de resoluciones emitidas por la Primera Sala del Tribunal, tales como las Resoluciones Nros 127-2022, 1187-2022, entre otras, y a la luz de los principios de veracidad y verdad material expresamente reconocidos en el TUO de la LPAG, debe reafirmarse que las declaraciones juradas, informes y comunicaciones en general presentadas por la parte interesada —sea por representantes de la compañía o por personal subordinado del sujeto fiscalizado, incluyendo al propio denunciante— no son instrumentos suficientes para generar convicción a su favor, sea que ello se exponga en la inspección o durante el procedimiento sancionador. Esto, debido a la naturaleza asimétrica de la relación laboral, que pone al declarante en un vínculo jurídico especial con la parte interesada. De esta manera, los indicados instrumentos no son idóneos para contrarrestar la presunción de certeza a la que refiere el artículo 16º de la LGIT en favor de las actas de infracción; pero sí deben ser valorados por los inspectores en el cumplimiento de sus funciones."}, {"fundamento": "32", "texto": "En ese sentido, el TUO de la LPAG recoge esta regla probatoria al disponer que la carga de la prueba se rige por el denominado “principio de impulso de oficio”, en virtud del cual es a la autoridad a quien corresponde “dirigir e impulsar de oficio el procedimiento y ordenar la realización o práctica de los actos que resulten convenientes para el esclarecimiento y resolución de las cuestiones necesarias”8. A decir de Morón Urbina, “el principio de impulso de oficio impone a la Administración la obligación de verificar y probar los hechos que se imputan o que han de servir de base a la resolución del procedimiento, así como la obligación de proceder a la realización de la actividad probatoria misma cuando lo requiera el procedimiento”9. III. DECISIÓN 1. La Sala Plena del Tribunal de Fiscalización Laboral, por unanimidad, considera que los criterios contenidos en los numerales 13, 14, 22, 23, 28, 29, 30, 31 y 32 del presente Acuerdo Plenario ameritaran ser declaradas como precedente de observancia obligatoria para todas las entidades conformantes del Sistema de Inspección del Trabajo. 2. Conforme a lo expuesto, la Sala Plena del Tribunal de Fiscalización Laboral, de conformidad con lo dispuesto en el último párrafo del artículo 2 del Reglamento del Tribunal de Fiscalización Laboral, respecto a la emisión de precedentes administrativos de observancia obligatoria."}]}, {"id": "2023-003", "anio": 2023, "numero": "003-2023", "tipo": "Precedente", "titulo": "Primacía de la realidad en la verificación de horas extras en jornada a tiempo parcial", "criterio": "Criterio referido al principio de primacía de la realidad en la verificación de horas extras en la jornada de trabajo a tiempo parcial (fund. 6.40 a 6.49).", "fundamentos": "6.40, 6.41, 6.42, 6.43, 6.44, 6.45 y 6.49", "palabras": ["horas extras", "tiempo parcial", "sobretiempo", "primacía de la realidad", "jornada"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Horas extras en jornada a tiempo parcial"]], "archivo": "pdf/2023-003.pdf", "archivo_nombre": "Resolucion-003-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.40", "texto": "De la normativa y jurisprudencia expuesta precedentemente, se colige que no cualquier contrato de trabajo por debajo de una jornada a tiempo completo califica como contrato a tiempo parcial. Toda vez que, pues para el ordenamiento jurídico, este último es aquel que se celebra por debajo de las cuatro (4) horas de jornada diaria, la misma que se calcula dividiendo el total de horas trabajadas en la semana entre el número de días de jornada (seis o cinco, dependiendo de la jornada de la empresa empleadora). En consecuencia, a partir de las cuatro (4) horas de jornada efectivamente laboradas, el trabajador gozará de todos los beneficios 17 18 TUO de la LPAG: Artículo 6: Motivación del acto administrativo (...) “6.3 No constituye causal de nulidad el hecho de que el superior jerárquico de la autoridad que emitió el acto que se impugna tenga una apreciación distinta respecto de la valoración de los medios probatorios o de la aplicación o interpretación del derecho contenida en dicho acto. Dicha apreciación distinta debe conducir a estimar parcial o totalmente el recurso presentado contra el acto impugnado” (énfasis añadido). Ver STC Nº04064-2011-PA/TC, STC Nº03355-2010-PA/TC, STC Nº004662009-PA/TC, STC Nº06321-2008-PA/TC, STC Nº01511-2008-PA/TC, correspondientes a un contrato a tiempo completo, tales como: compensación por tiempo de servicios, gratificaciones legales, vacaciones, entre otros."}, {"fundamento": "6.41", "texto": "Ahora, respecto a las horas trabajadas en sobretiempo, se advierte que su existencia se encuentra supeditada a dos (02) supuestos concretos: 1) por superar la jornada ordinaria fijada por las partes que intervienen en la relación laboral (empleador y trabajador), sin exceder la jornada máxima legal establecida en el artículo 25 de la Constitución Política del Perú; o 2) por superar dicha jornada máxima legal. De lo expuesto, se aprecia que no existe una prohibición por mandato legal para la realización de labores en sobretiempo, en una relación laboral de trabajo a tiempo parcial."}, {"fundamento": "6.42", "texto": "En ese sentido, respecto al primer supuesto, en armonía al artículo 20 del Decreto Supremo Nº 008-2002TR, que aprueba el Reglamento del Texto Único Ordenado de la Ley de Jornada de Trabajo, Horario y Trabajo en Sobretiempo, “se considera trabajo en sobretiempo a aquel que exceda de la jornada ordinaria vigente en el centro de trabajo, aun cuando se trate de una jornada reducida”. Por lo tanto, el empleador podrá reconocer horas extras independientemente de la duración de la jornada de trabajo, incluso en tiempo parcial. (énfasis añadido)."}, {"fundamento": "6.43", "texto": "En este punto, se debe precisar que, la generación de horas extras dentro de una jornada menor a cuatro (4) horas diarias, debe ser evaluada de manera rigurosa; pues de no ser de ocurrencia excepcional, se observaría un fraude a la ley. Debido a que, el empleador se habría valido de un contrato a tiempo parcial para contratar a un trabajador con beneficios sociolaborales reducidos; con el objeto de encubrir una relación laboral, al que le corresponderían todos los beneficios de una jornada a tiempo completo (énfasis añadido)."}, {"fundamento": "6.44", "texto": "Ante ello, reviste de especial relevancia el principio de primacía de la realidad19 mediante el cual se impone que, ante discrepancia entre la documentación formal y lo realmente constatado, se privilegiará lo último de cara a reivindicar el cumplimiento de obligaciones laborales por parte del empleador. Este principio reviste de especial importancia en la verificación de horas extras dentro de los límites que caracteriza la jornada de trabajo a tiempo parcial, conforme al artículo 12 del RLFE, a fin de advertir si, en el caso en concreto, ha operado la desnaturalización de dicho régimen de contratación."}, {"fundamento": "6.45", "texto": "En conclusión, mediante el citado principio, deberá verificarse que no se supere el promedio de cuatro horas diarias, luego de dividirse entre cinco (5) y seis (6) días de trabajo, como ha quedado establecido en la Casación Laboral Nº 18749-2016 LIMA, y en la que se precisa también que, si del cálculo efectuado se arroja un promedio de más de cuatro horas diarias, los trabajadores tienen derecho a los beneficios sociales del régimen laboral general."}, {"fundamento": "6.49", "texto": "Por las consideraciones antes expuestas, queda acreditado que los contratos a tiempo parcial celebrados entre la impugnante y los trabajadores afectados han sido desnaturalizados por no cumplir con la jornada laboral establecida por Ley para los contratos a tiempo parcial. En consecuencia, en aplicación del principio de Primacía de la Realidad, desarrollado en el numeral 2 del artículo 2 de la LGIT, debe entenderse que existió una relación laboral a plazo indeterminado y de jornada ordinaria entre los trabajadores afectados y la impugnante, desde su fecha de ingreso hasta su fecha de cese, correspondiéndoles todos los beneficios sociales establecidos para el régimen laboral general de la actividad privada y para los cuales se exige, como mínimo, una jornada de cuatro (04) horas diarias, entiéndase, como mínimo la remuneración mínima vital completa, compensación por tiempo de servicios, gratificaciones legales, vacaciones, sobretasa por trabajo en horario nocturno, sobretasa por trabajo en día feriado, tomando como base de cálculo la remuneración mínima vital. 19 LGIT Artículo 2.- Principios ordenadores que rigen el Sistema de Inspección del Trabajo El funcionamiento y la actuación del Sistema de Inspección del Trabajo, así como de los servidores que lo integran, se regirán por los siguientes principios ordenadores: (...) 2. Primacía de la Realidad, en caso de discordancia, entre los hechos constatados y los hechos reflejados en los documentos formales debe siempre privilegiarse los hechos constatados. (Constitucionales, Judiciales y Administrativos) De la infracción a la labor inspectiva, tipificada en el numeral 46.7 del artículo 46 del RLGIT"}]}, {"id": "2023-004", "anio": 2023, "numero": "004-2023", "tipo": "Precedente", "titulo": "Pluralidad sindical y extensión de beneficios a un sindicato minoritario sin acuerdo", "criterio": "Criterio referido a la pluralidad sindical y a los efectos de la extensión de beneficios sobre un sindicato minoritario que no pactó acuerdo (fund. 6.36 a 6.41).", "fundamentos": "6.36, 6.37, 6.38 y 6.41", "palabras": ["pluralidad sindical", "sindicato minoritario", "extensión de beneficios", "libertad sindical", "negociación colectiva"], "temas": [["Libertad sindical y negociación colectiva", "Negociación colectiva", "Pluralidad sindical"]], "archivo": "pdf/2023-004.pdf", "archivo_nombre": "Resolucion-004-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.36", "texto": "Entonces, esta Sala debe proceder al análisis de validez de la invocación de la cláusula celebrada por un sindicato minoritario con el empleador que permitiría extender ciertos beneficios económicos y la denunciada afectación de la afiliación sindical de otro sindicato minoritario. Esto, para establecer si este acuerdo representa una formula válida, conforme con el derecho constitucional de libertad sindical, a propósito del sindicato minoritario pactante, en el ámbito de su actuación."}, {"fundamento": "6.37", "texto": "Con respecto a la primera cuestión, es necesario analizar si el sindicato pactante puede celebrar un acuerdo consistente para autorizar o reconocer que el empleador tiene la facultad de ecualizar ciertas condiciones salariales entre afiliados a su organización, afiliados a otras organizaciones y no sindicalizados en general. Es decir, debe establecerse si el sindicato pactante es el titular de un acto de disposición de semejante alcance."}, {"fundamento": "6.38", "texto": "En el entendimiento de esta Sala, este acuerdo podría tener un efecto antisindical subyacente si es que, en el ámbito respectivo, existe otra organización sindical minoritaria (como ocurre en este caso) o, incluso, si se estuviera formando un sindicato."}, {"fundamento": "6.41", "texto": "Por último, resta anotar que el texto del párrafo 3 de la cláusula primera del convenio suscrito entre la impugnante y el SITRACORPS no representa a un contenido que permita, refuerce o siquiera declare facultad alguna del empleador. El empleador no podría dejar virtualmente sin contenido ni sin aplicación efectiva al ejercicio de la representatividad de una organización sindical dentro de su ámbito de influencia ni bajo la autonomía colectiva ni bajo su propio poder privado. Además, tampoco está autorizado a dejar sin efecto la fuerza vinculante del convenio colectivo, con respecto a la delimitación de su ámbito subjetivo de aplicación, lo que proviene del contenido normativo del artículo 28, inciso segundo de la Constitución Política del Perú, y del bloque de legalidad definido por el artículo 9 del Texto Único Ordenado de la Ley de Relaciones Colectivas de Trabajo, Decreto Supremo Nº 010-2003-TR, que esta referido en el considerando 6.22 del precedente administrativo de observancia obligatoria aprobado mediante Resolución de Sala Plena N° 9-2022-SUNAFIL/TFL, y que permite ver, no se puede alterar este ámbito predefinido por ley."}]}, {"id": "2023-005", "anio": 2023, "numero": "005-2023", "tipo": "Precedente", "titulo": "Medidas preventivas en materia de seguridad y salud en el trabajo", "criterio": "Criterio referente a las medidas preventivas en materia de seguridad y salud en el trabajo (fund. 6.37 a 6.40).", "fundamentos": "6.37, 6.38, 6.39 y 6.40", "palabras": ["medidas preventivas", "seguridad y salud", "SST", "prevención"], "temas": [["Seguridad y salud en el trabajo", "Medidas preventivas", "Medidas preventivas en SST"]], "archivo": "pdf/2023-005.pdf", "archivo_nombre": "Resolucion-005-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.37", "texto": "En ese sentido, se advierte que la LSST tiene como objeto promover una cultura de prevención de riesgos laborales27, a fin de prevenir los accidentes y los daños para la salud que sean consecuencia del trabajo o sobrevengan durante el trabajo. En tal sentido, es el empleador quien garantiza en las instalaciones del centro de trabajo, el establecimiento de los medios y condiciones que protejan la vida, la salud y el bienestar tanto de los trabajadores, así como de aquellos que, no teniendo vínculo laboral, prestan servicios o se encuentran dentro del ámbito del centro de trabajo28."}, {"fundamento": "6.38", "texto": "Así las cosas, la obligación de prevención y con ello el deber de adoptar las medidas preventivas necesarias para el alcance de los principios que rigen la LSST, no solo incumbe al empleador directo del trabajador que resulte afectado por el incumplimiento a la normativa en seguridad y salud en el trabajo, sino que, en virtud del principio de prevención en materia de seguridad y salud en el trabajo, este se extiende a la empresa que acoge en sus instalaciones a personal directo o indirecto, incluso a usuarios o visitantes, es decir, se encuentren dentro de estas."}, {"fundamento": "6.39", "texto": "Estas obligaciones, establecimiento, de medidas preventivas procuran que la prestación del trabajador sea segura y que, durante la relación laboral, dicha actividad no suponga que los riesgos a su integridad física, psíquica y mental no sean gestionados en la forma prescrita por la ley. Es así como la normativa busca lograr la eliminación o eventualmente la reducción de los actos y condiciones sub estándar."}, {"fundamento": "6.40", "texto": "En ese orden de ideas, estas medidas preventivas que son de obligación legal del empleador, así como de la empresa principal, deben estar enfocadas en virtud a las labores y actividades que realiza el sujeto inspeccionado y el trabajador afectado, en cada caso, es decir, que el análisis que realiza la autoridad inspectiva y sancionadora, debe estar enfocado en función a esto, para efectuar un reproche administrativo, por incumplimiento al deber de prevención, el cual no puede ser descartado prima face por la especificidad de los riesgos y peligros que incumben su actividad y cuya especial naturaleza, exigen de mayores elementos y esfuerzos para ejecutar dichas medidas preventivas; más aún si se advierte una mayor peligrosidad y riesgo en el desarrollo de cierto cargo o puesto."}]}, {"id": "2023-006", "anio": 2023, "numero": "006-2023", "tipo": "Precedente", "titulo": "Facultad de integración del Tribunal de Fiscalización Laboral", "criterio": "Criterio referente a la facultad de integración del Tribunal de Fiscalización Laboral (fund. 6.23 y subnumerales).", "fundamentos": "6.23, 6.23.1, 6.23.2 y 6.23.3", "palabras": ["integración", "facultad de integración", "Tribunal de Fiscalización Laboral"], "temas": [["Procedimiento sancionador y principios", "Facultades del Tribunal", "Integración normativa"]], "archivo": "pdf/2023-006.pdf", "archivo_nombre": "Resolucion-006-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.23", "texto": "A criterio de esta Sala, es preciso además advertir que el ejercicio de la facultad de integración prevista en el artículo 17 del Reglamento del Tribunal de Fiscalización Laboral, Decreto Supremo Nº 004-2017TR, debe encontrarse sujeto a la verificación de que tal canalización del procedimiento sancionador a través del Nº 1 Materia Seguridad y Salud en el Trabajo 29 (Constitucionales, Judiciales y Administrativos) Conducta Infractora tipo reglamentario correcto (en el caso: el inciso 27.6 del artículo artículo 27 del RLGIT y no el inciso 28.9 del artículo 28 del RLGIT) no afecte el derecho al debido procedimiento del administrado. Sobre el particular, es importante determinar que, para redirigir válidamente un procedimiento administrativo sancionador bajo un tipo diferente al definido en el recurso correspondiente, ello debe encontrarse respaldado en que tal operación no afecte ni el derecho de defensa ni el debido procedimiento administrativo, siendo particularmente relevante la expresión de la justificación respectiva a través de la motivación. Así, en este caso, la revisión del expediente administrativo y de fiscalización permite advertir los siguientes elementos, los que garantizan el cumplimiento de los requisitos de validez para aplicar la facultad de integración desplegada por el Tribunal de Fiscalización Laboral:"}, {"fundamento": "6.23.1", "texto": "En el acta de infracción se aplicó la sanción por el inciso 27.6 del artículo 27 del RLGIT, frente a lo cual el empleador planteó el descargo al inicio del procedimiento sancionador, tras notificársele el acta de infracción."}, {"fundamento": "6.23.2", "texto": "Al emitirse la primera resolución de la SIRE, si bien se contempló una infracción errónea —que fue rectificada posteriormente— el administrado ejerció su derecho de defensa en el recurso de apelación, citando el inciso 27.6 del artículo artículo 27 del RLGIT, el contenido del acta y aludiendo al error del contenido de la resolución de primera instancia."}, {"fundamento": "6.23.3", "texto": "Aunque el recurso de revisión interpuesto por el administrado se basa en el inciso 28.9 del artículo 28 del RLGIT, se aprecia que el ejercicio de su derecho de defensa se encuentra plenamente garantizado, al poder recoger este Tribunal los argumentos fundamentales que ha expuesto con respecto de la imputación bajo el inciso 27.6 del artículo artículo 27 del RLGIT de sus escritos de defensa, conforme con lo apreciado en el expediente sancionador."}]}, {"id": "2023-007", "anio": 2023, "numero": "007-2023", "tipo": "Precedente", "titulo": "Tipo infractor del numeral 25.19 del artículo 25 del RLGIT", "criterio": "Criterio referente al tipo infractor contenido en el numeral 25.19 del artículo 25 del RLGIT (fund. 6.10 a 6.12, 6.15 a 6.18).", "fundamentos": "6.10, 6.11, 6.12, 6.15, 6.16, 6.17 y 6.18", "palabras": ["25.19", "tipo infractor", "relaciones laborales"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Numeral 25.19"]], "archivo": "pdf/2023-007.pdf", "archivo_nombre": "Resolucion-007-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.10", "texto": "La jurisprudencia constitucional ha enfatizado que la obligación de registro del control de asistencia implica que los empleadores observen la debida diligencia13 en su manejo, pues la normativa invocada no solo prevé que se habilite el registro físico o digital del control de asistencia, sino también que se realice las acciones necesarias para que el mismo cumpla su finalidad, pues constituye un deber de la inspeccionada en su implementación, el adecuado llevado, control y supervisión continua del registro del control de asistencia."}, {"fundamento": "6.11", "texto": "En tal sentido, cuando sea que los empleadores realicen el registro de asistencia de su personal de manera física, deberán poner a disposición de sus trabajadores dicho registro, así como asegurar, bajo responsabilidad, que sus trabajadores cumplan con el registro de su asistencia al centro de labores. Lo mismo ocurre en caso se implemente un registro virtual o biométrico u otro, de similar naturaleza. En cualquier escenario, cuando se evidencie la ausencia del registro de asistencia de uno o más trabajadores, el empleador debe actuar con la debida diligencia para garantizar su adecuada implementación."}, {"fundamento": "6.12", "texto": "Asimismo, el empleador debe garantizar que el registro de asistencia no sufra alteraciones de ningún tipo, lo que puede consistir en deterioro parcial o total que imposibilite continuar con el registro, esto es, en caso evidencie que ha sufrió algún daño, este debe ser motivo de verificación oportuna, así como objeto de la adopción de los mecanismos pertinentes orientados a que se continúe con el correcto registro de la asistencia en el centro de trabajo."}, {"fundamento": "6.15", "texto": "Así, al advertirse que el sujeto inspeccionado actuó con inmediatez para responder a una situación que prima facie resulta antijurídica —dada por la ausencia de marcación en el registro de asistencia—, debe exigirse a la fiscalización laboral que se realice las actuaciones necesarias para determinar fehacientemente una conducta del empleador sustancialmente incongruente con los deberes relacionados al registro de asistencia (cuya gravedad se encuentra tipificada en el numeral 25.19 del artículo 25 del RLGIT). Por ende, si bien esta infracción podría contemplarse como una de carácter objetivo, existen circunstancias que llevan a que la autoridad administrativa examine la responsabilidad del sujeto inspeccionado, como puede ocurrir cuando existe inmediatez entre los hechos, y la posible formulación de exhortaciones a través de medidas adecuadas tales como la advertencia o el requerimiento."}, {"fundamento": "6.16", "texto": "Si el inspeccionado logra probar ante el inspector actuante, en ejercicio de su derecho de defensa durante la fase de fiscalización, el incumplimiento reprochado — en este caso, la ausencia en la marcación del registro de asistencia— que ha merecido su reacción oportuna (dada en un lapso inmediato con respecto a la ocurrencia de los hechos sancionables, como ocurre en este caso, según se ha anotado en la línea temporal graficada en el considerando 6.14), el inspector actuante deberá examinar los actuados de forma cuidadosa para poder emitir una propuesta de sanción adecuadamente motivada. De esta forma, deberá examinarse si el empleador, a través del ejercicio del poder de dirección, busca encausar cierta acción u omisión de sus trabajadores resultante en un incumplimiento del que sea responsable, siempre que el incumplimiento detectado se extienda en un periodo igualmente inmediato (como en este caso, donde tras la detección por la inspección del trabajo de la falta de registro, se produjo la respuesta inmediata del empleador). Así, de verificarse que el lapso por el que se extendió el posible incumplimiento puede entenderse válidamente subsanado —y no exista un periodo de incumplimiento mayor al de la posible conducta subsanadora— no correspondería imputar responsabilidad al administrado, por la falta de determinación de un comportamiento culpable y en aplicación del principio de razonabilidad."}, {"fundamento": "6.17", "texto": "En ese sentido, el numeral 25.19 del artículo 25 del RLGIT, establece la obligación de la inspección del trabajo y de la autoridad administrativa sancionadora de la aplicación coordinada de los principios de tipicidad y de razonabilidad (recogidos en los incisos 4 y 10, respectivamente, del artículo 248 del TUO de la LPAG), lo cual satisface un estándar adecuado para la imputación de responsabilidad administrativa en este tipo de casos."}, {"fundamento": "6.18", "texto": "Siendo que, en el caso de autos, se aprecia que, analizada de forma conjunta los medios de prueba alcanzados por el sujeto inspeccionado en la fase inspectiva del procedimiento —descritos en el numeral 6.13 y 6.14— se verifica que éste ha tenido una conducta dirigida a garantizar el cumplimiento del registro de asistencia por parte de su personal; tal es así que, con inmediatez, desde conocida la omisión en el marcado del registro de asistencia y siendo que el periodo en el que este hecho se ha comprobado representa un lapso igualmente encuadrable dentro de la inmediatez, se advierte que el empleador ejerció su poder de dirección frente a sus trabajadores para disponer que cumplan con su deber de marcar el cuaderno de registro de asistencias que implementó, en su calidad de empleador y garante del mismo."}]}, {"id": "2023-008", "anio": 2023, "numero": "008-2023", "tipo": "Criterio interpretativo (no es precedente)", "titulo": "Demora en la respuesta a requerimientos de información, razonabilidad y culpabilidad", "criterio": "Acuerdo que establece criterios administrativos interpretativos e integradores de observancia obligatoria, distintos de los precedentes, sobre la demora en la respuesta a los requerimientos de información, la razonabilidad y culpabilidad en la imposición de la sanción, y el plazo de cumplimiento de las medidas inspectivas de requerimiento.", "fundamentos": "", "palabras": ["demora", "requerimientos de información", "culpabilidad", "razonabilidad", "plazo de cumplimiento"], "temas": [["Función inspectiva y medidas inspectivas", "Requerimientos de información", "Demora y culpabilidad (criterio interpretativo)"]], "archivo": "pdf/2023-008.pdf", "archivo_nombre": "Resolucion-008-2023-SUNAFIL-TFL.pdf", "textos": []}, {"id": "2023-009", "anio": 2023, "numero": "009-2023", "tipo": "Precedente", "titulo": "Elementos de la medida inspectiva de requerimiento", "criterio": "Criterio referente a los elementos de la medida inspectiva de requerimiento (fund. 6.26, literales a, b, d, e, f y g).", "fundamentos": "6.26 (literales a, b, d, e, f y g)", "palabras": ["elementos", "medida de requerimiento", "mandato", "requerimiento"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Elementos de la medida"]], "archivo": "pdf/2023-009.pdf", "archivo_nombre": "Resolucion-009-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.26", "texto": "La medida inspectiva de requerimiento, al ser una “orden dispuesta por la inspección de trabajo para el cumplimiento de las normas sociolaborales y de seguridad y salud en el trabajo”15, debe contener un mandato claro y su entendimiento debe regirse por la razonabilidad, el deber de colaboración y la buena fe procedimental. En ese sentido, la medida de requerimiento debe cumplir con expresar el ámbito subjetivo y objetivo, siendo estos extremos suficientes para producir el resultado esperado por la medida: la rectificación de una situación antijurídica. a) Ámbito subjetivo: En primer lugar, debe individualizar a los trabajadores afectados por el incumplimiento reprochado al sujeto inspeccionado; b) Ámbito objetivo: En segundo lugar, a) debe identificar la afectación resultante de un comportamiento imputable al empleador —como ocurre en el caso de autos, al describirse el número de horas en sobretiempo laboradas, así como su incumplimiento en el pago— y, b) establecer cómo es que debe cumplirse dicha medida, es decir, qué acciones debe ejecutar el inspeccionado a fin de revertir la conducta reprochada. En ese sentido, el ámbito objetivo de la medida de requerimiento no se agota con la mención de la normativa legal vigente afectada o inobservada por el sujeto inspeccionado, sino que incluye el mandato de su cumplimiento, en la forma y modo esperado. c) En el caso de autos, la medida de requerimiento emitida y notificada con fecha 04 de octubre de 202116, satisface el ámbito subjetivo de su mandato, toda vez que, contiene la individualización de los trabajadores afectados, así como se ha precisado a modo de esquema el número de horas en sobretiempo laborados por estos, a los que, según la fundamentación detallada en dicha medida, se ha incumplido con el pago de las horas extras realizadas, en los términos de la normativa legal vigente. Asimismo, se advierte que, la medida dictada precisa el modo en la que ha de ser satisfecha, conforme la imagen que se inserta a continuación, además, en su parte resolutiva precisa de forma expresa que se debe acreditar “el cálculo y pago de trabajo en sobretiempo de los periodos detallados”, es decir, el cálculo y el pago, debía, finalmente ser ejecutado por la impugnante, conforme el mandato de la medida inspectiva y el modo de ello también se encontraba, plenamente identificado. Figura Nº 01 • 5 La medida inspectiva, precisa la forma de calcular el pago de horas extras: (Constitucionales, Judiciales y Administrativos) • La medida inspectiva, precisa e individualiza a los trabajadores afectados y el número de horas extras efectuadas, como por ejemplo de: \u0003 • La medida inspectiva, dispone cómo se ha de cumplir su mandato. d) Así las cosas, un análisis circunscrito únicamente a la determinación del quantum a cancelar por los incumplimientos en materia de relaciones laborales de significado económico, como supuesto de quiebre del principio de legalidad (arguyéndose la “necesidad” de una identificación específica del monto a cancelar por parte del sujeto inspeccionado por los incumplimientos laborales de naturaleza económica), resulta erróneo; toda vez que el bloque de legalidad invocable (conforme con lo dispuesto por los artículos 5 y 14 de la LGIT y los artículos 13 y 17 del RLGIT) no establece como requisito sine qua non que la medida inspectiva de requerimiento deba identificar el monto dinerario que adeuda el sujeto inspeccionado. e) En ese sentido, estando a lo dispuesto en el artículo 10 de la LPAG, solo es causal de nulidad, entre otros, la contravención a la Constitución a las leyes o a las normas reglamentarias o por el defecto u omisión de algún requisito de validez. Sobre el particular ni la LGIT ni el RLGIT, norma especial del Sistema de Inspección Laboral, así como ni la LPAG, disponen de forma expresa como condición de validez de la medida inspectiva de requerimiento, la determinación del monto que el administrado adeuda a su trabajador (a) o trabajadores (as) por un incumplimiento al ordenamiento jurídico laboral o de seguridad y salud en el trabajo o de la seguridad social, en números y letras. f) Por tanto, el argumento referido a que la medida de requerimiento es imprecisa, por no expresar en términos numéricos el monto adeudado en favor de los “supuestos trabajadores afectados” resulta infundado con relación al contenido del principio de legalidad, por no haberse previsto que este sea un requisito necesario para su validez. Además, este alegato, resulta, también, contrario al principio de razonabilidad, como manifestación de una adecuada proporción entre los medios y fines dispuestos ante un caso concreto; en tanto se verifique que la medida dictada ha sido emitida de acuerdo a la facultad discrecional de la inspección del trabajo, por los incumplimientos advertidos, referidos a la realización de labores en sobretiempo de sus trabajadores, hechos derivados del propio expediente y cuyo mandato resulta claro; lo que evidencia, además, su proporcionalidad. Finalmente, este argumento es desechable por contravenir al deber de colaboración con la inspección del trabajo, tomándose en cuenta que el empleador está obligado a contribuir con la fiscalización y que, además, esta colaboración redunda en un comportamiento material que le es exigible como sujeto obligado a pagar los beneficios laborales de forma integral. g) En este punto, debe recordar que de acuerdo a los principios que guían a la inspección de trabajo contenidos en la LGIT, así como los mandatos recogidos en el RLGIT, esta tiene una autonomía técnica y funcional, por lo que, los adminsitrados, en este caso la recurrente, no puede pretender guiar o dirigir la función o competencias de dichos servidores o el modo en cómo es que se realiza la inspección de trabajo; en consecuencia, el argumento de la recurrente referido a que la medida inspectiva de requerimiento dictada debió individualizar el monto a cancelar, debe ser desestimado. h) En ese orden de ideas, se aprecia de los actuados que la medida inspectiva de requerimiento ha sido emitida al amparo del artículo 14 de la LGIT, y conforme con lo dispuesto en el numeral 17.2 del artículo 17 del RLGIT, al advertirse, que la impugnante no había cumplido con la normativa vigente del ordenamiento sociolaboral. Por tanto, la emisión de la medida inspectiva resulta razonable, pues la materia de inspección está orientada al cumplimiento de la normativa sociolaboral, derivadas de la Orden de Inspección Nº 723-2021-SUNAFIL/IRE-APU; por ende, se observa la razonabilidad, proporcionalidad y legalidad de la medida inspectiva de requerimiento; en consecuencia, no cabe acoger lo alegado por la recurrente en este extremo. i) Sobre el argumento referido a una afectación de la Directiva Nº 001-2020-SUNAFIL/INII; al respecto, debe indicarse que conforme los artículos 14 y 16 del Reglamento del Tribunal, así como de lo dispuesto en los precedentes administrativos de observancia obligatoria17, mediante las Resoluciones de Sala Plena Nros. 002-2022-SUNAFIL/TFL y 003-2022-SUNAFIL/ TFL, publicadas el 06 de mayo y 17 de agosto de 2022, respectivamente, el recurso de revisión debe sustentarse en la aplicación o interpretación errónea de las normas de derecho laboral, o en el apartamiento inmotivado de los precedentes de observancia obligatoria del Tribunal. En ese sentido, la Directiva invocada por la recurrente no constituye ni un mandato legal, por no tener tal rango, ni es un precedente vinculante de observancia obligatoria; por lo que, carece de asidero los argumentos expuestos en dicho extremo. j) Cabe señalar que el sujeto inspeccionado tiene el deber de colaboración con la labor inspectiva, ello en concordancia no solo con lo dispuesto en el RLGIT y LGIT, sino también en lo prescrito en el ordenamiento jurídico sociolaboral. Sin embargo, conforme los hechos constatados en el Acta de Infracción, la recurrente no ha cumplido con lo dispuesto en la medida inspectiva de requerimiento, conforme los términos indicados en esta y en el plazo conferido por la inspección de trabajo, lo cual constituye una infracción a la labor inspectiva, tipificada en el numeral 46.7 del artículo 46 del RLGIT. k) Por todo lo expuesto, se deben desestimar todos los argumentos dirigidos a cuestionar este extremo, por cuanto se encuentra acreditado que la impugnante ha incurrido en una (01) infracción muy grave a la labor inspectiva, tipificada en el numeral 46.7 del artículo 46 del RLGIT, conforme lo determinado por la autoridad sancionadora. l) En cuanto a la nulidad invocada por la impugnante, esta debe ser desestimada, al no evidenciarse que se haya incurrido en alguna causal de nulidad contemplada en el artículo 10 del TUO de la LPAG, en los términos alegados por la recurrente. 2017-TR, la Sala Plena del Tribunal de Fiscalización Laboral tiene la facultad de aprobar, modificar o dejar sin efecto los precedentes de observancia obligatoria. 8.2. En tal sentido, atendiendo a los elementos de la medida inspectiva de requerimiento, la Sala Plena del Tribunal de Fiscalización Laboral, por unanimidad, considera relevante que el criterio contenido en el fundamento 6.26, literales a), b), d), e), f) y g) de la presente resolución, sean declarados precedente administrativo de observancia obligatoria para todas las entidades conformantes del Sistema de Inspección del Trabajo."}]}, {"id": "2023-010", "anio": 2023, "numero": "010-2023", "tipo": "Precedente", "titulo": "Registro del control del tiempo de trabajo e irrenunciabilidad de derechos", "criterio": "Criterio referente al registro del control del tiempo de trabajo y al principio de irrenunciabilidad de derechos en el ámbito laboral (fund. 6.20 y 6.38 a 6.40).", "fundamentos": "6.20, 6.38, 6.39 y 6.40", "palabras": ["registro de control", "control de asistencia", "tiempo de trabajo", "irrenunciabilidad", "asistencia"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Registro de control de asistencia"]], "archivo": "pdf/2023-010.pdf", "archivo_nombre": "Resolucion-010-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.20", "texto": "Bajo ese entendimiento, consolidado en la corriente resolutiva del Tribunal de Fiscalización Laboral, se reitera que el registro de asistencia válido de acuerdo con las disposiciones legales vigentes es aquel que, conforme con el artículo 3º del Decreto Supremo Nº 004-2006-TR, “puede ser llevado en soporte físico o digital, adoptándose medidas de seguridad que no permitan su adulteración, deterioro o pérdida”. En ese sentido resulta pertinente diferenciar el registro del control de asistencia y el tareo, ya que el primero constituye una obligación legal del empleador, al que la norma reserva una serie de características que debe cumplir para considerarlo válido, siendo materia de fiscalización por parte de la Autoridad Administrativa de Trabajo; mientras que el tareo es un documento de gestión interna del empleador, donde los trabajadores suelen registrar la ejecución de sus actividades diarias. Por tanto, dada la naturaleza del fenómeno objeto de registro y control – el cumplimiento de la jornada laboral - esta instancia de revisión deja constancia de que no contar con el registro de control de asistencia constituye una infracción de carácter insubsanable, por no poder retrotraerse el tiempo registrado (o el que se hubiere trabajado y no se haya registrado) a una verdad comprobable."}, {"fundamento": "6.38", "texto": "En tal sentido, lo alegado por la impugnante, en el extremo referido a que los propios trabajadores señalaron que no deseaban ser ingresados a planilla dado que perderían sus beneficios, no tiene respaldo jurídico en nuestro sistema legal; cabe señalar además que no se advierte que el recurrente haya invocado algún derecho fundamental o principio (ni se vislumbra alguno que esta instancia de revisión pueda examinar de oficio) que sustente su argumentación. En ese orden de ideas, la irrenunciabilidad de derechos es definida como el principio jurídico por el cual existe una “imposibilidad jurídica de privarse voluntariamente de una o más ventajas concedidas por el Derecho Laboral en beneficio propio”;20 precisándose que la fuente de tales derechos debe tener naturaleza imperativa,21 y que tal virtud puede ser extendida a las normas internacionales del trabajo, así como a las cláusulas normativas de los convenios colectivos22."}, {"fundamento": "6.39", "texto": "En virtud del reconocimiento de la irrenunciabilidad de derechos como principio jurídico, esta Sala debe afirmar que no se advierte un parámetro significativo que permita reconocer que su aplicación deba ser afectada en el caso en concreto, de manera que el empleador pueda ser exonerado de la responsabilidad administrativa que le concierne al no haber inscrito a su personal en la planilla electrónica como trabajadores y en el régimen de seguridad social en pensiones y salud correspondientes."}, {"fundamento": "6.40", "texto": "En línea con lo analizado, el administrado no puede alegar que la supuesta renuncia de sus trabajadores a un derecho indisponible, pueda aliviarle de sus responsabilidades legales como empleador. Al respecto, cabe señalar que el principio de culpabilidad tiene un estándar debido de cumplimiento, ya que el empleador es el centro de imputación de responsabilidad laboral para el cumplimiento de las obligaciones laborales, tales como la observancia de los deberes de registro que la normativa laboral imperativa ha establecido. De esa forma, siendo un comportamiento exigible bajo estándares de diligencia razonables, el empleador no puede exonerarse del cumplimiento del deber de formalizar a su personal bajo un pretexto de acuerdo unilateral ni bilateral sustentado en la renuncia de derechos fundamentales."}]}, {"id": "2023-012", "anio": 2023, "numero": "012-2023", "tipo": "Precedente", "titulo": "Reducción del 90% de la sanción, deber de colaboración y facultades de supervisión", "criterio": "Criterios sobre la reducción del 90% de la sanción en los supuestos previstos (fund. 18 a 20), la obligación del empleador de colaborar con las actuaciones inspectivas (fund. 25 a 28) y las facultades de supervisión de la autoridad inspectiva (fund. 33 y 34), además de los fundamentos 11 a 13 y 39 a 43.", "fundamentos": "11, 12, 13, 18, 19, 20, 25, 26, 27, 28, 33, 34, 39, 40, 42 y 43", "palabras": ["reducción", "90%", "reducción de la sanción", "subsanación", "colaboración", "deber de colaboración", "supervisión", "facultades de supervisión"], "temas": [["Procedimiento sancionador y principios", "Sanciones", "Reducción de la sanción (90%)"], ["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Deber de colaboración del administrado"], ["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Facultades de supervisión"]], "archivo": "pdf/2023-012.pdf", "archivo_nombre": "Resolucion-012-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "11", "texto": "Atendiendo a lo explicado, este Tribunal considera que la labor del personal inspectivo debe orientarse a verificar el cumplimiento de las normas objeto de su competencia, para lo cual corresponde que adopte y ponga en práctica todas las medidas y acciones de investigación que tiene a su disposición y que sean pertinentes para cada caso concreto. En tal sentido, en situaciones en las que este advierta la falta de respuesta de un primer requerimiento de información por medio de sistemas de comunicación electrónica, se debe considerar efectuar alguna otra modalidad de actuación inspectiva (por ejemplo, una visita de inspección o una comparecencia), con la finalidad de emplear alternativas adicionales de investigación que coadyuven en la determinación o no del cumplimiento sociolaboral investigado."}, {"fundamento": "12", "texto": "Adicionalmente, siempre que sea razonable, el inspector debe considerar la comunicación con el sujeto inspeccionado por vía telefónica, mensajes de texto, mensajería instantánea (por ejemplo: WhatsApp) o mediante cualquier otro mecanismo que tenga por finalidad establecer contacto directo con algún representante del empleador para informarle sobre la notificación realizada a la casilla electrónica. Esto, conforme con los antecedentes de cada empleador fiscalizado, reconociendo en la prexistencia de comunicaciones entre dicho administrado o de sus representantes y los servidores de la inspección del trabajo, un valor necesario para procurar contacto bajo estos canales, cuando exista la autorización correspondiente (expresa o tácita). En ese sentido, el proceder del personal inspectivo debe conducir, al cumplimiento de las funciones establecidas en la LGIT y su reglamento, agotando todos los medios necesarios para lograr el objetivo de la orden de inspección."}, {"fundamento": "13", "texto": "Si el personal inspectivo se dirigiese al sujeto inspeccionado para que presente información por casilla electrónica, sin respuesta de parte del sujeto requerido, y se limita a reiterar su solicitud bajo el mismo canal, sin procurar otro tipo de comunicación o sin disponer otra actuación inspectiva de investigación, resultará difícil la concreción de la finalidad de la inspección del trabajo. Los acápites anteriores y otros medios emprendidos creativamente deben permitir al fiscalizador actuante cumplir con el objeto de la inspección, procediendo con la profundidad y diligencia que corresponde en el marco de la finalidad y objetivo de la Inspección del Trabajo."}, {"fundamento": "18", "texto": "De la normativa expuesta se puede desprender claramente que existen dos supuestos de hecho para la aplicación de la reducción del 90% de la sanción impuesta por la determinación de infracciones a la labor inspectiva previstas en los numerales 46.6 y 46.10 del artículo 46 del RLGIT, siendo estos los siguientes: a. Que el sujeto inspeccionado acredite, antes de la expedición del acta de infracción, la subsanación de todas las infracciones sociolaborales o de seguridad y salud en el trabajo, advertidas por la autoridad administrativa. b. Que a partir de las actuaciones inspectivas de investigación, el personal inspectivo o la autoridad administrativa responsable del procedimiento administrativo sancionador, verifiquen que el administrado, no ha incurrido en incumplimiento relacionado al objeto de la medida de requerimiento."}, {"fundamento": "19", "texto": "En tal sentido, para la aplicación de lo dispuesto en el numeral 17.3 del artículo 17 del RLGIT, no se requiere que se satisfaga ambos supuestos de hecho, toda vez que la citada norma contempla una preposición disyuntiva y no copulativa, conforme se ha establecido, por ejemplo, en la Resolución Nº 633-2023-SUNAFIL/TFL-Primera Sala."}, {"fundamento": "20", "texto": "En ese contexto, para determinar su aplicación, la autoridad administrativa debe realizar un juicio de subsunción de la conducta y hechos determinados en el procedimiento administrativo sancionador con los supuestos de hecho que contiene el numeral 17.3 del artículo 17 del RLGIT, y verificar si se subsume en uno de estos. C. Precisiones con relación al deber de colaboración con la labor inspectiva"}, {"fundamento": "25", "texto": "De la normativa expuesta, se desprende que constituye una obligación ineludible de los empleadores el colaborar con el desarrollo de las actuaciones inspectivas, coadyuvando a que las mismas se logren desarrollar en atención a su finalidad, esto es, la verificación del cumplimiento de las normas de trabajo. Es decir, el deber de colaboración es una posición jurídica por el cual el empleador y todo administrado están obligados a ejecutar prestaciones de las que es responsable administrativamente."}, {"fundamento": "26", "texto": "Así, en observancia del deber de colaboración y conforme lo dispuesto en los artículos 5 y 9 de la LGIT y 15 del RLGIT, los requerimientos efectuados en el marco de las fiscalizaciones laborales deben ser tomados muy seriamente por el administrado. Siendo que se vulnera este precepto legal cuando el comportamiento del administrado impide que el personal inspectivo cumpliera con el objeto de la inspección, al frustrar su labor, conforme se ha establecido, por ejemplo, en las Resoluciones Nº 954-2022-SUNAFIL/TFL-Primera Sala y 714-2023-SUNAFIL/TFL-Primera Sala."}, {"fundamento": "27", "texto": "En ese sentido, cuando el sujeto inspeccionado incurre en un error, al remitir la información solicitada por la autoridad inspectiva, generando la frustración de la labor inspectiva, su comportamiento no puede ser encuadrado dentro de alguna eximente o justificante del incumplimiento a su deber de colaboración a la labor inspectiva, toda vez que la atención de los requerimientos efectuados por la inspección laboral resulta un asunto de vital importancia para la consecución de los fines y objeto de la inspección de trabajo. Por ello, cuando el canal de comunicación entre el administrado y la autoridad inspectiva sea una dirección de correo electrónico, por cuyo medio se debe dar cumplimiento al requerimiento efectuado, resulta razonable exigir que el administrado tenga una conducta diligente y rigurosa para ello, esto es, por ejemplo, con la digitación correcta de dicho canal de comunicación a fin de hacer efectiva la inspección."}, {"fundamento": "28", "texto": "Cabe señalar que el sujeto inspeccionado es el responsable de su personal, cualquiera sea la estructura organizacional que haya establecido la empresa, encontrándose en la obligación de establecer las precauciones pertinentes y razonables a fin de que aquel (dispuesto en los diversos centros de trabajo reconocidos por la legislación o en donde el fenómeno laboral sea relevante) se encuentre en la capacidad de poder atender a las posibles actuaciones de la inspección del trabajo para propósitos tales como la gestión de los documentos que le sean notificados en la sede central, domicilio fiscal, establecimientos anexos y/u otros centros de trabajo en los que realice sus actividades. D. El derecho fundamental a la prueba y el deber de valoración de los documentos presentados en la fase inspectiva"}, {"fundamento": "33", "texto": "Por ello, en la misma medida en la que la autoridad inspectiva cuenta con amplias facultades de supervisión, extendiéndose a todos los sujetos obligados o responsables del cumplimiento de la normativa sociolaboral, los inspectores comisionados deben realizar todas las acciones legalmente permitidas para cumplir con la función de vigilancia y exigencia que les ha sido conferida; sin inhibirse de examinar, analizar y valorar los documentos que son presentados por el sujeto inspeccionado a lo largo del procedimiento inspectivo, sea como respuesta a los requerimientos efectuados por la autoridad inspectiva o como contraprueba."}, {"fundamento": "34", "texto": "En ese sentido, se atenta contra la finalidad de la inspección laboral al acudir a formalismos o exigencias en la forma de presentación de la información solicitada, sin revisar la data exhibida por el sujeto inspeccionado, dando por concluida las actuaciones inspectivas e imputándose la falta de colaboración del sujeto inspeccionado por no presentar lo requerido por la actuación inspectiva, en el medio solicitado. Tal proceder resulta contrario a lo establecido en el precedente administrativo de observancia obligatoria establecido en la Resolución de Sala Plena Nº 002-2021-SUNAFIL/TFL (fundamento 23), así como a los principios de verdad material e informalismo, expresamente reconocidos en el Texto Único de la Ley del Procedimiento Administrativo General, Ley Nº 27444, aprobado por el Decreto Supremo Nº 004-2019-JUS. E. Finalidad y razonabilidad de los Requerimientos de Información"}, {"fundamento": "39", "texto": "En ese entendido, en el ejercicio de sus funciones, los inspectores comisionados, deben procurar que la información solicitada en los requerimientos de información se encuentre orientada a las materias objeto de inspección y/o a propiciar el cumplimiento de las actuaciones inspectivas. Así, resulta importante que busquen determinar de manera clara y precisa la documentación y/o información requerida, evaluando para dicho fin, los documentos y alegatos que vayan presentado los administrados durante el desarrollo de las actuaciones inspectivas, para la emisión de los requerimientos de información posterior. Por ejemplo, si como respuesta a un primer requerimiento de información, en el marco de las investigaciones llevadas a cabo en mérito a una orden de inspección que tiene como una de sus materias “registro en planilla”, la inspeccionada señala que no puede cumplir con presentar el contrato de trabajo porque el trabajador supuestamente afectado era formalmente un locador de servicio, no resulta pertinente que el comisionado requiera nuevamente la presentación de los contratos de trabajo, debiendo, en todo caso, evaluar de manera razonable las circunstancias y de ser el caso adoptar las acciones necesarias a fin de poder verificar, solicitando otro tipo de documentación y empleando otras herramientas de investigación, las materias objeto de fiscalización."}, {"fundamento": "40", "texto": "Resulta importante, para el regular el desarrollo de las actuaciones inspectivas, que el rol de los inspectores comisionados permita viabilizar las actuaciones, coadyuvando positivamente al deber de colaboración de los inspeccionados, por lo que el contenido de los requerimientos de información debe permitir a las inspeccionadas tener la certeza de lo requerido y la forma de cumplimiento. En ese entendido, los (Constitucionales, Judiciales y Administrativos) inspectores comisionados deben efectuar sus requerimientos de información de forma pertinente, en consideración con las materias determinadas en la orden de inspección, evaluando las circunstancias en cada caso, evitando efectuar requerimientos reiterativos pese al conocimiento certero de la ausencia o inexistencia de la documentación requerida, y adoptando acciones alternativas para lograr los fines de la fiscalización."}, {"fundamento": "42", "texto": "Es oportuno precisar que, el requerimiento de información no constituye el único medio por el cual el inspector de trabajo pueda efectuar su labor inspectiva, sino más bien, constituye una de las múltiples acciones que puede desplegar en el ejercicio de sus funciones; pues también puede desarrollar visitas a los centros y lugares de trabajo, por ejemplo, ello con el objeto de que aprecie y observe in situ, los hechos materia de investigación, así como también pueda recabar declaraciones a los trabajadores o personal directivo de la inspeccionada."}, {"fundamento": "43", "texto": "Sin perjuicio de lo indicado, resulta pertinente señalar que, dependiendo de las materias de investigación que dispone la orden de inspección, lo óptimo consistirá en desarrollar todas las modalidades de actuación que correspondan, y no proceder de manera exclusiva, mediante requerimientos de información. Inclusive en algunos supuestos, la investigación, podría relegar esta modalidad de investigación (requerimiento de información), por otras actuaciones, como la visita inspectiva. Todo esto con el fin de optimizar y hacer efectiva la investigación, lo cual podría suceder, por ejemplo, en el marco de una inspección por el incumplimiento de las disposiciones relacionadas con derechos fundamentales en el trabajo. III. DECISIÓN TRIBUNAL DE FISCALIZACIÓN LABORAL SALA PLENA RESOLUCIÓN DE SALA PLENA N° 013-2023-SUNAFIL/TFL EXPEDIENTE SANCIONADOR : 104-2018-SUNAFIL/ILM PROCEDENCIA : INTENDENCIA DE LIMA METROPOLITANA IMPUGNANTE : BAFUR S.C.R.LTDA. ACTO IMPUGNADO : RESOLUCIÓN DE INTENDENCIA N° 330-2022-SUNAFIL/ILM MATERIA"}]}, {"id": "2023-013", "anio": 2023, "numero": "013-2023", "tipo": "Precedente", "titulo": "Indicios de subordinación y primacía de la realidad para determinar la relación laboral", "criterio": "Criterios sobre la existencia de subordinación (manifestaciones del poder directriz y de control) y la aplicación de la primacía de la realidad para determinar la relación laboral (fund. 6.24, 6.25, 6.31 y 6.32). La resolución también reclasifica una infracción muy grave del numeral 25.6 como grave.", "fundamentos": "6.24, 6.25, 6.31 y 6.32", "palabras": ["subordinación", "relación laboral", "primacía de la realidad", "poder directriz", "laboralidad", "prestación de servicios", "25.6"], "temas": [["Relación de trabajo y derechos laborales", "Existencia de relación laboral", "Subordinación y primacía de la realidad"], ["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Numeral 25.6 (reclasificación de la infracción)"]], "archivo": "pdf/2023-013.pdf", "archivo_nombre": "Resolucion-013-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.24", "texto": "Conforme se aprecia de esta comunicación, la administrada ejerció el poder directriz plasmado en su facultad organizativa, promoviendo a la prestadora de servicios a una estructura retributiva más elevada. Esta variación no obedece a un convenio u adenda que sustenten la novación. Por el contrario, da noticia de la existencia de una organización que estructuró a la prestación de servicios de la trabajadora, la sometió a supervisión sobre la calidad de los servicios ejecutados y, valorándola positivamente, desplazó a la trabajadora hacia condiciones salariales más beneficiosas, que eran consecuentes con los instrumentos y fines del empleador. En rigor, nos encontramos ante la evidencia de la facultad premial del empleador, elemento que denota al ejercicio del poder normativo por parte de la recurrente, con relación a la ex trabajadora."}, {"fundamento": "6.25", "texto": "Con relación a este fenómeno, encontramos que su conceptuación como ejercicio de la facultad premial del empleador es descrito como un comportamiento que “se encuentra restringida al ejercicio regular del poder de dirección que incluye la facultad premial del empleador y al cumplimiento de su deber genérico de protección. En este sentido, el empleador podrá otorgar unilateralmente incrementos remunerativos o gratificaciones que se encuentren vinculadas causalmente con el contrato de trabajo, es decir, que sean contraprestativas y no liberales, o que tengan una finalidad asistencial”.16 Igualmente, podemos indicar que el poder de dirección comprende a la facultad premial.17 De lo anotado, debe concluirse que cuando el inspector actuante ha calificado a la prestación de servicios como subordinada a partir de la evidencia de la facultad premial (que, en este caso, proviene de un sustento escrito en el que se denota su causalidad en razón de los resultados positivos de la fiscalización de la actividad desempeñada por la profesional) se evidencia un razonamiento inferencial correcto. A través de una manifestación del poder de dirección se ha comprobado su existencia en la relación contractual. Por ello, este Tribunal considera que este razonamiento no solo es acogible para los propósitos del expediente analizado, sino que resulta conveniente explicitar ante los componentes del Sistema de Inspección del Trabajo con rango de precedente vinculante que la calificación de una relación contractual como laboral puede tomar como evidencia válida a la facultad premial, con las adecuaciones que resulten convenientes en cada caso."}, {"fundamento": "6.31", "texto": "En torno a estas últimas manifestaciones de subordinación anotadas, resulta pertinente destacar la particular relevancia de dos de las mismas, en el presente caso. En efecto, tenemos en primer lugar, que el administrado ha dispuesto la posibilidad de proceder con la imposición de las multas aludidas en caso de no registrarse las horas “trabajadas”; al respecto, nótese que hay una disposición empresarial que presenta una evidente concreción de su potestad disciplinaria, que, aunque irregular en este caso por no adoptar algunas de las manifestaciones que puede adoptar esta (amonestación, suspensión o despido), creemos, no enerva de ninguna manera cómo esta disposición “revela a todas luces” las consecuencias sancionatorias, de una obligación contractual (laboral). Y es que, sin perjuicio de la modalidad correcta que debe tener una sanción laboral, queda claro que el empleador podría adoptar una modalidad distinta para pretender disciplinar una inconducta de su trabajador, subyaciendo a aquella (sea correcta o no) el objetivo que finalmente viene persiguiendo: sancionar al trabajador."}, {"fundamento": "6.32", "texto": "En segundo lugar, cabe llamar la atención sobre la planificación de la actividad de la trabajadora para que cumpla con asistir a un seminario sobre “imagen profesional”. Atendiendo a los servicios que brindaba la trabajadora afectada a la administrada fue (Abogada Asociada y Abogada Asociada Semi-Senior B), se advierte que, dicha obligación manifiesta, también, claramente, una orden o instrucción de trabajo ciertamente particular en este caso, debido a la indumentaria y apariencia profesional que normal y socialmente se asocian a la labor de un/a abogado/a. Existen incluso estudios académicos que han puesto en evidencia que: “el aspecto más valorado socialmente sobre el abogado sea la presentación personal. (…) Parte de la imagen social del abogado está compuesta por su uniformidad pulcra en el vestir, elemento no solo distintivo sino, además, decisivo en el éxito y en el fracaso del profesional”25. Ello manifiesta que hay una especial preocupación de la administrada de exigir que sus abogados/as, como la trabajadora afectada, tengan una apariencia, vestimenta e imagen particular y especial, acorde con las convenciones sociales relativas a la labor de la asesoría legal, por lo que, la puesta en conocimiento y exigencia de asistencia a este seminario, se erige como la puesta en práctica del poder de dirección y organización que ostenta el administrado. En dicho orden de ideas, las instrucciones proporcionadas a la trabajadora afectada, a fin de que asista a un seminario sobre “imagen profesional”, atendiendo a las funciones que desempeñaba, manifiesta también en este caso, una clara muestra de ejercicio del poder de dirección del administrado."}]}, {"id": "2023-014", "anio": 2023, "numero": "014-2023", "tipo": "Precedente", "titulo": "Tipo infractor del numeral 25.17 y exigibilidad de los numerales 25.22 y 25.23", "criterio": "Criterio sobre el tipo infractor del numeral 25.17 del artículo 25 del RLGIT y la delimitación de la exigibilidad de los numerales 25.22 y 25.23 para administrados distintos al sector privado (fund. 6.8, 6.21, 6.22, 6.25, 6.26, 6.33 a 6.35, 6.45 y 6.49).", "fundamentos": "6.8, 6.21, 6.22, 6.25, 6.26, 6.33, 6.34, 6.35, 6.45 y 6.49", "palabras": ["25.17", "25.22", "25.23", "sector público", "exigibilidad", "tipo infractor"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Numerales 25.17, 25.22 y 25.23"]], "archivo": "pdf/2023-014.pdf", "archivo_nombre": "Resolucion-014-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.8", "texto": "En tal sentido, el Sistema Jurídico debe prevenir y erradicar todo comportamiento que entre en conflicto con el principio y derecho fundamental de igualdad y no discriminación. En especial, la actuación de la fiscalización laboral y de los órganos sancionadores del Sistema de Inspección del Trabajo deben orientarse especialmente a la determinación y sanción de los tratos discriminatorios basados en motivos prohibidos por factores sociohistóricos, como son el género, raza, color, idioma, religión o convicción, opinión política o de otra índole, origen nacional, étnico o social, nacionalidad, edad, situación económica, patrimonio, estado civil, nacimiento o cualquier otra condición semejante."}, {"fundamento": "6.21", "texto": "En tal sentido, existe armonía entre lo dispuesto en el inciso 2 del artículo 2, el artículo 23 de la Constitución Política y lo revelado en el ordenamiento jurídico supranacional — en particular, los Convenios Nros. 100 y 111 de la OIT, que componen los principios y derechos fundamentales del Sistema Universal de Derechos Humanos laborales— en cuanto refieren que la distinción en el trato que se encuentra fundada en situaciones como las descritas (origen, raza, sexo, idioma, religión, opinión, condición económica) se encuentran prohibidas. No obstante, estos supuestos no son limitativos, sino que conforme a la redacción del inciso 2 del artículo 2 de la Constitución y del numeral 1.1 del artículo 1 del Convenio Nº 111 de la OIT, existe un numerus apertus o cláusula abierta, cuando refieren a comportamientos fundados en “cualquier otra índole” / “cualquier otra distinción”, respectivamente."}, {"fundamento": "6.22", "texto": "Sin embargo, es importante precisar que este último supuesto de lesión al principio-derecho de igualdad, referido al comportamiento de diferenciación que se sustenta en la expresión “cualquier otra índole”, siendo naturalmente distinto a los expresamente enunciados en la Constitución Política actual, no implica que cualquier otro acto de diferenciación configure un acto de discriminación reprochable por nuestro ordenamiento jurídico. De allí que resulta trascendente lo señalado por el Tribunal Constitucional en su línea jurisprudencial, como por ejemplo en las sentencias recaídas en los expedientes Nros. 0008-2005-AI y 05652-2007-PA/TC, ya que exige, para la calificación de un comportamiento como discriminatorio (y, por ende, contrario al ordenamiento vigente) que se determine que tal conducta no se sustente en una justificación objetiva y razonable. En tal sentido, solo cuando la desigualdad de trato no sea razonable ni proporcional, estaremos ante una discriminación y, por tanto, frente una desigualdad de trato constitucionalmente intolerable21."}, {"fundamento": "6.25", "texto": "En ese sentido, en el caso que nos compete, el recurrente ha planteado un argumento por el que pretende excluirse de la exigibilidad de la medida inspectiva de requerimiento, bajo el pretexto de formar parte de una entidad estatal como FONAFE, y de este modo, que la autoridad inspectiva se inhiba de emitir dicha medida. Conforme con lo expuesto sobre la igualdad ante la ley, todo ciudadano y entidad debe recibir semejante trato de parte de la autoridad fiscalizadora, salvo cuestión objetiva que ciertamente no se aprecia en este caso, pues la comprobación del cumplimiento del principio de igualdad y no discriminación, en general, se extiende a todas las relaciones laborales en las que la inspección del trabajo tiene competencia. De allí que la LGIT y el RLGIT prescriban que todos los sujetos inspeccionados, sin distinción alguna, se encuentran en el deber de colaborar con la autoridad inspectiva, así como acatar los mandatos contenidos en sus requerimientos. Por tanto, el administrado tiene el deber de cumplir con su deber de colaboración con la labor inspectiva, más aún si los dispositivos normativos vigentes, no han hecho ninguna distinción específica respecto a las entidades públicas o empresas del Estado que lo eximan de responsabilidad por este tipo de incumplimientos, salvo que se haya acreditado con elementos de prueba alguna insuficiencia en la asignación presupuestal, autorización de gasto y ejecución, en los términos indicados en el precedente administrativo de observancia obligatoria establecido en la Resolución de Sala Plena Nº 002-2021-SUNAFIL/TFL (fundamento 39, 40 y 41), lo cual no ha ocurrido en el presente caso. Por ende, corresponde desestimar el argumento expuesto en dicho extremo."}, {"fundamento": "6.26", "texto": "Del marco normativo y doctrinario expuesto, se aprecia dos tipos de discriminación, la primera contenida en una conducta de diferenciación que se sustenta en un motivo prohibido, esto es, la acción u omisión del agente en contra del trabajador (a) por motivos históricamente vedados, como la raza, color, sexo, religión, opinión política, ascendencia nacional u origen social. La segunda, sustentada en “cualquiera otra distinción27” o como la Constitución Política de 1993 señala “cualquier otra índole”, es decir, que se funde en un supuesto distinto a los expresamente proscritos 13 por nuestro ordenamiento constitucional y supranacional. Comportamientos que, además, deben tener como efecto anular o alterar la igualdad de oportunidades o de trato en el trabajo."}, {"fundamento": "6.33", "texto": "Así, el motivo del escalamiento en la punición de ciertas conductas del administrado se funda en el interés protector del Estado que —por medio del contenido de sus normas punitivas— busca hacer eficaces los derechos fundamentales en el trabajo. Con este fin, el RLGIT ha dispuesto sanciones agravadas a conductas referidas a las peores formas de afectación de derechos fundamentale, tales como ciertas afectaciones a los derechos colectivos (artículo 48.1-B del RLGIT), el trabajo forzoso y las peores formas de trabajo infantil (artículo 48.1-D del RLGIT) o ciertos atentados contra la seguridad y salud en el trabajo (artículo 48.1-C del RLGIT). Por su par
