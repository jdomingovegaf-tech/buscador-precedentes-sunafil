 a efectos de determinar los siguientes supuestos, para aplicar las normas involucradas con arreglo a los principios de legalidad, tipicidad y razonabilidad: i) Sub contratación íntegra sin confluencia de trabajadores de la empresa principal: Cuando el destaque de trabajadores hacia la empresa principal es íntegro y la actividad de estos no confluye con los trabajadores directos de la empresa principal, la responsabilidad en materia de seguridad y salud en el trabajo con la multa agravada contenida en el numeral 48.1-C del artículo 48 del RLGIT recaerá directamente en la empresa contratista. Este reproche administrativo hacia esta última no debe ser confundida con la que incumbe a la empresa principal. En este escenario, la responsabilidad administrativa de la empresa principal resultará válidamente determinada siempre que se acredite que su incumplimiento en el deber de coordinación y/o vigilancia en materia de seguridad y salud en el trabajo ocasionó (fue nexo causal) del accidente de trabajo- materia del reproche administrativo-. En cuyo caso, la determinación del quantum de la sanción dependerá de la naturaleza del incumplimiento y de la evaluación del nivel de riesgo derivado de la falta de coordinación, pero sin el 5 agravamiento que contiene el numeral 48.1-C del artículo 48 del RLGIT. ii) Sub contratación parcial con confluencia de trabajadores de la empresa principal: Cuando los trabajadores de la empresa contratista, que funge de empleador directo o formal, concurren con la planilla de la empresa principal realizando labores semejantes, se configura un escenario de responsabilidad compartida en materia de seguridad y salud en el trabajo. En esta situación, plantea que la confluencia de ambos trabajadores (de la contratista y principal) al compartir el mismo entorno de trabajo y ejecutar labores semejantes, genera un riesgo compartido. Por tanto, de haberse determinado que el incumplimiento a la Ley de Seguridad y Salud en el Trabajo de la empresa principal fue nexo causal del accidente reprochado, corresponderá la determinación de la responsabilidad administrativa y para el quantum de la misma se debe observar el agravamiento punitivo contenido en el numeral 48.1-C del artículo 48 del RLGIT, es decir, considerando el universo de trabajadores afectados al que corresponde a la planilla de la principal."}]}, {"id": "2025-003", "anio": 2025, "numero": "003-2025", "tipo": "Precedente", "titulo": "Impulso de oficio y valoración de los medios de prueba", "criterio": "Criterio referido a la aplicación del principio de impulso de oficio para determinar mayores elementos de juicio y la convicción respecto de los medios de prueba presentados (fund. 6.40 a 6.42 y 6.44).", "fundamentos": "6.40, 6.41, 6.42 y 6.44", "palabras": ["impulso de oficio", "prueba", "medios probatorios", "convicción", "elementos de juicio"], "temas": [["Procedimiento sancionador y principios", "Prueba", "Impulso de oficio y convicción"]], "archivo": "pdf/2025-003.pdf", "archivo_nombre": "Resolucion-003-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.40", "texto": "Retornando al caso concreto, se advierte que la SUNAFIL recién, con la interposición del recurso de apelación por parte de la administrada, tomó conocimiento del registro de control de asistencia, que daba cuenta que desde el 03 de junio de 2020, la trabajadora afectada alternaba periodos de licencia con goce de haberes, trabajo remoto y licencia con goce de haberes compensable. Cabe precisar que el referido registro no fue presentado ni durante las actuaciones inspectivas, mientras se desarrollaba la fase instructora, pese a que, en principio, todo indicaría que la administrada sí contaba con el mismo mientras se desarrollaba la actividad administrativa de fiscalización a cargo del personal inspectivo comisionado."}, {"fundamento": "6.41", "texto": "Al respecto, esta Sala considera pertinente acotar que, atendiendo a la vicisitud probatoria mencionada, correspondía que la instancia de sanción, en el marco de la aplicación de las máximas del principio de impulso de oficio, disponga la realización de las actuaciones complementarias que resulten necesarias a fin de obtener mayores elementos de juicio25 que coadyuven a generar convicción respecto de los medios probatorios presentados por el administrado, u obtener elementos que permitan determinar la verdad material de los hechos que motivaron el procedimiento sancionador y/o los alegatos de los administrados."}, {"fundamento": "6.42", "texto": "Justamente, esta omisión se advierte en el presente procedimiento, pues la instancia de apelación no solo no realiza un análisis de los documentos presentados (registro de asistencia, en particular), sino que omite la realización de actuaciones complementarias, para verificar si lo alegado por la impugnante, en la instancia de apelación, constituían elementos de convicción para acreditar la subsanación de la infracción sociolaboral imputada (acto de hostilidad)."}, {"fundamento": "6.44", "texto": "En dicho orden de ideas, resulta necesario que, a la luz de dichas actuaciones complementarias, se efectúe un análisis respecto a si la medida adoptada por la impugnante permite verificar el cese de los actos de hostilidad imputados, y si, de esa manera, se puede concluir la subsistencia de dichos actos o si, de todas formas, dichas acciones configuran la realización de nuevos actos de hostilidad. Para cualquiera de esos escenarios, resulta necesario que se obtengan mayores elementos de convicción mediante la disposición de las correspondientes actuaciones complementarias."}]}, {"id": "2025-004", "anio": 2025, "numero": "004-2025", "tipo": "Precedente", "titulo": "Desnaturalización como fundamento de la medida de requerimiento y del pago de beneficios", "criterio": "Criterio referido a la determinación de la desnaturalización de la relación laboral como fundamento para emitir la medida inspectiva de requerimiento y exigir el pago de beneficios sociales u otros (fund. 6.32 y 6.33).", "fundamentos": "6.32 y 6.33", "palabras": ["desnaturalización", "beneficios sociales", "requerimiento", "pago", "relación laboral"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Desnaturalización y pago de beneficios"], ["Relación de trabajo y derechos laborales", "Contratos de trabajo", "Desnaturalización del contrato"]], "archivo": "pdf/2025-004.pdf", "archivo_nombre": "Resolucion-004-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.32", "texto": "Por tanto, cuando en la realización de las actuaciones inspectivas los comisionados adviertan la existencia de una relación de carácter laboral sobre la que las partes celebraron un tipo de contrato de servicios distinto al correspondiente (locación de servicios, comisión mercantil, etcétera), deben procurar requerir información necesaria u obtener la misma, haciendo uso de las amplias facultades reconocidas en favor de la inspección del trabajo, a fin de poder determinar la verdadera naturaleza jurídica de dicha relación18."}, {"fundamento": "6.33", "texto": "De comprobarse la existencia de los elementos esenciales del contrato de trabajo (esto es, que la relación existente entre el supuesto afectado y la inspeccionada sea de naturaleza laboral), debe justificarse la naturaleza subordinada del vínculo jurídico existente, lo que requiere de un análisis de tipo cualitativo que explique la interacción entre los indicios concurrentes.19 Dicha fundamentación puede estar establecida de manera clara y suficiente en la medida inspectiva de requerimiento o en un documento previo de la fiscalización al que ésta haga referencia. En cualquiera de estos escenarios, el inspector actuante deberá considerar, según corresponda, el requerimiento de subsanación de las infracciones que haya determinado como consecuencia de su investigación y que correspondan a los efectos jurídicos propios del reconocimiento del vínculo existente como uno de tipo laboral (por ejemplo: pago de beneficios sociales, registro en la seguridad social en salud y en pensiones). En sentido contrario, resulta evidente que la mencionada medida inspectiva no podría contener un mandato dirigido al pago de beneficios sociales si, previamente, la inspección no ha expuesto las razones que justifican la calificación de la relación entre la inspeccionada y el supuesto afectado como una de naturaleza laboral."}]}, {"id": "2025-005", "anio": 2025, "numero": "005-2025", "tipo": "Precedente", "titulo": "Conductas no punibles por demora en la respuesta a requerimientos de información", "criterio": "Criterio relacionado con la configuración de conductas no punibles derivadas de la demora en la respuesta a requerimientos de información (fund. 6.25 a 6.30).", "fundamentos": "6.25, 6.26, 6.27, 6.28, 6.29 y 6.30", "palabras": ["demora", "requerimiento de información", "no punible", "respuesta", "plazo"], "temas": [["Función inspectiva y medidas inspectivas", "Requerimientos de información", "Demora: conducta no punible"]], "archivo": "pdf/2025-005.pdf", "archivo_nombre": "Resolucion-005-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.25", "texto": "De este modo, corresponde precisar el contenido de los precedentes emitidos previamente y así determinar que para esta instancia de revisión, si bien en la Resolución de Sala Plena Nº 001-2021-SUNAFIL/TFL se establecieron criterios para la subsunción de la conducta infractora vinculada con la demora en la respuesta de los requerimientos de información en los supuestos contenidos en el numeral 45.2 del artículo 45 o el numeral 46.3 del artículo 46 del RLGIT, dicho análisis no excluyó la existencia de supuestos en los cuales esta conducta, aun constituyendo una falta al deber de colaboración, no resulte punible sobre la base de una evaluación a cargo del propio inspector actuante sobre el caso en específico, atendiendo a la regla de la razonabilidad y a los lineamientos establecidos en la jurisprudencia constitucional para que la imposición de una sanción sea considerada una decisión razonable. Esto se aclaró cuando, en el precedente fijado en el considerando 9 de la Resolución de Sala Plena Nº 008-2023-SUNAFIL/TFL, se expresó que “[…] debe atenderse a que el retraso en la entrega [de información] puede producir el efecto de la subsanación o puede imposibilitar la revisión integral de lo solicitado” […]."}, {"fundamento": "6.26", "texto": "En los casos que son examinados por el Tribunal de Fiscalización Laboral, se advierte que la evaluación desarrollada durante las actuaciones inspectivas y los órganos a cargo del procedimiento administrativo sancionador para determinar la responsabilidad de las conductas derivadas de la demora en la respuesta a los requerimientos de información, dejan de lado en su análisis a ciertos elementos propios del caso que podrían ser relevantes para evaluar tanto al deber de colaboración global como los efectos producidos por la demora en la entrega de información."}, {"fundamento": "6.27", "texto": "Así, a juicio de esta instancia de revisión, aun cuando el ilícito por la entrega tardía de información constituyera un actuar reprochable, la propuesta de infracción o la sanción resultaría irrazonable si es que el inspector de trabajo comisionado al caso en concreto puede evaluar la información y concluir que el sujeto inspeccionado ha cumplido las normas de trabajo objeto de supervisión en un lapso adecuado, que en todos los casos corresponde a cada servidor de la Inspección del Trabajo estimar, en función de la programación y cumplimiento diligente de todas las actividades que debe ejecutar en observancia de la función inspectiva."}, {"fundamento": "6.28", "texto": "De esta forma, es el inspector actuante el único servidor que puede establecer una estimación ponderada sobre la pertinencia o impertinencia de interrumpir las actividades que debe ejecutar tras la superación del plazo establecido para la exhibición de determinada pieza informativa, sea a través del envío de documentos en físico, por vía digital o a través de una sesión de comparecencia, por ejemplo. En estos casos, el inspector deberá identificar que se encuentra ante un supuesto distinto a los tipificados en el numeral 45.2 del artículo 45 (referido a la perturbación y retraso de la fiscalización imputable al inspeccionado) y 46.3 del artículo 46 del RLGIT (que alude a la negativa de entrega de información)."}, {"fundamento": "6.29", "texto": "Por lo antes señalado, compete a esta Sala complementar los criterios de observancia obligatoria aprobados en los fundamentos 15 y 16 de la Resolución de Sala Plena Nº 001-2021-SUNAFIL/TFL y fundamentos 9, 11 y 12 de la Resolución de Sala Plena Nº 008-2023-SUNAFIL/ TFL, estableciendo que los elementos constitutivos para la configuración de conductas no punibles derivadas de la demora en la respuesta a requerimientos de información, en donde no basta con que se haya cumplido con el objeto de la inspección, sino que, además, deberá evidenciarse la existencia de los siguientes presupuestos, concurrentemente: i) Deberá contarse con una justificación razonable del sujeto inspeccionado, que haya sido presentada oportunamente al inspector, durante la fiscalización, para que este la valore. Este criterio no puede ser empleado para amparar la falta de diligencia en el trato con una autoridad con competencias de fiscalización administrativa. Sin embargo, los inspectores pueden estimar cuestiones de orden casuístico razonables tales como, por ejemplo: que se trate de la primera fiscalización afrontada por el sujeto inspeccionado; el volumen de la información requerida (lo que requiere del envío de algún componente significativo de ella, previamente a la superación del plazo del requerimiento); un hecho externo acreditado que no extingue la obligación de presentar la información, pero hace razonable asumir que generó dificultades significativas. Los ejemplos mencionados deberán entenderse de manera enunciativa y no limitativa, pudiendo aplicarse el mismo razonamiento a casos similares. ii) Se debe acreditar la entrega total de la información requerida, sin que quede extremo alguno a ser integrado posteriormente. iii) El actuar tardío del inspeccionado (aun constituyendo un hecho reprochable) produce el efecto esperado de la ejecución del deber de colaboración. En dicho punto deberá atenderse, además, a los lineamientos señalados en los fundamentos 9, 11 y 12 de la Resolución de Sala Plena Nº 008-2023-SUNAFIL/TFL, en procura de evitar el uso indebido de este criterio por parte de los sujetos inspeccionados que no se basen en el cumplimiento del deber de colaboración. iv) Debe estar acreditado que el inspector de trabajo pudo efectuar una revisión integral de la información presentada —y proseguir, efectivamente, con la verificación de las materias comprendidas en la Orden de Inspección— siendo que deberá haberse dejado constancia de la verificación de la información remitida con retraso. No será posible que ningún otro órgano del Sistema de Inspección del Trabajo rectifique o modifique esta evaluación, que compete exclusivamente al inspector actuante. v) La fiscalización concluyó sin que se haya detectado incumplimiento sustantivo objeto de control por la inspección del trabajo, u otro incumplimiento a la labor inspectiva, ajeno a la demora en la respuesta a los requerimientos de información."}, {"fundamento": "6.30", "texto": "A juicio de este Tribunal, la valoración de los elementos antes señalados corresponde a un actuar de la Administración en observancia de los principios que rigen su actividad y de la finalidad última del Sistema de Inspección del Trabajo, que es procurar el cumplimiento de las normas de trabajo, por lo que la rectificación de un accionar antijurídico que en este caso atenta contra el deber de colaboración debe ser evaluada motivadamente por el inspector."}]}, {"id": "2025-006", "anio": 2025, "numero": "006-2025", "tipo": "Precedente", "titulo": "Nexo causal en incumplimientos formales detectados en la investigación de accidentes de trabajo", "criterio": "Criterio sobre la acreditación del nexo causal en caso de detectarse incumplimientos de carácter formal, en el marco de la investigación de accidentes de trabajo (fund. 6.51 a 6.53).", "fundamentos": "6.51, 6.52 y 6.53", "palabras": ["nexo causal", "accidente de trabajo", "incumplimiento formal", "investigación de accidentes"], "temas": [["Seguridad y salud en el trabajo", "Accidentes de trabajo", "Nexo causal"]], "archivo": "pdf/2025-006.pdf", "archivo_nombre": "Resolucion-006-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.51", "texto": "En dicho contexto, se advierte que la autoridad inspectiva no ha demostrado de qué forma se relacionan, bajo una configuración causal acertada, los hechos significativos siguientes: la ausencia de entrega del RISST actualizado al trabajador —quien posteriormente sufrió el accidente de trabajo— y la ocurrencia del accidente de trabajo, en particular. Tampoco, en la motivación del acta de infracción, se ha argumentado que la falta de determinados estándares en el RISST haya privado al trabajador de información indispensable para evitar o mitigar el riesgo que finalmente se concretó. La responsabilidad administrativa por una infracción que, conforme con los tipos sancionadores como el 28.10 y 28.11 del artículo 28 del RLGIT, demandan un actuar riguroso exigible al inspector actuante. En efecto, cuando la autoridad fiscalizadora analiza los hechos de un caso, y subsume la responsabilidad del empleador bajo esos tipos sancionadores, el desenlace del comportamiento reprochado al empleador y el factor causal que ocasiona - es decir, que motiva, origina, produce, provoca o suscita, conforme con las voces sinonímicas reconocidas por la Real Academia de la Lengua Española17 - no puede concluir la responsabilidad del empleador únicamente basándose en conjeturas sin un debido sustento inferencial o, como ocurre en este caso, en meras omisiones formales que se presenten desconexas del hecho lesivo, es indispensable que se verifique si dicha omisión de carácter formal privó al trabajador de información relevante y pertinente para identificar, prevenir o mitigar el riesgo que efectivamente se materializó. En consecuencia, la omisión documental en casos que involucren a la falta de acreditación (Constitucionales, Judiciales y Administrativos) de entrega del RISST solo podrá generar responsabilidad administrativa cuando, a partir de un análisis razonado de causalidad normativa, se acredite que dicha omisión privó al trabajador de medios adecuados de prevención o control del riesgo efectivamente materializado. De lo contrario, el incumplimiento carecerá de relevancia infractora en el marco del artículo 28.10 o 28.11 del RLGIT, correspondiendo su tratamiento bajo otros tipos sancionadores de carácter formal o de riesgo abstracto, según corresponda."}, {"fundamento": "6.52", "texto": "En efecto, conforme a lo previsto en los numerales 28.10 y 28.11 del artículo 28 del RLGIT, la configuración de una infracción muy grave por accidente de trabajo exige que el incumplimiento detectado —sea documental, procedimental o técnico— tenga relación sustantiva con el riesgo que se materializó. Este criterio ha sido sostenido por esta Sala en las Resoluciones Nº 464-2022-SUNAFIL/TFL, Nº 663-2023-SUNAFIL/TFL, Nº 452-2024-SUNAFIL/TFL, Nº 543-2024-SUNAFIL/TFL, Nº 582-2024-SUNAFIL/TFL, Nº 24-2025-SUNAFIL/TFL y Nº 463-2025-SUNAFIL/TFL, en las que se precisó que la responsabilidad por infracción muy grave debe fundarse en un juicio de causalidad motivado, que determine si el incumplimiento afectó el deber de prevención del empleador respecto de las condiciones de trabajo que originaron el daño. En esa línea, cuando la omisión detectada corresponde a obligaciones documentales, como la entrega del RISST o supuestos similares, el análisis de imputación debe valorar si dicha omisión afectó efectivamente el cumplimiento del deber de prevención del empleador respecto de las actividades desarrolladas por el trabajador accidentado, y si tal defecto de información, capacitación o advertencia tuvo capacidad real de influir en la producción del daño."}, {"fundamento": "6.53", "texto": "En tal sentido, debe resaltarse que la función de la inspección del trabajo —como primera línea del sistema de fiscalización laboral— no se limita a verificar el incumplimiento de deberes formales, sino que requiere realizar un análisis sustantivo de las circunstancias que originaron el accidente. En particular, cuando se califica una infracción como muy grave con base en un resultado dañoso, corresponde a la autoridad verificar si el incumplimiento detectado tuvo incidencia relevante y comprobable en la producción del daño. Para ello, deberá evaluarse si el documento omitido o la medida no ejecutada guardaba relación directa con las funciones asignadas al trabajador y con el tipo de riesgo materializado, así como si dicha omisión menoscabó la capacidad de advertencia, prevención o control del peligro. Solo cuando esta conexión funcional sea motivada adecuadamente, podrá considerarse la omisión como causalmente relevante y subsumible en los supuestos previstos en los numerales 28.10 o 28.11 del RLGIT."}]}, {"id": "2025-007", "anio": 2025, "numero": "007-2025", "tipo": "Precedente", "titulo": "Deber de vigilancia de la salud, que comprende la salud mental", "criterio": "Criterio referido al deber de vigilancia de la salud de los trabajadores, el cual también comprende la salud mental (fund. 6.19, 6.23 y 6.24).", "fundamentos": "6.19, 6.23 y 6.24", "palabras": ["vigilancia de la salud", "salud mental", "vigilancia", "seguridad y salud", "trabajadores"], "temas": [["Seguridad y salud en el trabajo", "Vigilancia de la salud", "Salud mental"]], "archivo": "pdf/2025-007.pdf", "archivo_nombre": "Resolucion-007-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.19", "texto": "Desde esta perspectiva, el deber de vigilancia de la salud del trabajador no se agota en el cumplimiento formal del llevado diligente de registros de exámenes, médicos o su práctica adecuada y oportuna, conforme a ley. Por el contrario, este deber jurídico implica una obligación sustantiva de carácter permanente, orientada a asegurar que las condiciones laborales sean compatibles con el estado de salud del trabajador, incluyendo sus dimensiones física y mental. Así, en casos como el presente, o en situaciones análogas, donde el trabajador fue víctima de un evento traumático con secuelas físicas y emocionales debidamente acreditadas, esta obligación se intensifica, debiendo adoptar el empleador una conducta reforzada de protección y evaluación continua, lo que implica la implementación de mecanismos razonables de canalización, acompañamiento y seguimiento clínico-laboral, de manera proporcional al nivel de riesgo o vulnerabilidad detectado. Este estándar normativo resulta plenamente exigible al empleador que, conforme a lo determinado por el Inspector de Trabajo, ha tenido pleno conocimiento —determinable a través de medios de prueba directa o indirecta que sean interpretados razonablemente— del menoscabo en la salud padecido por la parte trabajadora. Así, cuando el empleador no ejecuta prestación alguna en favor de la prevención de riesgos específicos que pueden afectar a tal situación, constituye un comportamiento susceptible de reproche administrativo por el incumplimiento de su deber de vigilancia de la salud del trabajador."}, {"fundamento": "6.23", "texto": "Es importante precisar que el derecho a la salud mental se encuentra reconocido en normas internacionales de derechos humanos, como el artículo 12 del Pacto Internacional de Derechos Económicos, Sociales y Culturales y el artículo 10 del Protocolo de San Salvador. Este reconocimiento internacional no solo vincula al Estado, sino también a los actores privados —entre ellos, los empleadores— en su deber de garantizar condiciones laborales compatibles con dicho derecho. En ese sentido, este Tribunal ha establecido en las Resoluciones de Sala Plena Nros. 025-2024-SUNAFIL/TFL13 y 026-2024-SUNAFIL/TFL14 que el sistema de inspección del trabajo debe incluir, dentro de su intervención fiscalizadora, la verificación del cumplimiento de las normas relativas a derechos humanos laborales, conforme a las fuentes internacionales del Derecho del Trabajo, las cuales son objeto de supervisión por la autoridad estatal. Por tanto, las actuaciones y actos emitidos por el sistema de inspección del trabajo deben fundarse no solo en la observancia de lo dispuesto por el derecho interno, sino también en los estándares internacionales que garantizan la protección de los derechos humanos laborales."}, {"fundamento": "6.24", "texto": "En ese sentido, el deber de prevención y vigilancia de la salud del trabajador comprende no solo el monitoreo de su estado físico, sino también la protección efectiva de su salud mental, por lo que la omisión de medidas de evaluación médica que consideren esta dimensión, particularmente en procesos de reincorporación tras eventos traumáticos o durante tratamientos psiquiátricos en curso, constituye un incumplimiento del deber legal del empleador y configura una infracción directa a la normativa de seguridad y salud en el trabajo. En tales supuestos, si bien el empleador no asume un rol clínico, le corresponde activar medidas razonables de carácter preventivo y organizacional, tales como la coordinación con el área de salud ocupacional, la exigencia de evaluaciones médicas especializadas previas a la reincorporación, el ajuste temporal de tareas u otras acciones que permitan garantizar condiciones laborales compatibles con el estado de salud mental del trabajador."}]}, {"id": "2025-008", "anio": 2025, "numero": "008-2025", "tipo": "Precedente", "titulo": "Vacaciones truncas, diferenciación de actos de hostilidad, conjunto homogéneo de trabajadores y nexo causal", "criterio": "Agrupa criterios sobre la infracción por impago de vacaciones truncas, la diferenciación entre los numerales 25.14 y 25.15 del RLGIT, la configuración de un conjunto homogéneo de trabajadores afectados y el quiebre del nexo causal en accidentes de trabajo (fund. 17, 18, 25, 27, 28, 46 a 50, 65 a 67 y 80 a 82).", "fundamentos": "17, 18, 25, 27, 28, 46, 47, 48, 49, 50, 65, 66, 67, 80, 81 y 82", "palabras": ["vacaciones truncas", "25.14", "25.15", "hostilidad", "conjunto homogéneo", "trabajadores afectados", "nexo causal", "accidente de trabajo", "renuncia"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Actos de hostilidad (25.14 y 25.15)"], ["Relación de trabajo y derechos laborales", "Vacaciones", "Vacaciones truncas"], ["Seguridad y salud en el trabajo", "Accidentes de trabajo", "Nexo causal"], ["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Conjunto homogéneo de trabajadores afectados"]], "archivo": "pdf/2025-008.pdf", "archivo_nombre": "Resolucion-008-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "17", "texto": "En ese sentido, la infracción vinculada al impago de vacaciones truncas se configura cuando el trabajador no ha alcanzado el derecho al descanso vacacional —esto es, cuando no ha cumplido el año completo de servicios— y, pese a ello, el empleador no efectuó el pago correspondiente de forma íntegra y oportuna al momento del cese. Esta conducta se encuentra tipificada como infracción grave en el numeral 24.4 del artículo 24 del RLGIT. Por el contrario, el incumplimiento del otorgamiento del descanso vacacional presupone que el trabajador ha alcanzado efectivamente el año de servicios y que, no obstante, el empleador omitió concederle el goce físico del descanso anual, supuesto de hecho que forma parte, entre otros, del tipo infractor contenido en el numeral 25.6 del artículo 25 del referido reglamento."}, {"fundamento": "18", "texto": "En los casos en los que la conducta infractora se encuentre vinculada estrictamente al incumplimiento del pago de vacaciones truncas, no resulta jurídicamente válida la imputación de responsabilidad con base en el numeral 25.6 del artículo 25 del RLGIT. En consecuencia, corresponde tanto a la inspección como al órgano a cargo del procedimiento administrativo sancionador identificar con claridad el supuesto específico de la imputación y aplicar el tipo infractor que resulte jurídicamente pertinente, evitando una calificación que vulnere el principio de tipicidad. B. Criterios para la acumulación de procedimientos administrativos sancionadores en el marco del artículo 160 del TUO de la LPAG"}, {"fundamento": "25", "texto": "En relación con la conexidad subjetiva referida a la existencia de un conjunto homogéneo de trabajadores afectados, este Tribunal ha identificado que, en diversos casos, se han iniciado órdenes de inspección y procedimientos sancionadores de manera independiente, a pesar de que las denuncias presentadas por trabajadores o extrabajadores, aunque interpuestas por separado, guardan identidad en cuanto al interés jurídico, los hechos descritos, y su proximidad temporal. Esta práctica desconoce lo dispuesto en el artículo 160 del TUO de la LPAG, que impone a la autoridad instructora el deber de acumular los procedimientos en trámite que guarden conexión. Esta situación se ha evidenciado, entre otros, en los casos resueltos mediante las Resoluciones Nros. 490-2025 a 497-2025, 499-2025 a 508-2025, 510-2025 a 511-2025, 513-2025 a 516-2025-SUNAFIL/TFL-Primera Sala, en los que se constató una fragmentación indebida del tratamiento procedimental, pese a la existencia de elementos que justificaban su acumulación."}, {"fundamento": "27", "texto": "En esa línea, si bien podría alegarse la inexistencia de conexidad subjetiva en aquellos casos donde no existe plena identidad entre los trabajadores afectados —conforme al fundamento 6.16 de la Resolución de Sala Plena N.º0152024-SUNAFIL/TFL—, lo cierto es que, bajo el enfoque expuesto por Sappia, corresponde valorar si los reclamos, aunque presentados individualmente, tienen un origen común y están dirigidos contra un mismo empleador, configurando un interés jurídico homogéneo. Así, pese a tratarse de diferentes trabajadores, puede reconocerse un vínculo material suficiente que justifique la acumulación procedimental en aras del principio de razonabilidad y del debido procedimiento."}, {"fundamento": "28", "texto": "Por tanto, en aquellos supuestos en los que se aprecie una repetición objetiva de condiciones — como la afectación a distintos trabajadores expuestos a un mismo incumplimiento laboral, en el mismo parámetro temporal razonable y respecto del mismo empleador— corresponde que la autoridad competente disponga, mediante resolución irrecurrible, la acumulación de los procedimientos en trámite que guarden conexión, conforme a los criterios establecidos en el artículo 160 del TUO de la LPAG, en el fundamento 6.16 de la Resolución de Sala Plena N.º015-2024-SUNAFIL/TFL y en el presente Acuerdo Plenario."}, {"fundamento": "46", "texto": "En ese sentido, corresponde diferenciar los alcances de los numerales 25.14 y 25.15 del artículo 25 del RLGIT. Cuando la conducta del empleador se dirige específicamente contra miembros del Comité o Subcomité de SST y afecta directamente el ejercicio de sus funciones representativas, corresponderá su calificación como infracción al numeral 25.14, por configurarse un acto de hostilidad contra representantes de los trabajadores en materia de seguridad y salud en el trabajo. Por el contrario, si se verifica que el empleador incurrió en omisiones o conductas pasivas que permitieron o no impidieron actos hostiles o vulneraciones a derechos fundamentales, sin vinculación directa con la calidad representativa del trabajador, corresponderá subsumir la conducta en el numeral 25.15 del citado reglamento, en tanto constituye una falta al deber de prevención frente a situaciones que afectan la dignidad del trabajador o el ejercicio de sus derechos constitucionales."}, {"fundamento": "47", "texto": "La evaluación de la configuración de actos de hostilidad laboral dirigidos contra miembros del Comité o Subcomité de Seguridad y Salud en el Trabajo (SST), será desestimado únicamente en los casos en los que, como resultado de la actuación inspectiva, se verifica que el empleador: a) b) Otorgó las facilidades para que el Comité o Sub Comité de SST pueda desarrollar sus funciones, propiciando un ambiente con las condiciones necesarias, los medios físicos y tecnológicos pertinentes para la materialización de su finalidad; y, Respetó la independencia con la que deben contar los miembros del Comité o Sub Comité de SST en el desarrollo de sus funciones, salvo prueba en contrario de que tales funciones hayan sido utilizadas para fines ajenos a los establecidos en la Ley N.º 29783, Ley de Seguridad y Salud en el Trabajo (LSST) y su reglamento."}, {"fundamento": "48", "texto": "En relación con el primer aspecto, se identifica al empleador como garante de la existencia y funcionamiento efectivo del Comité o Subcomité de SST, lo cual comprende, entre otras acciones: la provisión de herramientas para el ejercicio funcional, la implementación de espacios adecuados para sesiones, la promoción de capacitaciones periódicas, la tramitación oportuna de licencias con goce de haber, entre otros."}, {"fundamento": "49", "texto": "En esa misma línea, el segundo aspecto se vincula con la tutela del ejercicio de las funciones de los miembros del Comité o Subcomité de SST, conforme a lo previsto en el artículo 42 del RLSST. Ello no impide el desarrollo de un procedimiento disciplinario en su contra; no obstante, exige que los empleadores verifiquen fehacientemente que los hechos imputados no guarden relación con el ejercicio de sus funciones como miembros del Comité o Subcomité, incluyendo el uso de los medios o mecanismos necesarios para su cumplimiento."}, {"fundamento": "50", "texto": "En ese marco, un proceder obstructivo o la imposición de medidas disciplinarias por parte del empleador que afecten directamente las prerrogativas de los miembros del Comité o Subcomité de SST constituirán actos de hostilidad, conforme con lo dispuesto en el artículo 73 de la LSST y el artículo 105 del RLSST. En ese sentido, las restricciones o limitaciones que el empleador aplique en ejercicio del poder directriz no deben impedir el adecuado cumplimiento de las funciones asignadas a dichos miembros. Tales medidas deben adoptarse de manera razonable y en concordancia con los procedimientos de seguridad establecidos en la normativa interna del centro de trabajo. Así, en el marco del procedimiento disciplinario seguido contra miembros del Comité o Subcomité de SST, corresponde al empleador acreditar que las medidas adoptadas fueron razonables y que no afectaron el adecuado ejercicio de las funciones inherentes a dicha condición."}, {"fundamento": "65", "texto": "En el marco de la actuación realizada por la inspección de trabajo, corresponde identificar elementos objetivos que permitan inferir razonablemente que el comportamiento del empleador tuvo por finalidad restringir, dificultar o disuadir el ejercicio de la libertad sindical. Entre las posibles consecuencias de tales conductas pueden encontrarse la desafiliación sindical, la disminución de la participación de los trabajadores en la organización, la obstaculización de su funcionamiento interno, el debilitamiento de su capacidad de negociación, entre otras."}, {"fundamento": "66", "texto": "En ese sentido, para la determinación de responsabilidad administrativa por una infracción muy grave conforme al numeral 25.10 del artículo 25 del RLGIT, será relevante identificar si el comportamiento del empleador, de manera directa o indirecta por acción u omisión, vulneró el principio de autonomía colectiva y afectó el ejercicio del derecho a la libertad sindical. A tal efecto, corresponde a la autoridad inspectiva, así como al órgano administrativo sancionador, valorar el conjunto de elementos disponibles, incluyendo tanto los medios de prueba directos como los indicios que permitan advertir que la conducta del empleador produjo un efecto disuasorio, restrictivo o excluyente respecto del ejercicio de la libertad sindical. Este criterio es coherente con lo señalado por el Tribunal Constitucional20 cuando sostiene que, a partir de la valoración de indicios razonables, puede establecerse una conducta de naturaleza antisindical."}, {"fundamento": "67", "texto": "Cabe precisar que, para efectos de determinar la existencia de una conducta antisindical, lo determinante no es la forma específica en que esta se manifiesta, sino si el comportamiento del empleador afecta, limita o interfiere en el ejercicio de la libertad sindical. En ese sentido, la calificación de una conducta como antisindical no puede basarse en una valoración aislada de hechos puntuales, sino que requiere un análisis integral y contextual de la conducta desplegada, atendiendo a su impacto en los derechos colectivos de los trabajadores y en el ejercicio de la libertad sindical."}, {"fundamento": "80", "texto": "En ese contexto, este Tribunal entiende que el quiebre del nexo causal en un accidente de trabajo se configura cuando se interrumpe la cadena de causalidad entre el daño sufrido por el trabajador y el incumplimiento de las obligaciones de prevención imputables al empleador. Esta interrupción puede producirse por la concurrencia de hechos externos, imprevisibles o atribuibles exclusivamente al trabajador. Así, a partir del análisis de lo resuelto en las Resoluciones Nº11202023, Nº1098-2023, Nº1147-2023, Nº1151-2023, Nº087-2024, Nº764-2024 y Nº1038-2024 - entre otras—, se han identificado supuestos relevantes que permiten precisar dicho concepto, sin perjuicio de que puedan presentarse otros escenarios con características similares que ameriten igual valoración. a. Intervención de una causa ajena al trabajo: Se configura cuando el accidente obedece exclusivamente a condiciones personales del trabajador, desconocidas por el empleador, o a decisiones que se apartan de las disposiciones de seguridad. Por ejemplo: b. • Enfermedades preexistentes, no informadas por el trabajador, que puedan afectar el desempeño seguro de sus funciones. A modo de ejemplo, consideramos el caso de un operario de almacén que perdió el equilibrio y cayó desde una escalera mientras realizaba el inventario. La investigación médica posterior determinó que el accidente fue consecuencia de una crisis epiléptica repentina, relacionada con un diagnóstico previo que el trabajador no había informado al empleador, ni había sido detectado en el examen médico de ingreso. No se identificaron condiciones laborales que hayan contribuido al evento. • Uso indebido de vehículo personal, sin autorización laboral. Para ilustrar esta situación, cabe citar el caso de un jardinero contratado por la municipalidad que fue atropellado por una unidad de transporte público, mientras se desplazaba en motocicleta por una vía pública. Aunque el accidente ocurrió dentro del horario laboral, el trayecto no estaba relacionado con funciones propias del trabajo. Además, la motocicleta era de propiedad del trabajador y su uso no había sido autorizado ni requerido por el empleador. • Situaciones personales que afecten la capacidad del trabajador, para cumplir con sus labores con la diligencia esperada, especialmente, en actividades de riesgo como minería, pesca, construcción, entre otros. Para contextualizar este tipo de situaciones, puede mencionarse el caso de que, previamente al iniciar su jornada laboral, un trabajador recibió la noticia de que su madre se encontraba en estado de salud terminal, lo cual le generó un fuerte impacto emocional. A pesar de no encontrarse en condiciones óptimas para desempeñar sus tareas - que incluían el manejo de maquinaria pesada el trabajador no informó al empleador sobre su situación. La falta de concentración derivada de su estado emocional desembocó en un accidente laboral. formación específica sobre el uso adecuado y obligatorio de los equipos de protección personal —así como de haber suscrito el acta de entrega y conformidad de los mismos—, decidió prescindir del casco de seguridad mientras realizaba labores de montaje en altura. Durante la ejecución de sus tareas, una herramienta cayó desde una plataforma superior, impactando su cabeza y causándole una fractura. El área afectada habría estado protegida de haberse utilizado el equipo proporcionado. En consecuencia, se concluyó que la omisión voluntaria del uso del EPP, en contra de la formación recibida, constituye una causa suficiente para excluir la responsabilidad del empleador. • Ejecución voluntaria de labores ajenas a sus funciones, sin formación ni autorización. También se han presentado casos en los que el trabajador, excediendo los límites de su función y sin contar con autorización ni formación técnica para ello, decide intervenir de manera personal en la reparación de una maquinaria averiada. En un caso concreto, un operario de montacargas identificó un desperfecto en el equipo que utilizaba y procedió por iniciativa propia a desmontar las piezas involucradas, utilizando eslingas para levantar los componentes más pesados sin verificar previamente su capacidad de carga. Durante dicha maniobra, una de las piezas cedió y cayó, impactando directamente sobre su cabeza, lo que le ocasionó la muerte de forma inmediata. Se pudo advertir que el trabajador no contaba con competencias ni autorización para realizar tareas de mantenimiento, y que su actuación fue autónoma, negligente y temeraria, por lo que se concluyó que no correspondía imputar responsabilidad al empleador. • Conducta temeraria o imprudente del trabajador durante el desempeño de funciones habituales. Finalmente, se ha documentado el caso de un trabajador que, durante la ejecución de labores de montaje y desmontaje de estructuras metálicas, optó por colocarse debajo de un cajón de gran peso que estaba siendo retirado de forma manual. Esta acción fue ejecutada a pesar de haber recibido capacitación formal sobre procedimientos seguros, el uso obligatorio de implementos de protección personal y advertencias específicas relativas a zonas de aplastamiento. Si bien el trabajador portaba los EPP correspondientes, su conducta temeraria —al ubicarse voluntariamente en una posición de alto riesgo, sin necesidad operativa ni justificación técnica— derivó en un accidente que le ocasionó la muerte por aplastamiento. Al acreditarse que fue una decisión individual contraria a lo instruido, se concluyó que no correspondía imputar responsabilidad al empleador. Incumplimiento de normas de seguridad y salud en el trabajo por parte del trabajador: Cuando el accidente tiene como causa directa la conducta del trabajador que, de manera consciente y voluntaria, incumple las normas de seguridad y salud previamente instruidas por el empleador —quien, a su vez, acreditó haber cumplido con sus obligaciones de capacitación, supervisión e información—, se configura una ruptura del nexo causal que excluye la responsabilidad del empleador. A continuación, se presentan algunos ejemplos ilustrativos de este supuesto, los cuales no constituyen un listado taxativo, pudiendo presentarse otros escenarios similares. • • Desacato de procedimiento seguro en el uso de maquinaria pesada. De forma ejemplificativa, puede mencionarse el caso de un trabajador del área operativa que, pese a haber sido debidamente capacitado en el manejo seguro de una máquina compactadora —incluyendo sesiones teóricas, prácticas, y la evaluación documentada de los conocimientos adquiridos—, procedió a operarla en abierta contravención a los procedimientos establecidos. En la oportunidad del accidente, colocó sus manos en el área de corte y solicitó a un segundo trabajador —quien no contaba con formación ni autorización para el uso del equipo— que activará la máquina. Como resultado de dicha maniobra, sufrió la amputación de dos dedos al estar estos ubicados directamente en la zona de corte al momento de la activación. En este caso, se evidencia que el accidente se originó exclusivamente en la conducta imprudente y deliberada del trabajador, contraria a la capacitación previamente brindada, configurándose así la ruptura del nexo causal atribuible al empleador. Desuso de equipos de protección personal obligatorio, a pesar de haber sido debidamente informados y capacitados sobre la importancia y obligatoriedad de su uso. A manera de ejemplo, se ha identificado el supuesto de un trabajador que, a pesar de haber recibido 15 c. Fuerza mayor o acto de terceros: Comprende situaciones de carácter externo, imprevisible e inevitable, que no pueden ser razonablemente prevenidas por el empleador. Por ejemplo: • Evento natural imprevisible e inevitable. Como situación excepcional, puede señalarse el caso de un grupo de trabajadores que realizaba tareas de mantenimiento en una vía rural fue sorprendido por un deslizamiento de tierra originado por lluvias torrenciales que superaron ampliamente los niveles históricos registrados en la zona. La empresa había adoptado medidas preventivas razonables en función de los riesgos conocidos; sin embargo, la magnitud del fenómeno natural superó cualquier previsión técnica o climática, configurándose así un caso de fuerza mayor, es decir, se trata de una fuerza ajena extraordinaria, imprevisible e irresistible. • Acto violento de terceros en contexto social ajeno al trabajo. Como ejemplo de acto de terceros ajenos a la relación laboral, puede considerarse el hecho de que un conductor de carga fue alcanzado por piedras arrojadas durante una protesta social mientras transitaba por una carretera nacional, en el marco de jornada laboral y siguiendo las instrucciones operativas de la empresa. Las (Constitucionales, Judiciales y Administrativos) agresiones provinieron de manifestantes sin vínculo con el empleador ni con el trabajador. No se identificaron omisiones, por parte del empleador, que pudieran haber evitado el hecho; por lo que, el daño obedeció a un hecho determinante de tercero. • Accidente ocasionado por un tercero, ajeno a la relación laboral. Como otro ejemplo de acto imprevisible de un tercero ajeno a la relación laboral, puede señalarse el caso de un trabajador de vigilancia que fue embestido por un vehículo conducido por una persona en estado de ebriedad, mientras realizaba rondas perimétricas fuera del local, sobre una vía pública. El vehículo invadió la vereda de manera descontrolada, sin relación alguna con la empresa ni con las condiciones del entorno laboral. La vía donde ocurrió el hecho no requería resguardo adicional por parte del empleador. En consecuencia, el evento fue considerado un acto imprevisible de un tercero, fuera del alcance de prevención o control razonable por parte de la empresa."}, {"fundamento": "81", "texto": "Debe destacarse que la conducta imprudente o temeraria del trabajador en el desarrollo de sus funciones puede incidir en la determinación del nexo causal entre el accidente ocurrido y el incumplimiento de las obligaciones de seguridad imputadas al empleador. En particular, cuando se acredita que el trabajador asumió de manera consciente y voluntaria un riesgo manifiestamente ajeno al curso ordinario de sus labores, puede configurarse una causa autónoma de daño que excluye, total o parcialmente, la responsabilidad administrativa del empleador."}, {"fundamento": "82", "texto": "Para efectos de calificar la existencia de responsabilidad administrativa del empleador en accidentes de trabajo, corresponde que la inspección del trabajo —así como, de corresponder, el órgano administrativo sancionador— evalúe con rigor, al momento de calificar los hechos, los elementos que permitan verificar la debida diligencia del empleador en materia de prevención. Del mismo modo, deberá valorarse la existencia de antecedentes que evidencien un eventual incumplimiento deliberado de las normas de seguridad por parte del trabajador, en tanto tales elementos pueden incidir en la determinación del nexo causal entre el accidente y las obligaciones preventivas atribuidas al empleador."}]}, {"id": "2025-009", "anio": 2025, "numero": "009-2025", "tipo": "Precedente", "titulo": "Mandato específico de la medida de requerimiento: legalidad y tipicidad", "criterio": "Criterio referente a que el mandato específico de la medida inspectiva de requerimiento debe basarse en conductas expresamente señaladas como infracción, respetando los principios de legalidad y tipicidad (fund. 6.27 a 6.30).", "fundamentos": "6.27, 6.28, 6.29 y 6.30", "palabras": ["mandato", "legalidad", "tipicidad", "medida de requerimiento", "requerimiento"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Mandato específico (legalidad y tipicidad)"]], "archivo": "pdf/2025-009.pdf", "archivo_nombre": "Resolucion-009-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.27", "texto": "En ese sentido, cuando la medida inspectiva de requerimiento se sustenta en la inferencia referida a que un beneficio otorgado por el empleador —por ejemplo, la asignación familiar— no se ajusta a lo dispuesto por la Ley N.º 25129 por haberse extendido a trabajadores que no cumplen los requisitos legales, debe tenerse presente que tal apreciación no puede apartarse (Constitucionales, Judiciales y Administrativos) de la literalidad de dicha norma. Así, la inspección de trabajo debe considerar que dicha inferencia realizada no se aparte de la literalidad del dispositivo normativo cuyo incumplimiento se reprocha. En el caso en concreto, se aprecia que, de la literalidad de la norma no existe disposición legal que prohíba dicho otorgamiento ni evidencia de que ello afecte derechos."}, {"fundamento": "6.28", "texto": "Es necesario distinguir entre aquellos casos en los que la trazabilidad de pagos a quienes no califican como beneficiarios de una norma genera un impacto adverso sobre algún beneficiari /* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9.\s-]/g, ' ').replace(/\s+/g, ' ').trim();
const plural = (n, a, b) => n === 1 ? `${n} ${a}` : `${n} ${b}`;
const rutaTxt = (t) => t.join(' › ');

const PRECS = DATOS.precedentes.filter(p => p.tipo.startsWith('Precedente'));
const INTERP = DATOS.precedentes.filter(p => !p.tipo.startsWith('Precedente'));
const GENERALES = DATOS.temas_generales;

/* ---------- pestañas ---------- */
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', 'false'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.setAttribute('aria-selected', 'true');
  document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
}));

/* ---------- texto del precedente y descarga ---------- */
function bloqueTexto(p, terminos, abierto) {
  if (!p.textos || !p.textos.length) {
    return '<p class="origen">Texto no disponible en la base: consulte la resolución completa.</p>';
  }
  const frags = p.textos.map(b => {
    const cuerpo = terminos && terminos.length ? resaltar(b.texto, terminos) : esc(b.texto);
    return `<p class="frag"><strong>Fundamento ${esc(b.fundamento)}.</strong> ${cuerpo}</p>`;
  }).join('');
  const n = p.textos.length;
  return `<details class="texto" ${abierto ? 'open' : ''}>
      <summary>Texto del precedente (${n} ${n === 1 ? 'fundamento' : 'fundamentos'})</summary>
      ${frags}
    </details>`;
}

function botonesPdf(p) {
  return `<div class="acciones">
      <a class="pdf" href="${encodeURI(p.archivo)}" download="${esc(p.archivo_nombre)}">Descargar la resolución completa (PDF)</a>
    </div>`;
}

function cabecera(p, warn) {
  return `<div class="meta">
      <span class="badge">${esc(p.id)}</span>
      <span>Resolución de Sala Plena N.º ${esc(p.numero)}-SUNAFIL/TFL</span>
      ${warn ? `<span class="badge warn">${esc(p.tipo)}</span>` : ''}
    </div>`;
}

/* ---------- explorar por temas ---------- */
let ruta = [];

function tarjetaPrecedente(p) {
  const claves = (p.palabras || []).map(w => `<span class="chip">${esc(w)}</span>`).join('');
  const nota = p.nota ? `<p class="origen"><strong>Nota:</strong> ${esc(p.nota)}</p>` : '';
  return `
    <article class="card">
      ${cabecera(p, false)}
      <h3>${esc(p.titulo)}</h3>
      <p>${esc(p.criterio)}</p>
      ${nota}
      ${bloqueTexto(p, [], false)}
      <details>
        <summary>Temas de origen y palabras clave</summary>
        <p class="origen">${p.temas.map(t => esc(rutaTxt(t))).join('<br>')}</p>
        <div class="chips">${claves}</div>
      </details>
      ${botonesPdf(p)}
    </article>`;
}

function renderCrumbs() {
  const partes = [`<button data-nivel="-1">Inicio</button>`];
  ruta.forEach((r, i) => partes.push(`<span>›</span><button data-nivel="${i}">${esc(r)}</button>`));
  $('#crumbs').innerHTML = partes.join(' ');
  $('#crumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.nivel);
    ruta = n < 0 ? [] : ruta.slice(0, n + 1);
    renderExplorar();
  }));
}

const enRuta = (t, prefijo) => prefijo.every((r, i) => t[i] === r);

function renderExplorar() {
  renderCrumbs();
  const cont = $('#explorar-contenido');
  const nivel = ruta.length;

  if (nivel === 3) {
    const items = PRECS.filter(p => p.temas.some(t => enRuta(t, ruta)));
    cont.innerHTML = `<p class="summary-line">${plural(items.length, 'precedente', 'precedentes')} en este tema concreto.</p>` +
      items.map(tarjetaPrecedente).join('');
    return;
  }

  // Un precedente puede colgar de varios temas: se cuenta una vez por nodo.
  const nodosMapa = new Map();
  if (nivel === 0) GENERALES.forEach(g => nodosMapa.set(g, new Set()));
  PRECS.forEach(p => p.temas.forEach(t => {
    if (!enRuta(t, ruta)) return;
    const k = t[nivel];
    if (!nodosMapa.has(k)) nodosMapa.set(k, new Set());
    nodosMapa.get(k).add(p.id);
  }));

  const nivelTxt = nivel === 0 ? 'Elige un tema general' : nivel === 1 ? 'Elige un subtema' : 'Elige un tema específico';
  const nodos = [...nodosMapa.entries()].map(([nombre, ids]) => {
    const n = ids.size;
    const cuenta = n ? plural(n, 'precedente', 'precedentes') : 'Sin precedentes';
    return `<button class="node" data-nombre="${esc(nombre)}" ${n ? '' : 'disabled'}>
      <strong>${esc(nombre)}</strong><span class="count">${cuenta}</span></button>`;
  }).join('');
  cont.innerHTML = `<p class="summary-line">${nivelTxt}.</p><div class="grid">${nodos}</div>`;
  cont.querySelectorAll('.node').forEach(b => b.addEventListener('click', () => {
    ruta.push(b.dataset.nombre);
    renderExplorar();
    window.scrollTo({ top: 0 });
  }));
}

const STOP = new Set(['de','la','el','en','y','a','los','las','del','que','con','por','para','un','una','al','se','o','u','e','su','sus','es','lo','como','ante','sin','sobre','desde','hasta','entre','son','ser','mi','tu']);
const GENERIC = new Set(['trabajador','trabajadores','trabajadora','trabajadoras','empleador','empleadores','empresa','empresas','administrado','administrados','sunafil','procedimiento','sancionador','laboral','laborales','relacion','resolucion','sala','plena','tribunal','precedente','precedentes','criterio','criterios','autoridad','administrativa','administrativo','observancia','obligatoria','normas','norma','derecho','trabajo','materia','caso','casos','infraccion','infracciones']);

// sinónimos y términos relacionados (normalizados: minúsculas, sin tildes)

// raíz muy simple: quita -es / -s final para que "multas" y "multa" coincidan
const raiz = (t) => t.length >= 6 && t.endsWith('es') ? t.slice(0, -2) : (t.length >= 5 && t.endsWith('s') ? t.slice(0, -1) : t);

function tokensDe(qn) {
  return qn.split(' ').filter(t => (t.length >= 3 || /\d/.test(t)) && !STOP.has(t));
}

function conceptos(qn) {
  const todos = tokensDe(qn);
  // las palabras genéricas solo se descartan si la consulta tiene otras más específicas
  const sig = todos.filter(t => !GENERIC.has(t));
  const toks = sig.length ? sig : todos;
  const lista = toks.map(t => {
    const r = raiz(t);
    return [...new Set([r, t, ...(SYN[t] || []), ...(SYN[r] || [])])];
  });
  // expresiones de varias palabras que aparecen en la consulta
  Object.keys(SYN).filter(k => k.includes(' ') && qn.includes(k)).forEach(k => {
    if (!lista.some(g => g[0] === k)) lista.push([k, ...SYN[k]]);
  });
  return { toks, grupos: lista };
}

// coincidencia por palabra: el término debe iniciar palabra y admitir solo terminaciones de plural o
// derivados comunes (accidente -> accidentes, vacacion -> vacacional). No admite "-ador":
// así "sancion" no acierta en "sancionador" (que aparece en casi todos los precedentes).
const SUFIJOS = '(?:s|es|a|as|o|os|al|ales|ada|adas|ado|ados)?';
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const contiene = (hay, termino) => new RegExp('(^|[^a-z0-9])' + escRe(termino) + SUFIJOS + '($|[^a-z0-9])').test(hay);

// Dos niveles de texto del precedente:
//  - curado: título, criterio, tema(s), palabras clave (coincidencia fuerte);
//  - fundamentos: texto de los fundamentos citados (coincidencia débil: cuenta solo si el término
//    aparece al menos 3 veces, para no confundir una mención de paso con el tema del precedente).
// La nota de la base no se busca.
const MIN_MENCIONES = 3;
function textoCurado(p) {
  return norm([p.titulo, p.criterio, p.tipo, ...p.temas.map(t => t.join(' ')), ...(p.palabras || [])].join(' '));
}
function textoFundamentos(p) {
  return norm((p.textos || []).map(b => b.texto).join(' '));
}
function menciones(hay, termino) {
  const re = new RegExp('(^|[^a-z0-9])' + escRe(termino) + SUFIJOS + '($|[^a-z0-9])', 'g');
  return (hay.match(re) || []).length;
}

function buscar(consulta, anio) {
  const qn = norm(consulta);
  const { toks, grupos: gr } = conceptos(qn);
  if (!gr.length) return { resultados: [], sinSentido: toks.length === 0 };
  const res = [];
  PRECS.forEach(p => {
    if (anio && String(p.anio) !== String(anio)) return;
    const cur = textoCurado(p);
    const fund = textoFundamentos(p);
    const hits = [];
    let peso = 0;
    gr.forEach(g => {
      const fuerte = g.find(alt => contiene(cur, alt));
      if (fuerte) { hits.push(fuerte); peso += 1; return; }
      const debil = g.find(alt => menciones(fund, alt) >= MIN_MENCIONES);
      if (debil) { hits.push(debil); peso += 0.5; }
    });
    const req = gr.length <= 2 ? gr.length : Math.ceil(gr.length * 0.6);
    if (hits.length < req) return;
    const frase = qn.length >= 4 ? (contiene(cur, qn) ? 1 : (contiene(fund, qn) ? 0.5 : 0)) : 0;
    res.push({ p, score: peso / gr.length + frase, hits });
  });
  res.sort((a, b) => b.score - a.score || b.p.anio - a.p.anio);
  return { resultados: res, sinSentido: false };
}

const ACC = { a:'[aáàAÁÀ]', e:'[eéèEÉÈ]', i:'[iíìIÍÌ]', o:'[oóòOÓÒ]', u:'[uúùüUÚÙÜ]', n:'[nñNÑ]' };
const LETRA = 'A-Za-zÁÉÍÓÚÜáéíóúüÑñ0-9';
function resaltar(texto, terminos) {
  let out = esc(texto);
  const ordenados = [...new Set(terminos)].sort((a, b) => b.length - a.length);
  ordenados.forEach(t => {
    const base = [...t].map(ch => ch === ' ' ? '\\s+' : (ACC[ch] || escRe(ch))).join('');
    const patron = `(?<![${LETRA}])${base}(?:s|es|a|as|o|os|al|ales|ada|adas|ado|ados)?(?![${LETRA}])`;
    try { out = out.replace(new RegExp(patron, 'gi'), m => `<mark>${m}</mark>`); } catch (e) { /* patrón inválido: se omite */ }
  });
  return out;
}

function tarjetaResultado(r, terminos) {
  const p = r.p;
  const coinc = [...new Set(r.hits)].map(h => `<span class="chip hit">${esc(h)}</span>`).join('');
  return `
    <article class="card">
      ${cabecera(p, false)}
      <h3>${resaltar(p.titulo, terminos)}</h3>
      <p class="origen">${p.temas.map(t => esc(rutaTxt(t))).join('<br>')}</p>
      <p>${resaltar(p.criterio, terminos)}</p>
      ${bloqueTexto(p, terminos, true)}
      ${coinc ? `<div class="chips" aria-label="Términos coincidentes">${coinc}</div>` : ''}
      ${botonesPdf(p)}
    </article>`;
}

function mostrarBusqueda(consulta) {
  const cont = $('#resultados');
  const q = consulta.trim();
  if (!q) { cont.innerHTML = '<p class="summary-line">Escribe una palabra o una frase para buscar en los precedentes.</p>'; return; }
  const anio = $('#anio').value;
  const { resultados, sinSentido } = buscar(q, anio);
  const filtro = anio ? ` (año ${anio})` : '';
  if (sinSentido || !resultados.length) {
    cont.innerHTML = `
      <div class="empty" role="status">
        <p><strong>No existe ningún precedente de observancia obligatoria relacionado con «${esc(q)}»${filtro}.</strong></p>
        <p>Revisa la ortografía, prueba con un sinónimo o una palabra más general, o explora los temas en la pestaña anterior.</p>
        ${anio ? '<p>Si quitas el filtro de año, la búsqueda considera todos los precedentes 2021–2025.</p>' : ''}
      </div>`;
    return;
  }
  const terminos = [];
  resultados.forEach(r => r.hits.forEach(h => terminos.push(h)));
  const { grupos: gr } = conceptos(norm(q));
  gr.forEach(g => g.forEach(t => terminos.push(t)));
  const cuenta = resultados.length === 1 ? '1 precedente relacionado' : `${resultados.length} precedentes relacionados`;
  cont.innerHTML = `<p class="summary-line">${cuenta} con «${esc(q)}»${filtro}.</p>` +
    resultados.map(r => tarjetaResultado(r, terminos)).join('');
}

$('#form-buscar').addEventListener('submit', e => {
  e.preventDefault();
  mostrarBusqueda($('#q').value);
});
$('#anio').addEventListener('change', () => { if ($('#q').value.trim()) mostrarBusqueda($('#q').value); });

const EJEMPLOS = ['hostilidad', 'vacaciones truncas', 'subordinación', 'lactancia', 'huelga', 'trabajo infantil', 'accidente mortal', 'gratificaciones'];
$('#ejemplos').innerHTML = '<span>Ejemplos:</span>' + EJEMPLOS.map(e => `<button class="chip" type="button" data-q="${esc(e)}">${esc(e)}</button>`).join('');
$('#ejemplos').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  $('#q').value = b.dataset.q;
  mostrarBusqueda(b.dataset.q);
}));

/* ---------- pie ---------- */
$('#total').textContent = plural(PRECS.length, 'precedente', 'precedentes') + ' de observancia obligatoria';

renderExplorar();
</script>
