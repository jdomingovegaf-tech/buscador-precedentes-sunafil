istrados que resulten pertinentes para el análisis material y formal de la imputación efectuada (pudiendo descartarse argumentos temerarios, de mala fe o meramente insustanciales), lo que resulta necesario para una valoración adecuada de los fundamentos de hecho y de derecho en un caso particular. Asimismo, es preciso sustentar adecuadamente la aplicación, interpretación o integración normativa que corresponda a la absolución de las alegaciones planteadas por los administrados que cumplan con ser razonablemente relevantes en la discusión jurídica que un recurso administrativo o escrito de descargos pueda proponer, conforme a los precedentes o jurisprudencia constitucionalmente aplicables a cada caso."}]}, {"id": "2024-012", "anio": 2024, "numero": "012-2024", "tipo": "Precedente", "titulo": "Delimitación del número de trabajadores afectados", "criterio": "Criterio respecto a la delimitación del número de trabajadores afectados (fund. 6.5, 6.12, 6.13 y 6.15).", "fundamentos": "6.5, 6.12, 6.13 y 6.15", "palabras": ["trabajadores afectados", "número de trabajadores", "cantidad de trabajadores", "graduación"], "temas": [["Procedimiento sancionador y principios", "Sanciones", "Número de trabajadores afectados"]], "archivo": "pdf/2024-012.pdf", "archivo_nombre": "Resolucion-012-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.5", "texto": "Por ello, no es razonable –ni proporcional– que durante las actuaciones inspectivas y la posterior etapa instructiva – dentro del procedimiento administrativo sancionador – se acuda a una lectura muy superficial del contenido de la información disponible por la interoperatividad institucional existente, lejos de determinar de manera fehaciente cuántos fueron los reales afectados con las conductas objeto de investigación."}, {"fundamento": "6.12", "texto": "A consideración de esta Sala, la interposición de una sanción sin haberse identificado correctamente la identidad y, con ello, el número de trabajadores afectados —elemento sustancial para la determinación de la cuantía de la multa a imponer— genera serios cuestionamientos a la aplicación de la potestad sancionadora en los casos analizados por la inspección del trabajo y por los órganos sancionadores de la SUNAFIL."}, {"fundamento": "6.13", "texto": "En este extremo, con el fin de subrayar el control que debe practicarse sobre el particular desde la instauración del procedimiento sancionador, es importante recordar que la versión 02 de la “Directiva N° 001-2017-SUNAFIL/ INII - Directiva que regula el Procedimiento Sancionador del Sistema de Inspección del Trabajo” aprobada mediante Resolución de Superintendencia N° 190-2021-SUNAFIL del 28 de junio de 2021, le confiere a la autoridad sancionadora de primera instancia (la Sub Intendencia de Resolución) la potestad de estimar la suficiencia del Informe Final de Instrucción, pudiendo disponer la realización de actuaciones complementarias, siempre que las considere estrictamente indispensables para resolver el procedimiento (literales “c” y “g” del punto 6.4.2.4)."}, {"fundamento": "6.15", "texto": "En ese sentido, la falta de una correcta determinación de los trabajadores afectados atendiendo a las condiciones identificadas durante las actuaciones inspectivas de investigación – y complementadas durante la etapa instructiva - conlleva a una afectación a los principios de razonabilidad y proporcionalidad; incurriéndose además en un supuesto de indebida motivación de las infracciones impuestas o a imponer."}]}, {"id": "2024-013", "anio": 2024, "numero": "013-2024", "tipo": "Precedente", "titulo": "Deber de colaboración de los administrados con la actuación inspectiva", "criterio": "Criterio respecto al deber de colaboración de los administrados con la actuación inspectiva (fund. 6.61, 6.69 y 6.70).", "fundamentos": "6.61, 6.69 y 6.70", "palabras": ["colaboración", "deber de colaboración", "inspección", "administrado"], "temas": [["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Deber de colaboración del administrado"]], "archivo": "pdf/2024-013.pdf", "archivo_nombre": "Resolucion-013-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.61", "texto": "Como se ve, la normativa citada, así como la documentación que obra en el expediente permite apreciar al Consorcio como sujeto obligado a una serie de manifestaciones que potencialmente podrían generar consecuencias laborales. Por ello, el examen de su comportamiento respecto de quienes brinden servicios personales bajo su ámbito operativo es un asunto sobre el que la competencia de la Superintendencia Nacional de Fiscalización Laboral – SUNAFIL, es plena. Así, se debe concluir que el Consorcio es responsable de ejecutar las prestaciones derivadas del deber de colaboración hacia la labor inspectiva (tales como la entrega de información a requerimientos efectuados por la inspección del trabajo o no asistir a las comparecencias debidamente notificadas, comportamientos exigibles y que son objeto de reproche en el presente caso)."}, {"fundamento": "6.69", "texto": "Así, a consideración de esta instancia de revisión, el consorcio no puede ser descartado a priori como un agente que, en el ámbito de las relaciones laborales, no puede comportarse como empleador, es decir, con la facultad de intervenir sobre prestadores de servicios, subordinándolos a través de vínculos jurídicos directos. Más allá de las precauciones contractuales, societarias o documentales laborales, el principio de primacía de la realidad interviene, sin lugar a duda, cuando el consorcio adopta materialmente el comportamiento de empleador, ejerciendo las facultades del poder de dirección sobre los trabajadores a su cargo (en particular la facultad directriz)."}, {"fundamento": "6.70", "texto": "Para tal finalidad, debe ser perceptible que el consorcio requerido ejerza alguna de las atribuciones del empleador pues puede ser suficiente para que se produzca el efecto de subordinar al personal de nóminas ajenas, así sean estas cualquiera de las partes que se consorcian. Así, la inspección del trabajo está plenamente facultada a requerir información a un consorcio si se establece una hipótesis razonable sobre su comportamiento como empleador al existir uso de las facultades organizadora, fiscalizadora y disciplinaria —siendo la primera de ellas especialmente relevante— todo lo cual reposa en la exigibilidad del deber de colaboración del mismo consorcio hacia la inspección del trabajo. Sobre la Resolución de Sub Intendencia N° 087-2022-SUNAFIL/IRE-PUN/SISA"}]}, {"id": "2024-014", "anio": 2024, "numero": "014-2024", "tipo": "Precedente", "titulo": "Rasgos de laboralidad que evidencian el elemento de subordinación", "criterio": "Criterio sobre los rasgos de laboralidad que evidencian el elemento de subordinación en una relación de carácter laboral (fund. 6.14 a 6.18 y 6.21 a 6.24).", "fundamentos": "6.14, 6.15, 6.16, 6.17, 6.18, 6.21, 6.22, 6.23 y 6.24", "palabras": ["subordinación", "laboralidad", "relación laboral", "desnaturalización", "indicios", "locación de servicios"], "temas": [["Relación de trabajo y derechos laborales", "Existencia de relación laboral", "Subordinación y laboralidad"]], "archivo": "pdf/2024-014.pdf", "archivo_nombre": "Resolucion-014-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.14", "texto": "Ahora, conforme se advierte de los actuados y del numeral 4.5 del Acta de Infracción, el inspector comisionado verificó que en el caso los servicios prestados por las siete (7) personas entrevistadas en la visita inspectiva del 11 de diciembre de 2019, cuyos datos fueron registrados en el formato denominado “Relación de personal”, concurren los tres elementos de una relación de naturaleza laboral. Sobre la prestación personal y directa de un servicio, se verificó que las señoras Patricia Esperanza García Puerta y Rosa Milagros Silva Ortega prestaban servicios de asesoría administrativa, conforme se observó de sus contratos de locación de servicios, en el cargo de “Asesoras de reclutamiento”. Asimismo, se verificó que los señores Natalia Valencia Medina, Winnie Doniña Valenzuela, Rubén Daniel Metzeger Gonzales, Cesar Augusto Marrufo Malmaceda, y José Eduardo Guzmán Chirinos prestaban servicios como “profesores de inglés” de acuerdo con sus contratos de locación de servicios."}, {"fundamento": "6.15", "texto": "Asimismo, se observa que las funciones y actividades realizadas por las personas afectadas, guardaban una relación estrecha con la actividad principal de la empresa inspeccionada. En efecto, la cláusula primera de los contratos de locación de servicios suscritos con aquellas recoge la siguiente información: “PRIMERO.- “LA EMPRESA” es una empresa constituida mediante Escritura Pública de fecha 29 de Septiembre del año 2005, otorgada ante el Señor Notario Luis Dannon Brender, dedicada a brindar servicios de representación de empresas nacionales o extranjeras, empresas navieras, marítimas de marina mercante, de cruceros vacacionales, así como a la presentación de servicios de logística, reclutamiento y capacitación de recursos humanos, consultoría, reparación, mantenimiento, educación y en general servicios de cualquier naturaleza, que corre inscrita en la partida N°11802877.”"}, {"fundamento": "6.16", "texto": "Atendiendo a ello, se advierte que parte de los servicios relacionados con la actividad principal de la empresa inspeccionada son: reclutamiento y capacitación de recursos humanos, y educación, los cuales, justamente, coinciden con las labores que brindaban las personas afectadas, de acuerdo a lo apreciado en sus contratos de locación de servicios: por un lado, “actividades de asesoría administrativa”, específicamente de “reclutamiento”, desempeñadas por parte de las señoras Patricia Esperanza García Puerta y Rosa Milagros Silva Ortega; y, por otro, labores de “educación”, “clases de inglés” por parte de los señores Natalia Valencia Medina, Winnie Doniña Valenzuela, Ruben Daniel Metzeger Gonzales, Cesar Augusto Marrufo Malmaceda, y José Eduardo Guzman Chirinos."}, {"fundamento": "6.17", "texto": "Sobre el hecho de que una persona brinde servicios permanentes, habituales u ordinarios, relacionados con la actividad principal de la entidad empleadora, la jurisprudencia constitucional y ordinaria, ha sido clara, concluyendo que este tipo de prestación de servicios califica como un rasgo sintomático de laboralidad12."}, {"fundamento": "6.18", "texto": "De acuerdo con los criterios esbozados, en el presente caso, queda claro entonces que las labores realizadas por los trabajadores corresponden a actividades ordinarias y de carácter permanente, y que al formar parte de los servicios que brinda el sujeto inspeccionado como actividad principal, constituyen indicios de laboralidad que demuestran que este tipo de servicios no debieron realizarse en el marco de un contrato civil."}, {"fundamento": "6.21", "texto": "Del mismo modo, en la cláusula sexta de los contratos de locación se observa un pacto de exclusividad (rasgo sintomático de laboralidad) que impone el sujeto inspeccionado a los señores: García Puerta Patricia Esperanza, Silva Ortega Rosa Milagros, Valencia Medina Natalia, Doniña Valenzuela Winnie, Metzger Gonzales Ruben Daniel, Marrufo Malmaceda Cesar Augusto y Guzmán Chirinos José Eduardo, en los términos siguientes: “SEXTO.- (...) Serán causales de término de contrato, sin que ello genere obligación de pago adicional a favor de EL LOCADOR, con excepción del servicio brindado hasta la fecha de conclusión del contrato, los siguientes casos: (..) -Cuando EL LOCADOR realice en forma paralela otras actividades o servidos similares o relacionados a los que realiza para la naturaleza del presente contrato.” (énfasis nuestro)"}, {"fundamento": "6.22", "texto": "En relación con este elemento de exclusividad, García (2010) indica que existen circunstancias que evidencian en los hechos la existencia de subordinación en un contrato de locación de servicios, tal como la exclusividad. Para este autor, este elemento o rasgo de laboralidad no debería ser una regla para el locador de servicios, pues lo usual es que quien presta servicios de manera independientemente tiene un sin número de clientes entre personas naturales y jurídicas, a todas las cuales brinda sus servicios de manera simultánea13 ."}, {"fundamento": "6.23", "texto": "Así este rasgo o característica genera una mayor certeza para identificar si nos encontramos frente a una relación de carácter laboral o simplemente civil. En palabras de Toyama (2015), la exclusividad constituye un criterio de valoración utilizado en la jurisprudencia para analizar la laboralidad de una prestación de servicios, dado que, en los contratos de locación de servicios, estos últimos suelen ser para diversas empresas; mientras que, en los contratos laborales, normalmente hay exclusividad 14 . La Corte Suprema también, al respecto, ha indicado que uno de los elementos típicos para determinar la existencia de vínculo laboral, consiste en la exclusividad del servicio para un empleador (Casación Laboral Nº 8222-2016-ANCASH)."}, {"fundamento": "6.24", "texto": "Por consiguiente, al introducirse en el contrato de locación de servicios celebrado con las personas afectadas, un pacto de exclusividad cuyo incumplimiento califica como causal de término de la relación contractual, manifiesta y enfatiza que la exclusividad es un claro rasgo de laboralidad. Atendiendo a este punto, y a los desarrollados también en los fundamentos 6.14 a 6.18, a criterio de Sala se deduce la existencia del elemento de subordinación laboral, debiendo desestimarse cualquier argumento dirigido a cuestionar este extremo."}]}, {"id": "2024-015", "anio": 2024, "numero": "015-2024", "tipo": "Precedente", "titulo": "Acumulación de procedimientos administrativos sancionadores", "criterio": "Criterio referido a la acumulación de procedimientos administrativos sancionadores (fund. 6.10, 6.11, 6.13, 6.16 y 6.17).", "fundamentos": "6.10, 6.11, 6.13, 6.16 y 6.17", "palabras": ["acumulación", "procedimientos", "expedientes", "acumular"], "temas": [["Procedimiento sancionador y principios", "Concurso y continuidad de infracciones", "Acumulación de procedimientos"]], "archivo": "pdf/2024-015.pdf", "archivo_nombre": "Resolucion-015-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.10", "texto": "En sentido estricto, los procedimientos administrativos contenidos en la LGIT o la RLGIT, así como al ejercicio de la actividad administrativa de fiscalización del sistema de inspección del trabajo, deben observar, necesariamente, lo dispuesto en el TUO de la LPAG. A excepción de aquellos casos en que la norma especial (LGIT o la RLGIT) establezca una regulación más favorable a los administrados, se aplicarán tales normas en lugar de la norma común (TUO de la LPAG), conforme lo dispone el numeral 1.613 del artículo IV del TUO de la LPAG, así como el numeral 247.214 del artículo 247 del mismo cuerpo normativo, ordenador de los sistemas administrativos."}, {"fundamento": "6.11", "texto": "Toda actuación de la Administración Pública -indistintamente de la calificación que ésta reciba- debe ser acorde con los principios y el contenido del TUO de la LPAG, como manifestación de validez de sus procedimientos, que se materializan en actos administrativos, los cuales no pueden generarse en contravención a la Constitución, las leyes o a las normas reglamentarias (según el numeral 4 del artículo 10 del TUO de la LPAG)."}, {"fundamento": "6.13", "texto": "Por tanto, la existencia de procedimientos sancionadores llevados por la inspección de trabajo de forma simultánea, cuando estos son iniciados por un mismo trabajador en contra de un mismo empleador (sujeto inspeccionado) invocando la misma conducta proscrita por Ley, transgrede el principio de razonabilidad, que tiene por objeto regular las actuaciones de la administración15. De observarse lo expuesto, el órgano administrativo a cargo, deberá evaluar si es física y jurídicamente posible la aplicación de la acumulación de procedimientos, dispuesto en el artículo 16016 del TUO de la LPAG. Esto en virtud de una multiplicidad de intereses públicos concurrentes, entre los que podemos referir: i) proveer una eficiente atención a las necesidades ciudadanas de quienes denuncian que sus empleadores cometieron infracciones típicas de diversas normas de trabajo; ii) reducir el número de procedimientos, privilegiando que uno solo pueda tener diversos objeto; reducir el riesgo de que la Administración Pública emita pronunciamientos contradictorios."}, {"fundamento": "6.16", "texto": "Atendiendo a lo descrito precedentemente, para identificar un supuesto de acumulación en los procesos a cargo del sistema de inspección de trabajo, es necesario determinar la concurrencia copulativa de los siguientes elementos en los expedientes iniciados (fiscalizadores o sancionadores), solicitudes, o denuncias tramitadas ante el sistema de inspección del trabajo: a. Identidad del sujeto investigado. Debe advertirse si las actuaciones de la inspección de trabajo y/o la del órgano administrativo sancionador, se ejercen o ejercerán contra el mismo administrado. b. Conexidad de hechos. En relación con la materia del reproche administrativo, los servidores del Sistema de Inspección del Trabajo deben observar la homogeneidad de la norma infringida, bien jurídico lesionado, así como la conexión temporal existente. c. Conexidad de afectados. Es necesario que los agentes del Sistema de Inspección del Trabajo determinen si las diversas actuaciones se producen respecto del mismo trabajador o trabajadores afectados en ambos procedimientos. En este caso debe prestarse atención a los casos promovidos por un trabajador singular y un sindicato que actúe en su nombre, sea que se trate de un afiliado a dicha organización de trabajadores o no. d. Unidad del órgano competente. Finalmente, la Administración Pública debe evaluar y analizar si los procedimientos están a cargo de un mismo órgano administrativo, es decir, cuando dicha competencia corresponda que sea ejercida a través de una sola intendencia regional de la SUNAFIL. De lo contrario, no será posible disponer su acumulación si dichos procedimientos se encuentran dentro de la competencia territorial de distintos órganos administrativos (carácter suprarregional de una infracción, que en el actual estado de cosas motiva actuaciones coordinadas entre las diversas intendencias intervinientes)."}, {"fundamento": "6.17", "texto": "Por resultar conveniente para la aplicación uniforme del Derecho dentro del Sistema de Inspección del Trabajo, los criterios precedentes, elevados al rango de precedentes vinculantes, permiten a la administración acumular los procedimientos administrativos sancionadores en un solo procedimiento. Con excepción de aquellos procesos administrativos de carácter suprarregional, cada Intendencia Regional evaluará su propia competencia conforme con la legislación aplicable y determinará -en aplicación del precedente vinculante que se está aprobando- si cabe proseguir con los procedimientos administrativos respectivos de forma independiente o de forma acumulda."}]}, {"id": "2024-016", "anio": 2024, "numero": "016-2024", "tipo": "Precedente", "titulo": "Buena fe procedimental y licencias de maternidad y lactancia", "criterio": "Criterio sobre la vulneración del principio de buena fe procedimental y la prohibición de compensar o sustituir por el empleador las licencias de maternidad y/o lactancia materna (fund. 6.20 a 6.26).", "fundamentos": "6.20, 6.21, 6.22, 6.23, 6.24, 6.25 y 6.26", "palabras": ["maternidad", "lactancia", "licencia", "buena fe procedimental", "compensar", "sustituir"], "temas": [["Relación de trabajo y derechos laborales", "Protección de trabajadoras", "Licencias de maternidad y lactancia"], ["Procedimiento sancionador y principios", "Principios del procedimiento", "Buena fe procedimental"]], "archivo": "pdf/2024-016.pdf", "archivo_nombre": "Resolucion-016-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.20", "texto": "De acuerdo al caso concreto, esta Sala cree conveniente citar el contenido del principio de buena fe procedimental11, el cual dispone que tanto la autoridad administrativa, los administrados, sus representantes o abogados y, en general, todos los partícipes del procedimiento, realizan sus respectivos actos procedimentales guiados por el respeto mutuo, la colaboración y la buena fe, precisando ninguna regulación del procedimiento administrativo puede interpretarse de modo tal que ampare alguna conducta contra la buena fe procedimental."}, {"fundamento": "6.21", "texto": "Así, se establece que, los administrados deben actuar respetando las garantías del debido procedimiento y utilizar los recursos administrativos dispuestos en la ley, para esclarecer la verdad material en el procedimiento, no siendo coherente con este principio, la presentación de medios probatorios que, por el contrario, en lugar de fundamentar sus recursos, se presentan con la finalidad de dilatar el procedimiento y conteniendo datos que no se sujeten a lo afirmado en sus escritos impugnatorios, exigiendo a esta Administración una mayor cantidad de tiempo para analizar el caso concreto, con el fin de verificar si finalmente, esos documentos desestiman o no la conducta infractora."}, {"fundamento": "6.22", "texto": "Así también, la impugnante demuestra una vulneración al principio de presunción de veracidad12, cuando procura corregir o modificar sus declaraciones realizadas frente al inspector de trabajo, en las comparecencias de fechas 26 de diciembre de 2019 y 20 de enero de 2020 (en las que indicó que la trabajadora sí laboró y que se le compensaría lo laborado como pago por horas extras) para luego, mediante su recurso de reconsideración y con los documentos presentados como supuestas pruebas nuevas, tratar de acreditar infructuosamente que la trabajadora no laboró en dichas fechas. Cabe precisar que, si bien este principio admite prueba en contrario, ello no quiere decir que el administrado va a presentar cualquier tipo de medio probatorio que no demuestre sus argumentos o afirmaciones."}, {"fundamento": "6.23", "texto": "Por consiguiente, en los casos que se advierta que los administrados han presentado medios probatorios, bajo el amparo de que constituyen nueva prueba o que estos desestimarían la conducta imputada, pero que, en realidad no cumplen con dicha finalidad, se considerará que este administrado ha incurrido en un acto de mala fe procedimental. Asimismo, los vocales firmantes acuerdan que, atendiendo a que hay profesionales del derecho que patrocinan este tipo de recursos impugnatorios, corresponde que estos casos sean puestos en conocimiento del Colegio de Abogados respectivo, a fin de que este gremio profesional adopte las acciones que correspondan en el marco de sus competencias."}, {"fundamento": "6.24", "texto": "Por otra parte, se debe considerar que antes de la presentación de estos documentos, la impugnante con sus declaraciones en las comparecencias de fechas 26 de diciembre de 2019 y 20 de enero de 2020, indicó (Constitucionales, Judiciales y Administrativos) que la trabajadora laboró en los días del 9 y 10 de abril de 2019; además, de indicar que no gozó de su licencia por lactancia, puntualizando que para ambos supuestos (descanso de maternidad y lactancia), se acordó con la trabajadora el pago de esos días laborados como concepto de horas extras."}, {"fundamento": "6.25", "texto": "De acuerdo con dicha afirmación, a la cual esta Sala le otorga el carácter de declaración asimilada, la impugnante confirma la infracción al numeral 25.16 del artículo 25 del RLGIT, debido a que la misma norma, prohíbe que la licencia por lactancia sea objeto de cualquier tipo de compensación, Así tenemos que, la Ley Nº 27240, Ley que otorga permiso por lactancia materna, dispone lo siguiente: “Artículo 1.- Del objeto de la Ley 1.1 La madre trabajadora, al término del período postnatal, tiene derecho a una hora diaria de permiso por lactancia materna, hasta que su hijo tenga un año de edad. En caso de parto múltiple, el permiso por lactancia materna se incrementará una hora más al día. Este permiso podrá ser fraccionado en dos tiempos iguales y será otorgado dentro de su jornada laboral, en ningún caso será materia de descuento. 1.2 La madre trabajadora y su empleador podrán convenir el horario en que se ejercerá el derecho establecido en el párrafo precedente. 1.3 El derecho que por la presente Ley se otorga no podrá ser compensado ni sustituido por ningún otro beneficio.” (énfasis añadido)"}, {"fundamento": "6.26", "texto": "En torno al descanso por maternidad, si bien es cierto, el marco normativo sobre la materia (Ley Nº 26644 y su Reglamento), no especifica expresamente que es inviable su compensación, con el pago de horas extras, por ejemplo, no puede perderse de vista que su regulación, como lo precisa nuestro Tribunal Constitucional, constituye un mecanismo que: “busca asegurar la viabilidad del embarazo, así como la salud de la madre y de la persona por nacer; y, con posterioridad al nacimiento, está destinado a favorecer la lactancia, afianzar el vínculo materno filial y desarrollar un puerperio normal”13. Asimismo, el mencionado colegiado, precisa que: “(...) el derecho a gozar de licencia por maternidad constituye, claramente, un contenido implícito de los derechos antes referidos (salud reproductiva, salud del medio familiar), que se encuentra reforzado por la especial protección reconocida por la Constitución a la madre trabajadora”14. Atendiendo a ello, esta Sala considera que resulta contrario a la finalidad de la regulación del descanso por maternidad, y a las bases constitucionales del mismo, convalidar un acuerdo de compensación de este tipo, por lo que no corresponde, tampoco, considerar como válidos los extremos expuestos por el impugnante en relación con la compensación de este derecho."}]}, {"id": "2024-017", "anio": 2024, "numero": "017-2024", "tipo": "Precedente", "titulo": "Carga de la prueba de la administración en la calificación de actos de hostilidad", "criterio": "Criterio referido a la carga de la prueba de la administración en la calificación de actos de hostilidad laboral (fund. 6.28 a 6.30 y 6.39).", "fundamentos": "6.28, 6.29, 6.30 y 6.39", "palabras": ["carga de la prueba", "hostilidad", "prueba", "administración"], "temas": [["Libertad sindical y negociación colectiva", "Actos de hostilidad", "Carga de la prueba"], ["Procedimiento sancionador y principios", "Prueba", "Carga de la prueba"]], "archivo": "pdf/2024-017.pdf", "archivo_nombre": "Resolucion-017-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.28", "texto": "De los medios de prueba aportados al proceso, tenemos que el administrado ha dispuesto la entrega de una serie de beneficios económicos a favor del trabajador trasladado a otro ámbito geográfico, sin que la inspección de trabajo ni el órgano sancionador hayan valorado suficientemente elementos probatorios indispensables para poder entender correctamente como desvirtuado al Principio de Presunción de Licitud del administrado, en este caso en concreto. Al respecto, nótese que hay una disposición empresarial que puede analizarse con relación a su proporción con los medios y fines admitidos dentro del poder de dirección. De esta forma, resulta necesario que la inspección del trabajo determine si es un ejercicio lícito o no del ius variandi o si el comportamiento analizado en este caso —el traslado del centro habitual de labores acompañado de una política destinada a amortizar los posibles perjuicios que esta pudiera causar al trabajador desplazado— es un comportamiento subsumible en el ius variandi lícito o si no es tal caso. Resulta preocupante para esta instancia de revisión comprobar que ni la inspección ni la autoridad sancionadora han evaluado o desarrollado motivación dirigida a cuestionar o que nieguen, por ejemplo, la entrega y goce a favor del trabajador de ciertas compensaciones a favor de trabajadores desplazados; o que aun habiendo sido otorgados tales contraprestaciones, ellas hayan resultado inadecuadas en su cuantía (para amilanar o afrontar las nuevas condiciones de trabajo a los que ha sido sometido) o si simplemente no eran idóneas para compensar el efecto generado por la medida empleada."}, {"fundamento": "6.29", "texto": "Siguiendo la línea resolutiva de la Primera Sala del Tribunal de Fiscalización Laboral —consúltense las Resoluciones Nros. 643, 1042, 1086-2022-SUNAFIL/TFLPrimera Sala, así como las Resoluciones Nros. 789, 872, 943, 1054, 1058-2023-SUNAFIL/TFL-Primera Sala y las Resoluciones Nros. 052, 130-2024-SUNAFIL/TFL-Primera Sala, entre otras— y en virtud del principio de verdad material,14 es preciso afirmar que sobre la Administración recae la carga probatoria de verificar plenamente los hechos que sirven de motivo para sus respectivas decisiones (esto es, la determinación de multas u obligaciones al sujeto inspeccionado). Para estos fines, la autoridad fiscalizadora debe adoptar todas las medidas razonables para satisfacer la carga probatoria que recae sobre la Administración, con la participación indispensable del deber de colaboración de los sujetos inspeccionados, conforme a Ley."}, {"fundamento": "6.30", "texto": "Por tanto, no todo cambio en las condiciones de trabajo implica prima facie un comportamiento hostil del empleador susceptible de responsabilidad administrativa. Por ello, para calificar un ejercicio del ius variandi como un acto hostil, es necesario, que la inspección de trabajo y el órgano administrativo a cargo del procedimiento sancionador realicen una adecuada motivación que desvirtúe el Principio de Presunción de Licitud del sujeto inspeccionado."}, {"fundamento": "6.39", "texto": "Por tanto, las denuncias requieren de una investigación y corroboración mínima, que considere las pruebas directas o indirectas disponibles, contraprueba y una investigación jurídica de parte del inspector de trabajo que, cuando sea satisfactoria, derrote la presunción de licitud y permita subsumir los hechos investigados en una norma sancionadora."}]}, {"id": "2024-018", "anio": 2024, "numero": "018-2024", "tipo": "Precedente", "titulo": "Medida de requerimiento y principio de razonabilidad", "criterio": "Criterio referido a la medida de requerimiento y el principio de razonabilidad (fund. 6.14).", "fundamentos": "6.14", "palabras": ["medida de requerimiento", "razonabilidad", "requerimiento"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Razonabilidad de la medida"]], "archivo": "pdf/2024-018.pdf", "archivo_nombre": "Resolucion-018-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.14", "texto": "El Tribunal de Fiscalización Laboral recuerda que la aplicación del principio de razonabilidad es vinculante para la actuación de los servidores a cargo de la fiscalización. En ese sentido, de decidirse proceder en un caso con una medida de requerimiento, debe tenerse un análisis concreto ante casos complejos, donde existan diversos comportamientos que sean objeto de la misma medida. Así, es importante recordar a todos los órganos y servidores del Sistema de Inspección del Trabajo que, dentro de una medida de requerimiento, el inspector podría solicitar al sujeto inspeccionado la acreditación cabal del cumplimiento de ciertas reglas objeto de supervisión dentro de la normativa sociolaboral y seguridad y salud en el trabajo, siendo exigible que, ex ante, se establezcan plazos razonables para su ejecución por parte del empleador; o bien que, ex post la Administración del Trabajo valore lo lapsos distinguibles para cumplir con las medidas de requerimiento que comprendan a varios comportamientos exigidos al empleador."}]}, {"id": "2024-019", "anio": 2024, "numero": "019-2024", "tipo": "Precedente", "titulo": "Razonabilidad y supuestos de exceso de punición administrativa", "criterio": "Criterio referido a la aplicación del principio de razonabilidad y a la identificación de los supuestos de exceso de punición administrativa (fund. 6.16 a 6.19).", "fundamentos": "6.16, 6.17, 6.18 y 6.19", "palabras": ["razonabilidad", "exceso de punición", "sanción", "multa"], "temas": [["Procedimiento sancionador y principios", "Sanciones", "Razonabilidad y exceso de punición"]], "archivo": "pdf/2024-019.pdf", "archivo_nombre": "Resolucion-019-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.16", "texto": "Del análisis del caso, se observa que el 31 de mayo de 2021 el inspector verificó que la impugnante no acreditó el íntegro de lo exigido en la medida inspectiva de requerimiento: la entrega de las constancias de alta de la planilla electrónica de 8 trabajadores. Posteriormente, la impugnante presentó sus descargos contra la Imputación de Cargos, anexando las mencionadas constancias de alta, las cuales fueron entregadas a los mencionados trabajadores el 3 de marzo de 2021, es decir, antes del 25 de octubre de 2021, fecha de notificación de la Imputación de Cargos. De esta manera, corresponde evaluar la proporción entre los medios y fines que supone la sanción administrativa, ya que de los actuados se advierte que el sujeto inspeccionado, pese a no cumplir íntegramente con el mandato contenido en la medida inspectiva de requerimiento, sí acredita que subsanó la obligación sociolaboral cuya exigencia es requerida mediante la mencionada medida correctiva antes del inicio del procedimiento administrativo sancionador."}, {"fundamento": "6.17", "texto": "En este punto, es importante señalar que, de acuerdo con lo expresado en el artículo 1 de la LGIT, la Inspección de Trabajo tiene dentro de sus finalidades la vigilancia del cumplimiento de las normas de orden sociolaboral y de seguridad y salud en el trabajo. Entonces, debe notarse que la impugnante subsanó de forma voluntaria la normativa sociolaboral afectada antes de haberse notificado la imputación de cargos, e incluso, antes de la emisión de la medida inspectiva de requerimiento, cuya naturaleza jurídica se basa en la búsqueda de la reversión de los efectos de la ilegalidad de la conducta cometida por el inspeccionado de manera previa al inicio del procedimiento sancionador."}, {"fundamento": "6.18", "texto": "Adicionalmente, es importante ponderar que, si bien la afectación recae sobre el deber de colaboración a la labor inspectiva (pues la impugnante no cumplió con acreditar íntegramente lo requerido por el inspector de trabajo dentro del plazo estipulado en la medida de requerimiento), la reversión del incumplimiento sociolaboral ocurrió a través del mismo sujeto inspeccionado, incluso con anterioridad a la emisión de dicha medida inspectiva. A juicio de este Tribunal, el supuesto descrito demuestra la voluntad del administrado de rectificar su conducta antijurídica y encaminarla conforme a lo dispuesto en nuestro Sistema Jurídico Laboral."}, {"fundamento": "6.19", "texto": "En consecuencia, es pertinente elevar a precedente de observancia obligatoria el criterio según el cual, imponer una sanción a la labor inspectiva cuando se ha cumplido con la subsanación voluntaria de las infracciones sociolaborales antes de la notificación de la imputación de cargos atenta contra el principio de razonabilidad, ya que el sujeto inspeccionado habría cumplido con la normativa, siendo ello la finalidad de la inspección de trabajo."}]}, {"id": "2024-020", "anio": 2024, "numero": "020-2024", "tipo": "Precedente", "titulo": "Actos de hostilidad atribuidos a empresas usuarias", "criterio": "Criterio referido a la determinación de actos de hostilidad atribuidos a empresas usuarias (fund. 6.25 a 6.27).", "fundamentos": "6.25, 6.26 y 6.27", "palabras": ["empresa usuaria", "hostilidad", "tercerización", "intermediación"], "temas": [["Libertad sindical y negociación colectiva", "Actos de hostilidad", "Empresas usuarias"]], "archivo": "pdf/2024-020.pdf", "archivo_nombre": "Resolucion-020-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.25", "texto": "En el caso revisado, se aprecia la existencia de una relación de subcontratación laboral, en la que el supuesto infractor de la normativa sociolaboral en materia de actos hostilidad, es la empresa usuaria o principal, respecto de una trabajadora de la empresa contratada para brindar el servicio; es decir, se ha identificado que una empresa, que en principio no es la empleadora de la trabajadora afectada, no adoptó oportunamente las acciones administrativas para el cese de actos de hostilidad y no brindó las medidas de protección que contribuyan en la permanencia en el puesto de trabajo y el bienestar general de la denunciante. Atendiendo a la situación particular que es analizada en este caso, este Tribunal observa que, en la medida en que el acto de hostilidad imputado a la empresa supuestamente infractora no se vincula con un accionar contrario a la normativa sociolaboral respecto de su propio personal, resulta cuestionable la imputación administrativa de aquel incumplimiento, más aún si, previamente, no se ha identificado si, en este caso específico, el mencionado contexto de subcontratación laboral, se encontraba desnaturalizado."}, {"fundamento": "6.26", "texto": "A consideración de este Tribunal, en casos similares al analizado en esta ocasión, corresponde que la inspección del trabajo realice un análisis que englobe la validez de un proceso de subcontratación laboral, a fin de proceder con la evaluación de la comisión de actos de hostilidad, por parte de la empresa principal o usuaria, en contra de trabajadores que en principio son de la entidad contratista, tercerizadora o intermediadora, o bien, examine las obligaciones de coordinación entre empresas vinculadas en un proceso de subcontratación a través de las normas de seguridad y salud en el trabajo."}, {"fundamento": "6.27", "texto": "Al respecto, resulta relevante que los órganos encargados de la calificación de las denuncias por actos de hostilidad enmarcadas dentro de un proceso de subcontratación laboral adopten ciertos recaudos. Cuando la denuncia se plantea contra una empresa principal o usuaria, por trabajadores contratados directamente por la empresa intermediadora o tercerizadora, es preciso que los diversos servidores y órganos del Sistema de Inspección del Trabajo evalúen lo señalado en los fundamentos 6.25 y 6.26, con la finalidad de que, al generar las órdenes de inspección que correspondan, en relación con todas las empresas involucradas, se comprenda de manera íntegra, las materias que el inspector o equipo inspector encuentre suficientes para viabilizar la correcta verificación de las posibles conductas infractoras. Sin perjuicio de ello, los inspectores comisionados se encuentran en la obligación de adoptar las acciones necesarias, en caso las órdenes de inspección emprendidas no comprendan a las empresas mencionadas o no contemplen todas las materias requeridas, para la adecuada investigación de los incumplimientos de hostilidad denunciados."}]}, {"id": "2024-021", "anio": 2024, "numero": "021-2024", "tipo": "Precedente", "titulo": "Ampliación de las materias inspeccionadas para verificar la desnaturalización", "criterio": "Criterio referido al deber de los inspectores comisionados de evaluar la ampliación de materias inspeccionadas para verificar la posible desnaturalización de la relación laboral y el cumplimiento de derechos sociolaborales (fund. 6.18 y 6.19).", "fundamentos": "6.18 y 6.19", "palabras": ["inspectores comisionados", "ampliación de materias", "desnaturalización", "derechos sociolaborales"], "temas": [["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Ampliación de materias inspeccionadas"]], "archivo": "pdf/2024-021.pdf", "archivo_nombre": "Resolucion-021-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.18", "texto": "Cuando la fiscalización determine incumplimientos sobre las formalidades legales exigibles para la celebración de contratos modales y/o modalidades formativas laborales, por cualquiera de los medios de toma de conocimiento de hechos relevantes en la investigación a cargo del inspector comisionado, se deberán adoptar las acciones necesarias para proseguir con las actuaciones inspectivas. En ese sentido, el inspector actuante, no debe limitarse a reiterar requerimientos de información que las propias inspeccionadas manifestaron no poseer o no haber elaborado. En ese supuesto, el personal inspectivo deberá ejercer sus potestades con la finalidad de tutelar los derechos sociolaborales involucrados, debiendo, preferentemente, solicitar la ampliación de las materias15 inspeccionadas (esto a fin de determinar la configuración de las causales de desnaturalización de la relación civil, modal o formativa y, de corresponder, las implicancias de la misma en el cumplimiento de las obligaciones sociolaborales conexas, tales como el pago de beneficios sociales, entre otros) o bien, ante la imposibilidad de la acción antes señalada, promover el inicio de la generación de otra orden de inspección, dirigiéndose a los órganos formuladores correspondientes."}, {"fundamento": "6.19", "texto": "En cualquier escenario, la inspección que califique la relación jurídica material entre la persona que presta servicios y el beneficiario de la misma debe efectuar un análisis jurídico basado en la aplicación de los principios de primacía de la realidad y de razonabilidad, según se desprenda de los hechos que se verifiquen durante el desarrollo de las actuaciones inspectivas, en los documentos presentados y/u obtenidos por los comisionados, así como en las declaraciones proporcionadas por las inspeccionadas en respuesta a las diligencias inspectivas."}]}, {"id": "2024-022", "anio": 2024, "numero": "022-2024", "tipo": "Precedente", "titulo": "Tipificación del incumplimiento de facilidades para la actividad sindical", "criterio": "Criterio respecto a la adecuada tipificación de la conducta infractora referida al incumplimiento de las disposiciones sobre el otorgamiento de facilidades para el ejercicio de la actividad sindical (fund. 6.20).", "fundamentos": "6.20", "palabras": ["facilidades sindicales", "actividad sindical", "dirigentes", "permisos", "tipificación", "libertad sindical"], "temas": [["Libertad sindical y negociación colectiva", "Facilidades sindicales", "Tipificación de la conducta"]], "archivo": "pdf/2024-022.pdf", "archivo_nombre": "Resolucion-022-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.20", "texto": "Sin embargo, no se evidencia que la tipificación de la conducta sancionada sea la adecuada y exacta en el presente caso, toda vez que existe un tipo infractor que recoge con mayor precisión el comportamiento reprochado. En efecto, la infracción imputada subsumida dentro del numeral 25.10 del artículo 25 del RLGIT, resulta menos precisa que la utilizada con relación al comportamiento expresamente previsto para la falta de otorgamiento de las facilidades para la realización de actividades como representantes del Sindicato (numeral 24.11 del artículo 24 del RLGIT). En ese sentido, por aplicación del principio de tipicidad, pauta rectora del procedimiento administrativo sancionador, la conducta infractora que está expresamente descrita en el numeral 24.11 del artículo 24 del RLGIT, que establece claramente que la conducta sancionable se fundamenta en: “El incumplimiento de las disposiciones relacionadas con el otorgamiento de facilidades para el ejercicio de la actividad sindical”, será la aplicable para subsumir aquellos comportamientos que implican el no otorgamiento de una licencia sindical, en la medida que, el artículo 32 del Texto Único Ordenado de la Ley de Relaciones Colectivas de Trabajo11, considera que aquella califica como una facilidad sindical."}]}, {"id": "2024-023", "anio": 2024, "numero": "023-2024", "tipo": "Precedente", "titulo": "Ampliación de plazos en los requerimientos de información", "criterio": "Criterio referido a la ampliación de plazos en los requerimientos de información (fund. 6.19 a 6.28).", "fundamentos": "6.19, 6.20, 6.21, 6.22, 6.23, 6.24, 6.25, 6.26, 6.27 y 6.28", "palabras": ["ampliación de plazo", "plazo", "requerimiento de información", "prórroga"], "temas": [["Función inspectiva y medidas inspectivas", "Requerimientos de información", "Ampliación de plazos"]], "archivo": "pdf/2024-023.pdf", "archivo_nombre": "Resolucion-023-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.19", "texto": "Esto quiere decir que, los plazos para la investigación inspectiva se estructuran dentro de una programación, toda vez que los Inspectores de trabajo cumplen con diversas actividades que están referidas a varias órdenes de inspección en simultáneo, todas con plazos bien determinados y cuyo efecto es relevante para el interés público. Así, la ordenación de plazos para la entrega de información de un empleador en concreto no recae en la arbitrariedad de un servidor público, sino en una previa planificación que faculta a los inspectores a cumplir con la investigación por lo que, el cumplimiento de las prestaciones de colaboración, de no ser oportuno, puede frustrar la finalidad de las órdenes de inspección correspondientes, las mismas que recaen sobre contenido documentario cuyo llevado es de exigibilidad ordinaria a los empleadores."}, {"fundamento": "6.20", "texto": "Sin embargo, no escapa a la realidad que, muchas veces estos plazos otorgados resultan difíciles 9 de cumplir para los administrados, sea por la complejidad, la cantidad o la antigüedad de la información requerida. Ante esta perspectiva, si bien resulta razonable que los inspectores de trabajo establezcan la oportunidad concreta de la entrega de información dentro de los límites de la razonabilidad, considerando su propia programación y los plazos perentorios de las órdenes de inspección que les han sido asignadas, también resulta tutelable el interés del sujeto inspeccionado de que tales requerimientos de entrega de información correspondan en sentido material con el principio de buena fe procedimental. Este Tribunal recuerda que a través de este principio se espera que tanto la autoridad administrativa, los administrados, sus representantes o abogados realicen los respectivos actos procedimentales guiados por el respeto mutuo, la colaboración y la buena fe13."}, {"fundamento": "6.21", "texto": "En tal sentido, para que un pedido de ampliación de plazo formulado oportunamente por el sujeto inspeccionado sea valorado adecuadamente por el inspector actuante, la justificación que motiva este pedido no debe consistir en una mera alegación de parte. Por el contrario, en estricto cumplimiento del principio de buena fe procedimental, el administrado debería presentar los elementos justificativos con relación a la demora que hace necesario el plazo adicional. Es decir, con arreglo al citado principio, los servidores del Sistema de Inspección del Trabajo deben considerar que resultará exigible al sujeto inspeccionado que solicite un plazo adicional para cumplir un requerimiento informativo que proceda con cuidados significativos, conforme a la casuística general: (i) Que explique sustentadamente y acredite los hechos que impedirían cumplir con la entrega de toda o parte de la información requerida por el inspector de trabajo dentro del plazo establecido. (ii) Que otorgue medios verificables para determinar si, efectivamente, el objeto del requerimiento informativo reviste de complejidad especial. (iii) Que se pueda demostrar que la cantidad de la información, su antigüedad, u otro criterio análogo motiva a flexibilizar el plazo originalmente interpuesto. (iv) Además de los siguientes criterios ejemplificadores, que pueden acontecer singular o combinadamente, los servidores del Sistema de Inspección del Trabajo deberán además considerar si el administrado ha establecido en su petición cuánto es el tiempo que le tardará integrar la información y/o documentación faltante."}, {"fundamento": "6.22", "texto": "Por otro lado, los servidores del Sistema de Inspección del Trabajo que examinen semejantes peticiones deberán valorar si esta petición se formula -bajo un criterio de razonabilidad temporal- con inmediatez tras la notificación del requerimiento informativo. En particular, este Tribunal de Fiscalización Laboral recuerda que los inspectores de trabajo tienen autonomía funcional, por lo que ellos podrán calificar la seriedad y consistencia de un pedido de este tipo o si, en cambio, opera una práctica contraria al deber de buena fe procedimental."}, {"fundamento": "6.23", "texto": "Igualmente, los servidores del Sistema de Inspección del Trabajo deberán establecer si, en el expediente de fiscalización, el sujeto inspeccionado puso a disposición la información requerida a la fecha del requerimiento. Con arreglo al deber de prevención, el administrado debería poder presentar esta información ante el personal inspectivo lo más pronto posible, ello con la finalidad de coadyuvar con la labor de investigación. En esta medida, si la petición de un mayor plazo no ofrece información alguna o si la alcanzada no es relevante para la materia investigada, el inspector de trabajo podrá promover el procedimiento sancionador levantando el acta de infracción correspondiente, basándose en que es el empleador quién está obligado a conservar y sistematizar la documentación diversa sobre las relaciones laborales con sus trabajadores."}, {"fundamento": "6.24", "texto": "En consecuencia, recaerá en la discrecionalidad del inspector actuante el evaluar estos pedidos de ampliación de plazos, y conceder aquellos que cumplan estos estándares, respetando el principio de razonabilidad y la programación de las otras ordenes de inspección que tenga en simultaneo, descartando de plano aquellos pedidos sin contenido alguno o aquellos donde sea evidente que tienen como único objetivo dilatar las labores inspectivas (como sucede, por ejemplo, cuando se requiere (Constitucionales, Judiciales y Administrativos) una y otra ampliación, pero finalmente no se presenta la información y/o documentación requerida)."}, {"fundamento": "6.25", "texto": "Como se mencionó previamente, en el expediente analizado se observa que la impugnante presentó hasta tres (3) pedidos de ampliación de plazos para cumplir con la información requerida por los Inspectores comisionados. Así, se tiene que, respecto al primer pedido de ampliación de plazos presentado ante el requerimiento de información del 12 de marzo de 2021, se aprecia que sí tiene cierto sustento, ya que la información requerida presentaba complejidad sobre todo por la cantidad de trabajadores (4560) de los cuales se solicitaba la entrega de boletas de pago respecto de un periodo que comprendía a los meses de enero 2019 a marzo 2020. Este hecho fue debidamente sustentado por la impugnante y por lo cual, los Inspectores comisionados no propusieron sanción ante su incumplimiento e incluso solicitaron ampliar el plazo de las actuaciones inspectivas."}, {"fundamento": "6.26", "texto": "Ahora, respecto a los requerimientos de información posteriores, formulados el 26 y 30 de abril de 2021, se tiene que la información solicitada se redujo significativamente, en comparación con el primer pedido, ya que este solo consistía en entregar: i) Una relación de trabajadores afiliados a la Federación Centro Unión de Trabajadores del Seguro Social de Salud que laboran dentro de la Provincia de Lima con el detalle de la ocupación, categoría, remuneración, fecha de ingreso al 28 de febrero de 2021, y ii) Un informe detallando si los bonos denominados “no remunerativos” (bono de productividad, bonificación por prestaciones económicas y alta responsabilidad, bono extraordinario y bono especialidad /especialización) se vienen pagando de manera continua, con regularidad mensual, si son de libre disposición y si han tenido incidencia alguna en el cálculo y pago de los beneficios sociales de los trabajadores afiliados a la Federación Centro Unión de Trabajadores del Seguro Social de Salud que laboran dentro de la Provincia de Lima, del 01.01.2019 al 28.02.2021."}, {"fundamento": "6.27", "texto": "No obstante, la impugnante no entregó la información solicitada y optó por pedir una nueva ampliación de plazos utilizando la misma justificación del primer pedido, es decir, nuevamente argumentó que, por la cantidad de trabajadores afiliados a la FED CUT la información era compleja de conseguir. Además, el sujeto inspeccionado precisó que se estaba priorizando otras funciones por la ocurrencia de la pandemia, aun cuando la información solicitada no revestía de complejidad aparente. Incluso, este Tribunal administrativo subraya que, para facilitar la obtención de dicha información, los Inspectores habían remitido al sujeto inspeccionado, junto con los requerimientos de información, una lista de los trabajadores afiliados a la FED CUT. A pesar de este facilitamiento -que no es exigible a la inspección del trabajo- la impugnante no presentó ni siquiera una parte de la información requerida."}, {"fundamento": "6.28", "texto": "Por tanto, esta actitud fue interpretada por los Inspectores comisionados como una reiterada negativa del sujeto inspeccionado para proporcionar la información requerida que a ellos les resultaba indispensable para continuar las actuaciones inspectivas, lo cual devino en que propusieran sanción por el incumplimiento de estos dos requerimientos de información. Este Tribunal coincide con dicha conclusión, dado que los Inspectores comisionados no estaban en la obligación de otorgarle más plazos a la impugnante, sobre todo, porque hasta ese momento dicha administrada no había demostrado ninguna intención de colaborar con las labores inspectivas. por los servidores de la Inspección del Trabajo que se formalicen en las Actas de Infracción observando los requisitos establecidos, merecen fe, sin perjuicio de las pruebas que puedan aportar los sujetos responsables."}]}, {"id": "2024-024", "anio": 2024, "numero": "024-2024", "tipo": "Precedente", "titulo": "Tiempo de refrigerio", "criterio": "Criterio referido al tiempo de refrigerio (fund. 6.2 a 6.6, 6.17, 6.18 y 6.20 a 6.22).", "fundamentos": "6.2, 6.3, 6.4, 6.5, 6.6, 6.17, 6.18, 6.20, 6.21 y 6.22", "palabras": ["refrigerio", "descanso", "jornada", "tiempo de refrigerio"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Refrigerio"]], "archivo": "pdf/2024-024.pdf", "archivo_nombre": "Resolucion-024-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.2", "texto": "Según se desprende de dicha norma, siempre que exista una jornada diaria corrida, los trabajadores disfrutarán de un periodo de “refrigerio” de al menos cuarenta y cinco (45) minutos. La finalidad de esta institución no es otra que la de salvaguardar la salud física y psicológica del trabajador a través de la interrupción en sus labores diarias, permitiéndole desconectar de la rutina laboral y satisfacer sus necesidades fisiológicas.9 Es por lo que, en la doctrina se le conoce como “descanso intra jornada”10, dado que su función no se limita solo a la alimentación, sino a la satisfacción de otras necesidades personales del trabajador."}, {"fundamento": "6.3", "texto": "Precisamente, el artículo 14° del Reglamento del TUO de la Ley de Jornada de Trabajo, Horario y Trabajo en Sobretiempo, aprobado por Decreto Supremo N° 0082002-TR, precisa que el horario de refrigerio no solo está destinado a la ingesta de alimentos sino también al descanso: “el horario de refrigerio” es el tiempo establecido por la Ley que tiene como finalidad que el trabajador lo destine a la ingesta de su alimentación principal cuando coincida con la oportunidad del desayuno, almuerzo o cena, o de un refrigerio propiamente dicho, y/o al descanso”."}, {"fundamento": "6.4", "texto": "Respecto a la oportunidad de disfrute del refrigerio, el artículo 15° del mismo Reglamento del TUO de la Ley de Jornada de Trabajo, Horario y Trabajo en Sobretiempo, aprobado por Decreto Supremo N° 008-2002-TR, dispone que este debe efectuarse durante la jornada de trabajo: “el caso de las jornadas que se cumplan en horario corrido según el artículo 7° de la Ley, el tiempo de refrigerio no podrá ser inferior a cuarenta y cinco (45) minutos y deberá coincidir en lo posible con los horarios habituales del desayuno, almuerzo o cena. El empleador establecerá el tiempo de refrigerio dentro del horario de trabajo, no pudiendo otorgarlo ni antes ni luego del mismo”. (resaltado agregado)."}, {"fundamento": "6.5", "texto": "Como puede apreciarse, resulta claro que la normativa laboral ha consagrado al horario de refrigerio bajo un estándar imperativo relativo cuando menos en dos sentidos: con relación al lapso protegido (no menos de 45 minutos) y a su oportunidad (en algún tramo de la jornada que no sea ni el inicio ni el término del lapso en el que el personal se encuentra a disposición del empleador). De esta forma, cuando se aplica un horario de trabajo ininterrumpido o continuo, la autonomía de las partes puede, conforme con la norma estatal, mejorar la cantidad de minutos y/o desplazar el momento específico del goce del tiempo de refrigerio “dentro del horario de trabajo”, sin que esto ocurra ni antes ni después del lapso en el que la parte trabajadora se encuentra a disposición de la empleadora."}, {"fundamento": "6.6", "texto": "La finalidad esencial de la norma comentada radica en mitigar el desgaste físico y psicológico que el trabajo genera en el trabajador, por lo cual resulta compatible con los derechos a la salud y seguridad, por un lado, y con el interés tutelable del empleador de asegurar una adecuada aptitud de su personal para la productividad, por otro. Por ello, la protección jurídica de la pausa legalmente fijada dentro de la rutina laboral resulta fundamental, así sea para el mero hecho de recuperar energías, la ingesta de alimentos o cualquier otra manifestación de la personalidad que resulte atendible dentro del lapso protegido, el tiempo de descanso intra jornada que supone el horario de refrigerio debe ser considerado como un componente imperativo de especial atención por la inspección del trabajo en su actividad de control. En este contexto, resultaría contradictorio con esta institución del Derecho 17 Laboral que el descanso se establezca de forma previa al inicio de la jornada diaria o al finalizarla, ya que cualquiera de estas opciones supondría contravenir la naturaleza jurídica de este derecho y, en los hechos, evidenciaría una contravención a su contenido imperativo, que la protege frente a actos unilaterales del empresario (por actuación de los límites del poder de dirección) y frente a supuestos de renuncia de la parte trabajadora, por operación del principio de irrenunciabilidad de derechos. Sobre el principio de irrenunciabilidad de derechos laborales"}, {"fundamento": "6.17", "texto": "En su recurso de revisión, la impugnante sostiene que dicha cláusula celebrada con los trabajadores afectados -inserta en los convenios suscritos- es válida, porque aplica la salvedad prevista en el artículo 7 del TUO de la Ley de Jornada de Trabajo, Horario y Trabajo en Sobretiempo, que indica que el tiempo de refrigerio lo determina el empleador salvo “pacto en contrario”. Afirma el administrado en su tesis recursiva que la interpretación de la norma protege este efecto: “En el caso de trabajo en horario corrido, el trabajador tiene derecho a tomar sus alimentos de acuerdo a lo que establezca el empleador en cada centro de trabajo, salvo convenio en contrario. El tiempo dedicado al refrigerio no podrá ser inferior a cuarenta y cinco (45) minutos. El tiempo de refrigerio no forma parte de la jornada ni horario de trabajo, salvo que por convenio colectivo se disponga algo distinto”."}, {"fundamento": "6.18", "texto": "Teniendo en cuenta todo lo desarrollado hasta este punto (particularmente en los puntos 6.2 a 6.6 de esta resolución), no resulta acogible la posición de la impugnante. El término “salvo pacto en contrario” mencionado en el artículo 7 del TUO de la Ley de Jornada (Constitucionales, Judiciales y Administrativos) de Trabajo, Horario y Trabajo en Sobretiempo, no implica la posibilidad de que se celebren acuerdos cuyo contenido materialmente disponga la renuncia del trabajador al contenido imperativo del tiempo de refrigerio. El Tribunal de Fiscalización Laboral recuerda que, en tal situación, la inspección debe aplicar el principio de irrenunciabilidad de derechos establecido en el inciso 2 del artículo 26° de la Constitución Política del Perú. Este derecho es de carácter irrenunciable porque está previsto en una norma imperativa. En consecuencia, la interpretación correcta de la salvedad prevista en la norma permite únicamente negociar la oportunidad del goce de este derecho, pero siempre dentro de la jornada de trabajo. Es decir, ningún trabajador puede renunciar a su tiempo de refrigerio, sino que puede negociar el periodo concreto en el cual lo gozará dentro de la jornada."}, {"fundamento": "6.20", "texto": "En tal sentido, los términos del convenio individual suscrito entre la impugnante y cada uno de los trabajadores afectados -donde se pactó la eliminación del derecho de refrigerio durante la jornada de trabajo- son inválidos e ineficaces, dado que la impugnante ha interpretado de manera incorrecta el sentido de la norma, y con ello se ha generado una restricción intolerable contra el contenido imperativo del derecho al tiempo de refrigerio (pausa intra jornada) de tales trabajadores."}, {"fundamento": "6.21", "texto": "Por otro lado, la impugnante confunde el sentido de la norma al interpretar que el horario de refrigerio solo debe utilizarse para la ingesta de alimentación principal de los trabajadores, aun cuando este derecho tiene un contenido mucho más amplio que solo la alimentación. Como ya se ha sostenido, el tiempo de refrigerio garantiza que los trabajadores que prestan servicios dentro de un horario continuo puedan gozar de una pausa ante el desgaste físico y psicológico propio de su actividad laboral, descanso que no puede adelantarse al inicio o posponerse al final de la jornada, sino que debe hacerse durante el curso de la misma, al intermedio, para cumplir con su finalidad reparadora."}, {"fundamento": "6.22", "texto": "De la misma forma, la impugnante arguye que estos acuerdos permitieron que a los trabajadores retirarse antes del centro de trabajo, argumentando que ello les resulta favorable debido a la lejanía del centro de trabajo. Sin embargo, esta posición confunde el sentido del horario de refrigerio, dado que este no puede ser equiparado a un adelanto del horario de salida ni prórroga del horario de ingreso (acuerdos que, de ser adoptados, no deben afectar el tiempo de refrigerio, que debió otorgarse al intermedio de la jornada diaria)."}]}, {"id": "2024-025", "anio": 2024, "numero": "025-2024", "tipo": "Precedente", "titulo": "Seguridad social en pensiones", "criterio": "Criterio referente a la seguridad social en pensiones (fund. 6.2, 6.3 y 6.7).", "fundamentos": "6.2, 6.3 y 6.7", "palabras": ["pensiones", "previsional", "seguridad social", "disyuntiva"], "temas": [["Relación de trabajo y derechos laborales", "Seguridad social", "Pensiones"]], "archivo": "pdf/2024-025.pdf", "archivo_nombre": "Resolucion-025-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.2", "texto": "Si bien una interpretación literal de la fórmula disyuntiva empleada en esta y otras regulaciones en materia previsional puede generar confusiones, es necesario que los operadores jurídicos interpreten las normas del sistema jurídico conforme a los preceptos constitucionales sobre derechos fundamentales, que tienen plena eficacia en las relaciones laborales."}, {"fundamento": "6.3", "texto": "En ese sentido, recordamos que el derecho a la seguridad social, como derecho universal y progresivo que toda persona posee para su protección frente a las contingencias previstas por la ley y para mejorar su calidad de vida, forman parte del elenco de derechos constitucionales respecto de los cuales ninguna relación laboral puede, válidamente, limitar su ejercicio, conforme lo establecen los artículos 1010, 1111 y 23 de la Constitución Política del Perú."}, {"fundamento": "6.7", "texto": "Por lo expuesto, constituye una obligación de los empleadores, que, desde el momento en que un trabajador ingresa a laborar a un centro de trabajo, sea incorporado al Sistema de Seguridad Social de Pensiones de su elección, ya sea al Sistema Nacional de Pensiones (SNP) o en el Sistema Privado de Pensiones (SPP). Dicha obligación comprende a todos los empleadores, incluyendo entre ellos a las microempresas."}]}, {"id": "2024-026", "anio": 2024, "numero": "026-2024", "tipo": "Precedente", "titulo": "Afectación a la libertad sindical por extender beneficios a trabajadores no sindicalizados", "criterio": "Criterio referido a la afectación a la libertad sindical por extender beneficios económicos a trabajadores no sindicalizados (fund. 6.17, 6.31 a 6.34, 6.36 y 6.42).", "fundamentos": "6.17, 6.31, 6.32, 6.33, 6.34, 6.36 y 6.42", "palabras": ["no sindicalizados", "beneficios", "libertad sindical", "extensión de beneficios", "sindicato"], "temas": [["Libertad sindical y negociación colectiva", "Negociación colectiva", "Beneficios a trabajadores no sindicalizados"]], "archivo": "pdf/2024-026.pdf", "archivo_nombre": "Resolucion-026-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.17", "texto": "Conforme con lo establecido en los considerandos anteriores, las cláusulas del convenio colectivo expresan acuerdos revestidos de la fuerza vinculante dentro de nuestro sistema jurídico, porque establecen el contenido específico y las condiciones con las que tales beneficios deban aplicarse dentro del ámbito de las relaciones laborales donde sea que esta fuente del Derecho Laboral tenga aplicación. En adición, las cláusulas del convenio colectivo determinan obligaciones de hacer y de no hacer específicas para el empleador: unas, referidas al pago respecto de los beneficios correspondientes en favor de los trabajadores concernidos dentro del ámbito subjetivo del acuerdo; otras, referidas a la restricción de la extensión (directa o indirecta) de este beneficio a quienes (Constitucionales, Judiciales y Administrativos) se encuentran fuera del ámbito subjetivo correspondiente."}, {"fundamento": "6.31", "texto": "La extensión de beneficios fuera del modelo legal —sea por extender el convenio pactado con una organización minoritaria, o bien, sea por extender el acuerdo específico que objetiva y razonablemente delimita un beneficio como el analizado en este caso sobre personal expresamente excluido en la cláusula del convenio colectivo— es un comportamiento cuyo despliegue afecta a la libertad sindical, más allá de su resultado concreto (disminución o no de afiliados), al incidir sobre las condiciones arribadas bilateralmente contra el sentido expreso del acuerdo pactado con la organización sindical. El Tribunal de Fiscalización Laboral recuerda que el mandato de las cláusulas del convenio colectivo tiene una especial fuerza vinculante para el empleador, sujeto obligado por esta regulación privada. Por ende, la afectación de la libertad sindical se produce en este caso al comportarse el empleador de forma abiertamente contraria a la autonomía normativa, componente indispensable del principio de autonomía colectiva, que nutre al derecho complejo de libertad sindical."}, {"fundamento": "6.32", "texto": "Es pertinente tener en cuenta que la infracción contenida en el numeral 25.10 del artículo 25 se refiere a la realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores, de forma genérica y aborda una serie de ejemplificaciones. En consecuencia, dentro del tipo previsto en el citado numeral pueden subsumirse los comportamientos no ejemplificados que calzan en el contenido genérico que afectan a la libertad sindical (y que no se encuentran descritos en otras normas sancionadoras específicas del Reglamento de la Ley General de Inspección del Trabajo). Así, la afectación a la libertad sindical definida en la parte general del numeral 25.10 termina siendo suficientemente precisa para invocar a la aplicación de la garantía de la 7 libertad sindical en sede del procedimiento administrativo sancionador a cargo de la SUNAFIL."}, {"fundamento": "6.33", "texto": "Para ello, este Tribunal de Fiscalización Laboral recuerda que deberá utilizarse la premisa general del artículo (vale decir, “La realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores”) o bien, la invocación de cualquiera de los ejemplos establecidos pedagógicamente en la norma sancionadora citada. Los ejemplos ofrecidos por la norma reglamentaria son los que siguen: - Actos que impiden la libre afiliación a una organización sindical. - Actos que promuevan la desafiliación de la misma. - Actos que impidan la constitución de sindicatos. - Actos que obstaculicen a la representación sindical, - Actos que utilicen contratos de trabajo sujetos a modalidad para afectar la libertad sindical, la negociación colectiva y el ejercicio del derecho de huelga, o supuestos de intermediación laboral fraudulenta, - Cualquier otro acto de interferencia en la organización de sindicatos."}, {"fundamento": "6.34", "texto": "Asimismo, el Tribunal de Fiscalización Laboral debe hacer notar que en ciertas ocasiones esta práctica antijurídica de extender un beneficio contra lo ordenado por el modelo legal de relaciones colectivas (cuando se extiende un beneficio contenido en un convenio colectivo de eficacia limitada, por celebrarse con un sindicato minoritario) o la de extender un beneficio contra lo prescrito en la cláusula específica del convenio colectivo (como ocurre en este caso, tratándose del beneficio conocido como “cierre de pliego”), guardan determinado patrón que puede ser determinado por la Inspección del Trabajo. Ello a partir del análisis de una relativa correspondencia temporal entre el otorgamiento del beneficio nacido en el convenio colectivo y el de la práctica unilateral del empleador; semejanza o hasta equiparación de los montos percibidos, entre otras manifestaciones son frecuentemente determinadas en los expedientes en donde se sancionan este tipo de prácticas, cuya contravención respeto de nuestro sistema jurídico resulta evidente."}, {"fundamento": "6.36", "texto": "En efecto, dependiendo de la representatividad alcanzada por el sindicato en su ámbito de actuación, el empleador estará obligado a no extender las disposiciones del convenio colectivo a determinados colectivos. Esto se debe a lo establecido por la ley en relación con los sindicatos minoritarios o, como en este caso, a la restricción razonable del ámbito subjetivo, estipulada específicamente en una cláusula contenida en un acuerdo con un sindicato mayoritario."}, {"fundamento": "6.42", "texto": "Por esta razón, el Tribunal de Fiscalización Laboral, en su función unificadora y en pos de la predictibilidad, seguridad jurídica e igualdad de trato hacia los sujetos inspeccionados y administrados, así como en su labor defensiva del ordenamiento jurídico laboral —cuya vigilancia por el respeto le ha sido asignada legalmente respecto de los procedimientos sancionadores derivados de inspecciones del trabajo— invoca estas razones jurídicas. De esta forma, esta instancia de revisión afirma al deber de los servidores que participan en la fiscalización laboral y en el procedimiento sancionador posterior de aplicar en los casos donde intervienen no sólo la literalidad de los tratados internacionales de derechos humanos, sino también el tener una amplia consideración por la jurisprudencia emitida por los órganos de control correspondientes."}]}, {"id": "2025-001", "anio": 2025, "numero": "001-2025", "tipo": "Precedente", "titulo": "Supuestos de tipificación del numeral 25.9 (derecho de huelga)", "criterio": "Criterio referido a los supuestos de tipificación del numeral 25.9 del artículo 25 del RLGIT, vinculados a actos que afectarían el derecho de huelga (fund. 6.15 a 6.17).", "fundamentos": "6.15, 6.16 y 6.17", "palabras": ["huelga", "25.9", "derecho de huelga", "tipificación"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Derecho de huelga (25.9)"]], "archivo": "pdf/2025-001.pdf", "archivo_nombre": "Resolucion-001-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.15", "texto": "A criterio de este Tribunal, corresponde aclarar que si bien la afectación del derecho a la huelga podría ser considerado como un supuesto de lesión de la libertad sindical (en la medida en que este derecho es la base jurídica y generatriz de todos los derechos colectivos laborales y su referencia en el tipo del numeral 25.10 del artículo 25 del RLGIT comprende supuestos en los que el concepto de “libertad sindical” alude a su dimensión compleja), el mismo cuerpo normativo ha regulado, de manera expresa, un tipo sancionador aplicable para cuando se adviertan lesiones al derecho de huelga. En efecto, ciertas afectaciones que se podrían producir en contra del ejercicio de este derecho deben subsumirse a través del numeral 25.9 del artículo 25 de dicho cuerpo normativo, conforme se advierte claramente de lo dispuesto por el reglamentador en la premisa inicial de este tipo: “Artículo 25.- Infracciones muy graves en materia de relaciones laborales Son infracciones muy graves los siguientes incumplimientos: (…) 25.9 La realización de actos que impidan el libre ejercicio del derecho de huelga, como la sustitución de trabajadores en huelga, bajo contratación directa a través de contratos indeterminados o sujetos a modalidad, o bajo contratación indirecta, a través de intermediación laboral o contratación y subcontratación de obras o servicios, y el retiro 5 de bienes de la empresa sin autorización de la Autoridad Administrativa de Trabajo” (énfasis añadido)."}, {"fundamento": "6.16", "texto": "En este caso, se aprecia que la misma tipificación de diversos incumplimientos sociolaborales como infracciones sancionables por la inspección del trabajo, consta o comprende un tenor “ejemplificativo” a fin de que el intérprete de la misma (inspector, autoridad sancionadora y, eventualmente, el Poder Judicial, en el marco de un proceso contencioso12), a partir de los supuestos y parámetros expresamente recogidos, pueda concluir que otros supuestos análogos califican como infracciones. Este tipo de técnica de tipificación13 ha sido acogida por el RLGIT en algunos casos, como por ejemplo en aquellas infracciones previstas en el numeral 25.9."}, {"fundamento": "6.17", "texto": "De esta forma, cualquier tipo de afectación del derecho a la huelga es subsumible como una infracción muy grave bajo el numeral 25.9 del artículo 25 del RLGIT, siendo este tipo propio y específico frente a todos aquellos incumplimientos que se pudieran producir en contra de este derecho. Por ende, a criterio de este Tribunal, en este caso las conductas descritas como prácticas antisindicales, debido a la imposición de sanciones disciplinarias a los huelguistas y por colocar comunicados y/o carteles advirtiendo la imposición de estas medidas por continuar con la huelga, estarían subsumidas en el tipo infractor contenido en el numeral 25.9 del artículo 25 del RLGIT."}]}, {"id": "2025-002", "anio": 2025, "numero": "002-2025", "tipo": "Precedente", "titulo": "Numeral 48.1.C en accidente mortal con subcontratación", "criterio": "Criterio sobre la aplicación del numeral 48.1.C del artículo 48.1 del RLGIT en casos de accidente mortal en una relación de subcontratación laboral (fund. 6.14, 6.15, 6.25 y 6.26).", "fundamentos": "6.14, 6.15, 6.25 y 6.26", "palabras": ["accidente mortal", "subcontratación", "48.1", "48.1.C", "accidente de trabajo", "tercerización"], "temas": [["Seguridad y salud en el trabajo", "Accidentes de trabajo", "Accidente mortal y subcontratación (48.1.C)"]], "archivo": "pdf/2025-002.pdf", "archivo_nombre": "Resolucion-002-2025-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.14", "texto": "Como se ha pasado apreciar de los considerandos previos, son fundamentos de nuestro sistema jurídico la protección de la vida, la dignidad y el trabajo, motivo por el que la protección de la integridad y seguridad de las personas merece la mayor atención del Sistema de Inspección del Trabajo. Por ello, cuando ocurre un accidente de trabajo con consecuencia mortal, la respuesta administrativa laboral debe considerar la materialización de estos ejes rectores. Cabe añadir que la vida y dignidad en el trabajo, al constituirse en derechos fundamentales prioritarios, no pueden ser encuadrados a las meras previsiones contractuales que pretendan fragmentar la responsabilidad del ente empleador con relación a la seguridad y salud en el trabajo."}, {"fundamento": "6.15", "texto": "De ahí que tales comportamientos, no deseados para el orden constitucional en el ámbito laboral, conlleven niveles de imposición de sanciones administrativas severamente agravadas, ya que para el cálculo de una multa por esta infracción se contempla al total de los trabajadores del sujeto inspeccionado, conforme se aprecia de la redacción del artículo 48, numeral 48.1-C14 del RLGIT. Para este Tribunal, resulta conforme con el parámetro de razonabilidad concedido al reglamentador, que las normas del Reglamento impongan para estos casos una de las mayores fórmulas de punición administrativa laboral: la contenida en el numeral 28.11 del artículo 28 del RLGIT y el numeral 48.1.C del artículo 48 citado, dado el grado de afectación de un bien jurídico protegido."}, {"fundamento": "6.25", "texto": "El motivo de la elevación de la multa se funda en el interés protector del Estado, que por medio del contenido de sus normas punitivas administrativas busca hacer eficaz los derechos fundamentales en el trabajo. Con ese objetivo, la normativa del Sistema de Inspección del Trabajo ha dispuesto una gama de sanciones agravadas referidas a afectaciones como derechos colectivos (numeral 48.1B artículo 48 del RLGIT), el trabajo forzoso y las peores formas de trabajo infantil (numeral 48.1-D del artículo 48 del RLGIT). Así como el caso del fallecimiento de un trabajador en su centro de labores (48.1-C del artículo 48 del RLGIT) cuando se determina el nexo causal entre dicho resultado y la inobservancia de la normativa de seguridad y salud en el trabajo por parte del empleador."}, {"fundamento": "6.26", "texto": "En tal sentido, esta instancia de revisión en su función emisora de criterios vinculantes para el Sistema de Inspección del Trabajo entiende que la punición prevista por el legislador en el numeral 48.1-C del artículo 48 del RLGIT, fue redactada a efectos de elevar la punición en diversos supuestos, considerando como método de incremento a la consideración ficcional del total de trabajadores de la planilla como “trabajadores afectados”, a fin de calcular la sanción. Sin embargo, esta fórmula guarda una correcta razonabilidad y proporcionalidad en el ámbito de la relación laboral directa. En cambio, cuando el incumplimiento se produce en el contexto de la subcontratación y se pretenda extender esta fórmula de incremento de punición a través del recurso al total de trabajadores en la planilla, el recargo en la multa a ser impuesta contra la administrada por un defecto en la coordinación preventiva con la empresa contratista no resulta justificado ni en la razonabilidad ni en la proporcionalidad, rectores del procedimiento administrativo sancionador. Por ello, el vínculo entre el empleador principal en una estructura de subcontratación y un trabajador de una empresa contratista debe ser sopesado cuidadosamente por la inspección del trabajo, para determinar la situación fáctica en la que se producen los hechos. Así, en tal situación, se exigirá una motivación del cual permita identificar el contexto y el modo en que se desarrolló la relación entre la empresa principal y la contratista,
