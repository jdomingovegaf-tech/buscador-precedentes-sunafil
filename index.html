te, en el caso de este último dispositivo, el 48.1-C del RLGIT, se contempla también el incremento de punición correspondiente a los casos de discriminación, por lo que, debe entenderse también comprendidas dentro de este incremento de punición a las formas más lesivas de discriminación, siendo ellas las que afectan a la dignidad del trabajador. De esta manera, el artículo 23 de la Constitución Política de 1993, configura la norma basal e irreductible en todas las relaciones de trabajo."}, {"fundamento": "6.34", "texto": "En tal sentido, esta Sala entiende que la infracción prevista por el legislador en el numeral 25.17 del artículo 25 del RLGIT, fue redactada buscando evitar la configuración de conductas discriminatorias relacionadas a la comprobación de comportamientos antijurídicos sustentados en razones históricamente vedadas, esto es, aquel comportamiento que se sustente o funde en razones basadas en “el origen, raza, color, sexo, edad, idioma, religión, opinión, ascendencia nacional, origen social, condición económica, ejercicio de la libertad sindical, discapacidad, portar el virus HIV”, conductas que de forma expresa han sido recogidas y enunciadas en nuestra norma fundamental (inciso 2 del artículo 2 de la Constitución Política y en el Convenio Nº 111 de la OIT). De ahí que tales comportamientos, repudiables para el orden constitucional en el ámbito laboral, conlleven niveles de imposición de sanciones administrativas severamente agravadas, ya que para el cálculo de una multa por esta infracción se contempla al total de los trabajadores del sujeto inspeccionado, conforme se aprecia de la redacción del artículo 48.1-C30 del RLGIT."}, {"fundamento": "6.35", "texto": "Por tanto, este escalamiento de mayor punición administrativa a este tipo de comportamientos, debidamente comprobados por la administración, solo está autorizado cuando se determina un comportamiento discriminatorio que alude a una discriminación estricta de este concepto, vale decir que incide en un motivo prohibido, de acuerdo a lo establecido en los considerandos 6.8, 6.21, 6.25, 6.26 y 6.34 de la presente resolución. De esta manera, se sienta como criterio vinculante que los casos de discriminación salarial que se basen comprobadamente en motivos prohibidos bajo actos u omisiones de discriminación directa o indirecta, deben ser tratados con la regla punitiva referida para el cálculo de una sanción mayor. Por su parte, los atentados contra el principio de igualdad, que sean determinados sin que se compruebe la discriminación directa o indirecta por motivos prohibidos, como, por ejemplo, el injustificado trato desigual salarial entre dos homólogos, debe sancionarse invocando solamente el artículo 25.17, calculándose la sanción con remisión a la tabla de multas contemplada en el inciso 48.1 del artículo 48º del RLGIT. Sobre el caso en concreto"}, {"fundamento": "6.45", "texto": "En el marco de los procedimientos administrativos que se rigen por la LGIT y el RLGIT, así como durante el ejercicio de la actividad administrativa de fiscalización por parte de los servidores de los órganos conformantes del sistema de inspección del trabajo, se aplican necesariamente todas las garantías y derechos que el TUO de la LPAG prevé para los administrados, como el principio de legalidad33 contenido en el artículo IV de dicho cuerpo normativo. Lo antedicho es de especial relevancia para la determinación y ejercicio de la potestad sancionadora y la imposición de sanciones."}, {"fundamento": "6.49", "texto": "Atendiendo a los cuerpos normativos citados precedentemente, el ámbito de actuación de la inspección laboral incumbe no solo a las empresas del sector privado, sino también al personal sujeto al régimen laboral de la actividad privada dentro de entidades públicas y empresas estatales. No obstante, cuando el sujeto inspeccionado forma parte del Sector Público o es una empresa perteneciente al ámbito de la actividad empresarial del Estado aun cuando sus trabajadores se encuentren sujetos en el régimen de la actividad privada, no resulta exigible la observancia de lo dispuesto en la Ley Nº 30709 y lo contenido en su reglamento aprobado por Decreto Supremo Nº 002-2018-TR, puesto que, no ha sido incluida, por decisión reglamentaria en la competencia de la inspección del trabajo. Esto, en estricta observancia de lo prescrito en el Reglamento de la Ley Nº 30709 que refiere que su ámbito de aplicación se restringe al sector privado. De esta manera, la inspección del trabajo, respecto de este tipo de entidades empleadoras, tiene competencias generales para fiscalizar y sancionar la discriminación conforme al artículo 25.17 del artículo 25 del RLGIT, mas no así los comportamientos reprochados bajo los numerales 25.22 y 25.23 del artículo 25 del RLGIT."}]}, {"id": "2023-015", "anio": 2023, "numero": "015-2023", "tipo": "Precedente", "titulo": "Causa objetiva en los contratos de trabajo a plazo determinado", "criterio": "Criterio referido a la determinación de la causa objetiva en los contratos a plazo determinado (fund. 6.28 a 6.30, 6.34 y 6.35).", "fundamentos": "6.28, 6.29, 6.30, 6.34 y 6.35", "palabras": ["plazo determinado", "causa objetiva", "contrato temporal", "desnaturalización", "modalidad contractual"], "temas": [["Relación de trabajo y derechos laborales", "Contratos de trabajo", "Causa objetiva en plazo determinado"]], "archivo": "pdf/2023-015.pdf", "archivo_nombre": "Resolucion-015-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.28", "texto": "Por lo tanto, los hechos que justifican la contratación temporal deben ser consignados y explicados suficiente y adecuadamente en el contrato de trabajo primigenio. Lo contrario implica la configuración de un supuesto de desnaturalización del contrato de trabajo a plazo determinado. Bajo esa lógica, las prórrogas y/o renovaciones de los contratos de trabajo, mediante la suscripción de adendas, solo pueden remitirse o replicar la misma causa objetiva que justifique la contratación modal, descrita en los contratos de trabajo primigenios, sin pretender precisar o aclarar que el contrato es, en realidad, temporal. Por ello, la celebración de una adenda, prórroga, renovación o similar documento contractual no puede ser entendida como un mecanismo de subsanación ante la ausencia de la declaración de la causa objetiva o de falta de explicación adecuada o suficiente que haya debido establecerse en el primer contrato sujeto a modalidad."}, {"fundamento": "6.29", "texto": "Debe tenerse en cuenta que, considerando el tenor de las normas antes citadas, en el régimen laboral peruano resulta factible la celebración amplia de contratos modales de diferente naturaleza, siendo necesario que en cada supuesto se encuentre plenamente determinada la causa objetiva, que justifique su celebración. Sin embargo, si el inicio de la relación laboral se realizó al amparo de un contrato modal en el que no se haya especificado —o no se ha explicado suficiente ni adecuadamente la causa objetiva que justifique dicha contratación— aquella tendrá naturaleza indeterminada, por lo que, los contratos modales celebrados con posterioridad y de manera continua (renovaciones, prórrogas, adendas o similares), que sí especifiquen una causa objetiva, no podrán cambiar la naturaleza indeterminada de la relación laboral ya existente."}, {"fundamento": "6.30", "texto": "En la misma línea de lo señalado, la consignación de la causa objetiva de contratación temporal y su explicación adecuada y suficiente en el contrato que se celebra por escrito en estos casos, no pueden ser considerados como meras formalidades de los contratos sujetos a modalidad, pues su inobservancia acarrearía la invalidez de la cláusula referente a la temporalidad de la contratación, lo cual implica ser considerados como contratos a plazo indeterminado. Así, la remisión a la causa objetiva, por la excepcionalidad de esta contratación, no significa que baste con una indicación genérica de la causa, sino que deberá detallarse y explicarse adecuada (Constitucionales, Judiciales y Administrativos) y suficientemente, por qué la causa señalada motiva una contratación sujeta a modalidad determinada."}, {"fundamento": "6.34", "texto": "Respecto al extremo referente a la valoración de los medios probatorios (en específico: la licencia de funcionamiento y el contrato de arrendamiento) así como la alegada aplicación del principio de primacía de la realidad, se ha observado que, a la fecha de inicio del vínculo laboral de los mismos, no se encontraba determinada la causa objetiva de contratación bajo modalidad. De esta manera, siendo ello un requisito de validez para la celebración de dichos contratos que se vincula a la causa del contrato y a la determinación del conocimiento mutuo de la justificación subyacente de la provisionalidad del lapso de la contratación, la presentación de documentos posteriores no puede sustituir la ausencia de la causa objetiva de los primigenios contratos sujetos a modalidad. En tal sentido, no corresponde amparar dichos extremos del recurso de revisión, no resultando aplicable el principio invocado."}, {"fundamento": "6.35", "texto": "Respecto al extremo alegado por la impugnante, referente a la vulneración de los principios de debido procedimiento, legalidad, tipicidad, causalidad, razonabilidad y proporcionalidad, por haberse exigido consignar todas las causas de forma detallada desde el contrato inicial, sin que la normativa lo exija u obligue a proceder de esta forma, esta Sala considera que, como se ha precisado previamente en los fundamentos 6.28, 6.29, 6.30 y 6.34, la indicación y explicación suficiente y adecuada de la causa objetiva de contratación modal debe estar presente en el contrato primigenio celebrado (supuesto omitido por la impugnante), por lo tanto, al no ampararse dicho extremo del recurso, no se advierte la vulneración de los referidos principios vinculados con dicho alegato, no correspondiendo amparar dichos extremos del recurso de revisión."}]}, {"id": "2023-016", "anio": 2023, "numero": "016-2023", "tipo": "Precedente", "titulo": "Tiempo de cambio de uniforme y equipos de seguridad como parte de la jornada", "criterio": "Criterio respecto a que el tiempo invertido por los trabajadores para el cambio del uniforme de trabajo y/o elementos de seguridad forma parte de su jornada laboral (fund. 6.16, 6.20, 6.21, 6.23 a 6.27).", "fundamentos": "6.16, 6.20, 6.21, 6.23, 6.24, 6.25, 6.26 y 6.27", "palabras": ["uniforme", "cambio de uniforme", "EPP", "equipos de seguridad", "jornada", "tiempo de trabajo"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Tiempo de cambio de uniforme y EPP"]], "archivo": "pdf/2023-016.pdf", "archivo_nombre": "Resolucion-016-2023-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.16", "texto": "La impugnante, en efecto, expresamente alude a ello en el numeral 4 del artículo 5 de su Reglamento Interno de Trabajo (en adelante, el RIT): el tiempo que conllevaba que los trabajadores puedan ponerse su vestimenta de trabajo no sería considerado dentro de su horario de trabajo. Se aprecia, pues, que el RIT dispone un comportamiento (“vestir el uniforme de trabajo”) como condición para el registro del ingreso y la salida del centro de trabajo, pero esta prescripción contradice al hecho de que, al emitirse la orden de usar la indumentaria laboral, se está generando, precisamente, la puesta a disposición de la fuerza de trabajo. En efecto, a criterio de esta Sala, no se trata de un acto preparatorio para la puesta a disposición, sino un acto comprendido dentro de los márgenes del poder de dirección y de la subordinación jurídica. Así, puede apreciarse que los trabajadores obligados a cumplir esta prescripción ya 23 se encontraban dentro del centro laboral y en disposición de ejecutar las prescripciones del empleador, denotándose así a la facultad directriz del poder de dirección. Asimismo, conforme con las normas privadas reseñadas, el que un trabajador registrase su ingreso o salida sin vestir el uniforme de trabajo facultaría al empleador a ejercer la potestad disciplinaria, también componente del poder de dirección. En consecuencia, el tiempo de muda de la vestimenta de la indumentaria laboral no constituye un lapso irrelevante en la configuración de la puesta a disposición de los trabajadores con relación a la empresa investigada."}, {"fundamento": "6.20", "texto": "De esta manera, en consideración de esta Sala, queda claro que el cambio de vestimenta para usar (y dejar de usar) el uniforme de trabajo, cuando este sea exigido por el empleador y/o por las normas sectoriales aplicables, debe entenderse como una prestación exigible a los trabajadores en lapsos razonables, arreglados a los usos y costumbres en cada sector económico donde ello aplique. Estas prestaciones se vinculan al cumplimiento del objeto del contrato de trabajo, satisfaciendo así la puesta a disposición a su empleador de forma actual y concreta. Bajo tales consideraciones, el tiempo utilizado por los trabajadores para ponerse y quitarse la vestimenta de trabajo en la fiscalización analizada forma parte integrante de la jornada laboral. Ello debido a que el desempeño de sus funciones requería indispensablemente la utilización de dichos uniformes, conforme con lo dispuesto por el empleador desde su poder de dirección (en este caso: a través de obligaciones contenidas en el RIT del sujeto inspeccionado)."}, {"fundamento": "6.21", "texto": "Adicionalmente, es pertinente recordar que el artículo 7 del Decreto Supremo Nº 004-2006-TR es claro al establecer que el ingreso previo como la permanencia en el centro de trabajo presuntivamente se debe considerar como una adición al tiempo de trabajo pactado, tal y como lo ha dejado sentado esta Sala, entre otros casos, por ejemplo, en la Resolución Nº 403-2022-SUNAFIL/TFL-Primera Sala. Así, en este caso se acredita una puesta a disposición en favor de la impugnante, sin visos de excepcionalidad. Así, de forma concurrente, el lapso es adicional al tiempo en que el trabajador se encuentra operando, vestido ya con el uniforme, en seguimiento de las prescripciones dadas del empleador. Por tal motivo, no se puede restar esa esencia laboral a este tiempo, ni bajo una disposición privada unilateral, como la contemplada en las normas del RIT examinado."}, {"fundamento": "6.23", "texto": "Ahora bien, en el presente caso, se observa que los trabajadores invertían tiempo en ponerse y quitarse el uniforme de trabajo, para poder recién registrar su ingreso y salida diaria, cuando correspondía que los trabajadores consignen su hora de ingreso al momento de llegar a su centro laboral, puesto que, los mismos ya se encontraban dentro de las instalaciones de la empresa y cumpliendo obligaciones impartidas por éste (y, además, bajo pena de sanción). Por tanto, resulta claro que estos lapsos corresponden a la disposición efectiva en favor de su empleador. Del mismo modo, los trabajadores debían registrar su salida apenas culminen sus actividades laborales. En ese sentido, este periodo se considera como tiempo efectivo de labores. Sin embargo, la impugnante no ha cumplido con ello, al desconocer el efecto de su propio poder normativo sobre el comportamiento de sus empleados."}, {"fundamento": "6.24", "texto": "En vista del razonamiento expuesto, esta Sala considera que el tiempo utilizado para el cambio de uniforme de trabajo y/o ponerse los elementos de seguridad, en general, requeridos para el cumplimiento de sus funciones y que realizan en el centro laboral, formarían parte de la jornada de trabajo cuando constituyan una obligación para el trabajador, en virtud de alguna o algunas de las siguientes causas: a) Que el uso de tales implementos obedezca a una obligación consignada en el Reglamento Interno de Trabajo de la empresa, política escrita o a través de una orden verbalmente impartida. b) Que el uso del uniforme de trabajo sea exigido por el empleador por razones de imagen corporativa, atención al público, requerimiento de clientes, etc. c) Que se puedan desplegar medidas disciplinarias con relación al comportamiento consistente en registrar el tiempo de trabajo ya portando el uniforme de trabajo."}, {"fundamento": "6.25", "texto": "En este caso, se evidencia que los trabajadores afectados requerían forzosamente el uso del uniforme para el desempeño de sus funciones, asimismo, que dicha obligación se encontraba contenida en el RIT de la impugnante. Por tanto, el tiempo invertido por los trabajadores para el cambio de la vestimenta de trabajo, tanto para registrar su ingreso y salida del centro laboral debía ser considerado como parte de su jornada de trabajo. Aunado a ello, la necesidad de ponerse la indumentaria de trabajo deriva de la propia naturaleza de las funciones desarrolladas por los trabajadores. Adicionalmente, esta actividad de ponerse el uniforme de trabajo —como quitárselo— es una obligación íntimamente ligada a la organización del personal en el desarrollo del proceso productivo de la empresa y a la respectiva prestación de servicios."}, {"fundamento": "6.26", "texto": "Por consiguiente, tal actividad constituye una acción preparatoria o final que permiten dar inicio o concluir el respectivo proceso productivo y la prestación de servicios del trabajador. En ese sentido, el cambio de vestuario y/o el uso de elementos de seguridad, son actividades inherentes a la función específica desempeñada por los trabajadores, formando parte integrante de ésta, hecho que permite sostener que durante el desarrollo de tales acciones existe una efectiva prestación de servicios por parte de los trabajadores afectados. Por ello, se puede concluir que el ponerse la vestimenta de trabajo es una actividad necesaria para la ejecución de la prestación efectiva de servicios, según requerimiento del empleador, lo cual permite inferir que, respecto al tiempo utilizado por el trabajador para ello, éste ya se encontraría prestando servicios efectivos y, por ende, que dicho lapso forma parte integrante de su jornada de trabajo."}, {"fundamento": "6.27", "texto": "En ese orden de ideas, el tiempo utilizado en las actividades de cambio de vestuario y/o uso de elementos de seguridad debe ser calificado como parte de la jornada de trabajo para los efectos del análisis que la inspección del trabajo efectúa en este caso, como en casos semejantes."}]}, {"id": "2024-001", "anio": 2024, "numero": "001-2024", "tipo": "Precedente", "titulo": "Razonabilidad de la sanción cuando el sindicato efectúa el control del incumplimiento", "criterio": "Criterio sobre la razonabilidad de la medida sancionadora para evitar el exceso de punición, en un caso en el que el sindicato efectuó un control más oportuno y efectivo que el de la inspección (fund. 6.63, 6.67, 6.68, 6.73 a 6.75 y 6.77).", "fundamentos": "6.63, 6.67, 6.68, 6.73, 6.74, 6.75 y 6.77", "palabras": ["razonabilidad", "exceso de punición", "sindicato", "control sindical", "sanción", "incumplimiento absuelto"], "temas": [["Procedimiento sancionador y principios", "Sanciones", "Razonabilidad y exceso de punición"], ["Libertad sindical y negociación colectiva", "Actos antisindicales", "Control sindical del incumplimiento"]], "archivo": "pdf/2024-001.pdf", "archivo_nombre": "Resolucion-001-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.63", "texto": "A diferencia de aquel caso, el presente aborda un problema jurídico de mayor relevancia: la afectación de la dignidad de las personas por un acto hostil. Es así que la aplicabilidad simple del estándar fijado por el precedente vinculante citado antes no es posible. En pocas palabras, la reacción inmediata del empleador no satisface a la manifestación de la razonabilidad, como es la inmediatez de la conducta rectificatoria."}, {"fundamento": "6.67", "texto": "Para el caso concreto, se evidencia que la organización sindical ha sido apta para vigilar por el cumplimiento empresarial de las normas laborales, en particular, el respeto del derecho constitucional de dignidad humana. Asimismo, la inspección del trabajo, en ejercicio de una competencia legal establecida, determinó el incumplimiento y promovió un procedimiento administrativo sancionador. No obstante, es preciso observar que ambos agentes, privado y público, concurren directamente para lograr un mismo propósito, que es el cumplimiento de las normas de trabajo ante la situación que agravia a la dignidad de las trabajadoras. Uno lo hace a través de una acción directa, en ejercicio de las atribuciones de la organización de trabajadores en las relaciones laborales; el otro lo hace a través de una serie de procedimientos de determinación y sanción de la infracción."}, {"fundamento": "6.68", "texto": "De esta forma. el comportamiento inmediato de rectificación, si bien no espontáneamente voluntaria, ha sido efectuada bajo la alerta efectuada por el sindicato. En un lapso subsumible en el concepto de inmediatez. Esto, a juicio de este colegiado, merece un examen sobre la razonabilidad de la medida administrativa de sanción."}, {"fundamento": "6.73", "texto": "Frente a los hechos determinados en un lapso de inmediatez comprobada por el inspector actuante (dos días dentro de los cuales se manifestó el incumplimiento, primero; el requerimiento del sindicato, después; y la rectificación del incumplimiento, finalmente), es preciso evaluar la proporción entre medios y fines que supone la intervención administrativa. En un caso como este, además de la inmediatez de los hechos, es relevante ponderar que, si bien la afectación recae sobre un derecho fundamental como es la dignidad humana, la reversión del incumplimiento ocurre a través de la intervención del sindicato, lo que constituye otra expresión del interés público que informa a nuestro Sistema Jurídico, también con carácter fundamental (esto es así de acuerdo a una lectura consecuente del reconocimiento de la libertad sindical en el artículo 28º de la Constitución)."}, {"fundamento": "6.74", "texto": "De esta forma, es pertinente elevar a precedente de observancia obligatoria el criterio según el cual, por aplicación de dos manifestaciones concurrentes del principio de razonabilidad, constituye exceso de punición el que se imponga una sanción con relación a un incumplimiento que es absuelto por el empleador a requerimiento del sindicato y cuya inmediatez resulta comprobada por la inspección del trabajo durante las actuaciones de fiscalización. En casos semejantes, la inspección del trabajo puede bien evaluar otras medidas de acompañamiento al caso (como la medida de advertencia) o tendentes a la supervisión posterior (tales como la emisión de un informe que dé cuenta de los hechos determinados y lleve a que la Superintendencia Nacional de Fiscalización Laboral incluya al empleador en concreto en una supervisión posterior)."}, {"fundamento": "6.75", "texto": "Es pertinente aclarar que este criterio no podrá utilizarse en casos donde el daño desencadenado por la infracción subsista o en los que la inmediatez no se manifieste concretamente. Igualmente, se previene al Sistema de Inspección del Trabajo del uso de mala fe en las relaciones colectivas de trabajo que podría resultar de la invocación de este criterio. Se consignan algunos ejemplos sobre el particular:"}, {"fundamento": "6.77", "texto": "Bajo las consideraciones anotadas, a juicio del Tribunal, en un caso de tales características, cabe que se descarte a la sanción a fin de evitar que la Administración Pública del Trabajo incurra en un exceso de punición que desvirtúe su actuación ante un caso particular donde el sindicato ha efectuado un control más oportuno y efectivo que el desarrollado por la inspección del trabajo."}]}, {"id": "2024-002", "anio": 2024, "numero": "002-2024", "tipo": "Precedente", "titulo": "Exigibilidad de la probanza y traslado injustificado de trabajadores afiliados", "criterio": "Criterio sobre la exigibilidad de la probanza frente a las alegaciones y la afectación de la libertad sindical individual y colectiva por el traslado injustificado de trabajadores afiliados (fund. 6.36, 6.37, 6.39 a 6.41).", "fundamentos": "6.36, 6.37, 6.39, 6.40 y 6.41", "palabras": ["traslado", "afiliados", "libertad sindical", "probanza", "carga de la prueba", "actos antisindicales"], "temas": [["Libertad sindical y negociación colectiva", "Actos antisindicales", "Traslado injustificado de afiliados"], ["Procedimiento sancionador y principios", "Prueba", "Exigibilidad de la probanza"]], "archivo": "pdf/2024-002.pdf", "archivo_nombre": "Resolucion-002-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.36", "texto": "Al respecto, el incumplimiento del deber de informar a la organización sindical sobre los motivos de la adopción de las medidas de traslado del total de sus trabajadores a otras sedes con la finalidad de mantener la relación laboral, no permitió entablar negociaciones que busquen satisfacer los intereses de los trabajadores y de la empresa, afectando de ese modo el derecho a la libertad sindical, entendido como la capacidad auto determinativa para participar en la constitución y negociación del fuero protector en su ámbito geográfico, vulnerándose de esta forma el ejercicio de la actividad sindical."}, {"fundamento": "6.37", "texto": "Sobre el particular, a la vista de los principios de veracidad y verdad material expresamente reconocidos en el TUO de la LPAG, debe precisarse que, para desvirtuar las infracciones imputadas, no basta con la mera alegación del administrado como en el presente caso referida a que: “el traslado de los trabajadores responde a la necesidad de evitar el contagio debido a los altos índices de contaminación en Arequipa“, “necesidades operativas de la empresa” y “necesidad operativa en otras regiones a diferencia de los que sucede en la sede La Planchada”; en tanto que, en mérito al derecho fundamental de prueba que tiene este, puede ofrecer los medios de prueba que considere pertinentes para sustentar sus alegaciones, correspondiendo a la administración resolver sobre la base de la valoración conjunta de las pruebas aportadas dentro del procedimiento. En ese sentido, se requiere del cumplimiento de un mínimo estándar probatorio por parte del administrado, lo que no ha sucedido en el presente caso, en razón que la impugnante no ha demostrado con medio probatorio alguno lo manifestado."}, {"fundamento": "6.39", "texto": "En consideración a ello, de autos se advierte que el acto antisindical se evidencia en función al daño que ha sido constatado por parte del personal inspectivo en el Acta de Infracción, respecto a un grupo de trabajadores afiliados al SITRAPHAPCI y SUNTRAIN, quienes habiendo ejercido su derecho de afiliación sindical, fueron desplazados, configurándose una serie de casos por las que la parte empleadora dispuso que se encontraran geográficamente desconectados entre sí y con respecto a la asociación sindical a la que se adhirieron, afectándose así su derecho de participación en actividades sindicales ordinarias y extraordinarias. Por ende, el ejercicio de su libertad sindical se encontró afectada por un comportamiento antijurídico, sin que exista una justificación probada, tan solo disculpándolo con la juridicidad que proviene del ius variandi. En el caso, se aprecia una medida de ius variandi radical por no contemplar ponderativamente el ejercicio actual de los afectados de la libertad de afiliación sindical."}, {"fundamento": "6.40", "texto": "En atención a ello, el incumplimiento del deber de informar a los trabajadores afectados sobre los motivos de la adopción de las medidas de traslado a otras sedes con la presunta finalidad de mantener la relación laboral impidió que ellos, a través de la organización sindical, entablaran negociaciones que busquen satisfacer los intereses de los trabajadores y de la empresa. Así, los trabajadores afectados por la medida empleadora han visto afectado su derecho a la libertad sindical, entendido como la capacidad auto determinativa para participar en las actividades propias de la organización sin injerencia de medidas externas, con respeto del fuero de protección y de los derechos en su ámbito."}, {"fundamento": "6.41", "texto": "Al respecto, se evidencia que, existe una afectación individual y colectiva (sindical), en tanto que la medida adoptada por la parte empleadora genera efectos determinados por la inspección del trabajo al afectar la factibilidad del desarrollo de la actividad sindical en el espacio configurado inicialmente (el centro de trabajo), dispersándose a los afiliados al sindicato en diversos espacios físicos. Así, considerando las especiales características de estos prestadores de servicios (operarios que laboran en actividades que demandan esfuerzos físicos que les alejan del uso permanente de medios de comunicación digitales durante la prestación de sus servicios), se observa que la medida patronal adoptada constituye una consecuencia factual que impone dificultades mayúsculas a los derechos de libertad sindical de estos trabajadores. En ese sentido, se evidencia con la medida del traslado geográfico (que los moviliza al otro extremo del país) la afectación a los trabajadores sindicalizados, por tanto, no se requiere de un agravante adicional para que se compruebe el daño ocasionado a los trabajadores afectados con la medida empresarial examinada por la inspección del trabajo en este caso ."}]}, {"id": "2024-003", "anio": 2024, "numero": "003-2024", "tipo": "Precedente", "titulo": "Subsanabilidad de las infracciones a las normas de trabajo", "criterio": "Criterio sobre el carácter subsanable de las infracciones a las normas de trabajo (fund. 6.18 y 6.26 a 6.31). Establece que son subsanables las infracciones cuyos efectos antijurídicos puedan ser reparados en su totalidad.", "fundamentos": "6.18, 6.26, 6.27, 6.28, 6.29, 6.30 y 6.31", "palabras": ["subsanable", "insubsanable", "subsanación", "efectos", "infracción", "medida de requerimiento"], "temas": [["Procedimiento sancionador y principios", "Sanciones", "Subsanabilidad de la infracción"]], "archivo": "pdf/2024-003.pdf", "archivo_nombre": "Resolucion-003-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.18", "texto": "No obstante, de manera general, en el segundo párrafo del artículo 49 del RLGIT12 se ha establecido que las infracciones son subsanables siempre que los efectos de la afectación del derecho o del incumplimiento de la obligación puedan ser revertidos. Es así que el Tribunal de Fiscalización Laboral establece como precedente de observancia obligatoria que: a) Son subsanables las infracciones cuyos efectos antijurídicos puedan ser reparados en su totalidad, desapareciendo la ilegalidad del actuar del empleador y siendo esto determinado por el inspector del trabajo durante la fiscalización laboral. b) Las infracciones no habrán logrado ser subsanadas cuando, pudiendo cumplirse la condición mencionada en el acápite anterior, al culminarse las actuaciones inspectivas, el inspector considere motivadamente que el empleador no ha logrado revertir los efectos antijurídicos. c) Las infracciones serán consideradas insubsanables cuando los efectos de la afectación del derecho o del incumplimiento de la obligación no puedan ser revertidos."}, {"fundamento": "6.26", "texto": "Por tanto, deben considerarse como infracciones insubsanables a aquellos incumplimientos tipificados en el RLGIT, cuyos efectos originaron daños comprobados por la inspección del trabajo y cuya naturaleza suponga que no pueden ser reparados, conforme a la motivación definida en el documento de fiscalización correspondiente (constancia de hechos insubsanables, acta de infracción u otro que sea incluído en el expediente de fiscalización)."}, {"fundamento": "6.27", "texto": "Contrario a ello, si la infracción o infracciones constatadas originan riesgo o un potencial daño, y, en tanto, las medidas adoptadas por el sujeto inspeccionado —espontáneamente o bajo el requerimiento del inspector actuante— garanticen que dicho riesgo desaparezca o sea reparado, se considerarán como subsanables."}, {"fundamento": "6.28", "texto": "De acuerdo con lo antes señalado, a fin de que los daños ocasionados por conductas infractoras sean considerados como insubsanables, deben ser reales, no susceptibles de ser corregidos o rectificados, y estar vinculados al incumplimiento normativo determinado por el tipo infractor. Sin embargo, serán consideradas como subsanables aquellas situaciones que, constituyendo un incumplimiento normativo, sólo ocasionan riesgos, sin llegar a ocasionar daños tangibles, pudiendo ser corregidos o rectificados. Para dicho efecto, sólo resulta necesario que el administrado adecúe oportunamente su conducta al cumplimiento normativo, previniendo con ello la ocurrencia de nuevas situaciones de riesgo o que se genere un daño irreparable."}, {"fundamento": "6.29", "texto": "Cabe señalar que la determinación del carácter insubsanable de una infracción a las normas de trabajo debe encontrarse plenamente identificada por los comisionados, teniendo la obligación de fundamentar las razones por las que el daño producido por los efectos del incumplimiento o incumplimientos atribuidos a las inspeccionadas no puede ser revertido. Ante la ausencia de esta motivación, se entenderá que el inspector actuante podría estar quebrantando el debido procedimiento administrativo. En otras palabras, constituye una obligación de los inspectores comisionados el requerir la subsanación correspondiente cuando ello sea factible, conforme a la proporcionalidad y razonabilidad de la intervención de la inspección del trabajo en las relaciones de trabajo objeto de su supervisión."}, {"fundamento": "6.30", "texto": "Debe tenerse en cuenta que el hecho de que las infracciones imputadas sean tipificadas como muy graves no implica que per se deban ser consideradas como insubsanables. Lo relevante en la calificación de un incumplimiento como “insubsanable” es —tal y como se ha establecido previamente— la determinación del carácter irreversible de los daños producidos por la infracción sobre los derechos e intereses tutelables de los trabajadores afectados por el incumplimiento. Un ejemplo claro de ello lo constituyen las infracciones que implican el incumplimiento de una obligación legal que consiste en la elaboración, entrega o presentación de documentos o formalidades relevantes, aunque no determinantes, para procurar la vigencia de un derecho fundamental (como es el caso del cuadro de categorías y funciones o políticas salariales17), que pese a ser considerada como USO DEL SISTEMA PGA PARA PUBLICACIÓN DE NORMAS LEGALES Se comunica a las entidades que conforman el Poder Legislativo, Poder Ejecutivo, Poder Judicial, Organismos Constitucionales Autónomos, Organismos Públicos, Gobiernos Regionales y Gobiernos Locales, que para efectos de la publicación de sus dispositivos legales en general (normas legales, reglamentos jurídicos o administrativos, resoluciones administrativas, actos de administración, actos administrativos, etc) con o sin anexos, tienen a su disposición el Portal de Gestión de Atención al Cliente PGA, plata una infracción muy grave —salvo que se determine, en el caso en particular, que produjo efectos irreversibles— no necesariamente tiene la calidad de insubsanable18, si es que no se han determinado daños que no puedan revertirse."}, {"fundamento": "6.31", "texto": "Respecto a la infracción por no contar con RISST, se advierte que la comisionada no ha determinado el aparente efecto irreversible de dicho incumplimiento. Asimismo, si bien el comportamiento de la impugnante, en la fecha señalada por la comisionada, ya constituía una conducta antijurídica, los efectos de la misma pudieron ser reparados en su totalidad, desapareciendo la ilegalidad del actuar del empleador. De esa forma, no se advierte que dichos efectos hayan generado una situación jurídica irreversible, como ocurre, por ejemplo, en el caso de accidentes de trabajo que tienen como una de sus causas determinantes el no contar con el RISST."}]}, {"id": "2024-004", "anio": 2024, "numero": "004-2024", "tipo": "Precedente", "titulo": "No asignar ocupación efectiva como acto de hostilidad", "criterio": "Criterio sobre la vulneración de la dignidad de los trabajadores por no asignarles ocupación efectiva, lo que constituye un acto de hostilidad (fund. 6.28, 6.31 y 6.34).", "fundamentos": "6.28, 6.31 y 6.34", "palabras": ["hostilidad", "ocupación efectiva", "dignidad", "trabajador", "sin trabajo asignado"], "temas": [["Libertad sindical y negociación colectiva", "Actos de hostilidad", "Dignidad y ocupación efectiva"]], "archivo": "pdf/2024-004.pdf", "archivo_nombre": "Resolucion-004-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.28", "texto": "Sobre ello, es importante resaltar que cuando un trabajador se compromete a prestar sus servicios personales y subordinados, naturalmente, ello se debe corresponder con el ofrecimiento de funciones por parte del empleador. Y es que no solamente, en una relación está de por medio, la acreencia de una remuneración, dado que una persona natural, cuando se compromete con su contraparte laboral, no solo lo hace por la contraprestación económica que percibirá, dado que subyacen a su contratación, intereses de índole profesional y personal, aspecto que merece tutela de forma tal y como ocurre con el móvil económico referido. Justamente, en función a ello, encuentra fundamento jurídico el denominado “derecho a la ocupación efectiva”, que se nutre del reconocimiento prioritario de la dignidad humana en el trabajo (conforme a la lectura sincronizada de los artículos 1 y 23 de la Constitución)."}, {"fundamento": "6.31", "texto": "De esta forma, se puede concluir que la lesión a la dignidad del trabajador no solo se produce cuando se realizan actos que puedan interferir en el desempeño de sus funciones o a los supuestos descritos en el artículo 30 del TUO de la LPCL. Por el contrario, las agresiones contra la dignidad de la persona que trabaja también se producen cuando el empleador decide, arbitraria e injustificadamente, no encomendar tareas al trabajador a su disposición. La inactividad profesional generada resulta contraria al desarrollo de las capacidades y potenciales profesionales."}, {"fundamento": "6.34", "texto": "En consecuencia, la impugnante ha vulnerado el derecho al trabajo, lo cual comprende no solo el acceso al empleo, sino también el derecho a la ocupación efectiva del puesto de trabajo, esto es, el derecho al desarrollo de la prestación laboral en forma ordinaria, siendo que realizar un trabajo supone un medio por el cual el individuo no solo logra obtener un sustento económico, sino también, consigue desarrollar su persona, su propio profesionalismo o su proyecto de vida, por lo que estos hechos implican un atentado contra la dignidad del trabajador, configurándose así, en un acto de hostilidad que afecta la dignidad de la persona, prevista en el literal g) del artículo 30 del TUO LPCL."}]}, {"id": "2024-005", "anio": 2024, "numero": "005-2024", "tipo": "Precedente", "titulo": "Razonabilidad en la verificación del acto de hostilidad del artículo 30 c) del TUO del D. Leg. 728", "criterio": "Criterio sobre el principio de razonabilidad en la verificación del acto de hostilidad contenido en el inciso c) del artículo 30 del TUO del Decreto Legislativo 728 (fund. 6.33 a 6.35 y 6.38 a 6.40).", "fundamentos": "6.33, 6.34, 6.35, 6.38, 6.39 y 6.40", "palabras": ["hostilidad", "razonabilidad", "artículo 30", "decreto legislativo 728", "acto de hostilidad"], "temas": [["Libertad sindical y negociación colectiva", "Actos de hostilidad", "Razonabilidad en la verificación"]], "archivo": "pdf/2024-005.pdf", "archivo_nombre": "Resolucion-005-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.33", "texto": "Por otra parte, en cuanto al segundo acto hostil referido al traslado injustificado del trabajador a la Operación Minera Toquepala, se debe señalar que se ha acreditado que la impugnante no brindó las condiciones necesarias para que se produzca aquella movilidad. Tal hecho ha sido verificado al constatarse lo siguiente: i) que el trabajador tuvo que comprar sus pasajes aéreos, para que se le realice el examen médico ocupacional, el 15 de marzo de 2021; ii) el trabajador recibió de la impugnante, un primer correo electrónico, el 28 de febrero de 2021, mediante el cual se le comunicaba que su licencia con goce, fue ampliada hasta el 31 de marzo de 2021; un segundo correo electrónico, el 05 de marzo de 2021, en el cual se le comunicaba que sería trasladado a la Operación Minera Toquepala ubicada en Tacna; y, el 12 de marzo de 2021, recibe un nuevo correo en el cual se le informa que en tres (3) días será su examen médico ocupacional."}, {"fundamento": "6.34", "texto": "Además, de acuerdo a lo previsto en la Normativa Interna de Rendición por gastos de viaje al interior del país 17 (Constitucionales, Judiciales y Administrativos) del personal técnico de la División de la Gran Mineríaversión 02 (documento presentado por la impugnante durante las actuaciones inspectivas), en caso de viaje, a los trabajadores se les debía otorgar un anticipo, o facilitar alguna otra medida que permitiera cubrir los costos en pasajes y viáticos, de lo cual se deja constancia en el numeral 4.24 del acta de infracción. Por otro lado, es un hecho cierto que la impugnante costeaba el pago de los pasajes y viáticos al trabajador cuando laboraba en la Unidad Minera Las Bambas, situación que cambió cuando fue trasladado a Unidad Minera de Toquepala. En este punto, esta Sala hace notar la intención por parte del empleador de hostilizar de forma general al trabajador, pues no explica cuál es la razón para proceder con el cambio de criterio para dejar de brindar viáticos y pasajes al trabajador."}, {"fundamento": "6.35", "texto": "A su vez, el trabajador afectado estuvo en la ciudad de Arequipa, entre el 15 y el 25 de marzo de 2021, sin ningún tipo de ayuda económica para su sustento; hecho que no ha sido negado por la impugnante, quien ha pretendido justificar esta omisión con el pago posterior de los viáticos de marzo de 2021, conforme se deja constancia en el numeral 4.23 del acta de infracción; actuar que hace evidente la decisión unilateral del empleador."}, {"fundamento": "6.38", "texto": "De esta forma, para considerar como válido el traslado del trabajador debe existir una causa objetiva que justifique y sea razonable para que el empleador realice dicho actuar, de lo contrario, nos encontraríamos ante una afectación fundamental de la relación de trabajo, que incide en las condiciones y forma de la prestación laboral, y afecta el ámbito personal y familiar del trabajador."}, {"fundamento": "6.39", "texto": "En igual sentido, al analizarse la configuración de acto hostil contenido en el inciso c) del artículo 30 del TUO del Decreto Legislativo N° 728, aprobado por Decreto Supremo N° 003-97- TR, debe evaluarse el elemento subjetivo identificado como la acción del empleador de tener como “propósito ocasionarle perjuicio al trabajador”, el cual se satisface ofreciendo los indicios y medios de prueba idóneos que permitan advertir que el ejercicio de la facultad de dirección o ius variandi por parte del empleador, no se ha sujetado a los límites que impone el principio de razonabilidad, si no que, por el contrario, Asignaciones Bonificaciones 1000.00 se ha hecho un uso abusivo del mismo, menoscabando así los derechos fundamentales de los trabajadores y denigrándolos."}, {"fundamento": "6.40", "texto": "En consecuencia, se colige que aun cuando la impugnante, tiene la facultad especial de modificar, entre otros, los elementos no esenciales de una relación laboral o aquellas condiciones accesorias a la relación laboral, al amparo de su ius variandi que forma parte del poder de dirección, contenido en el artículo 9° del TUO del Decreto Legislativo N° 728, aprobado por Decreto Supremo N° 003-97-TR, también es cierto, que dicha acción debe enmarcarse bajo criterios de razonabilidad y objetividad, no afectando los derechos del trabajador, situación que no ha ocurrido en el caso de autos, al no existir una causa objetiva y razonable que motive razonablemente el traslado del trabajador a un lugar distinto en el que ejecutaba sus labores. Adicionalmente, ha quedado acreditado que dicho traslado, ocasionó al trabajador no solo un perjuicio económico, al tener que asumir los gastos de pasajes y viáticos, sino también un estado de incertidumbre, pues no contaba con todos los medios económicos básicos para solventar su bienestar y salud en la ciudad de Arequipa, entre el 15 al 25 de marzo de 2021, más aún si durante dicho periodo, se conocía públicamente de la propagación y contagio masivo que había adquirido la Covid-19. Así, a través de los indicios generados por las circunstancias en la que se sucedieron los hechos materia de controversia, de acuerdo con los medios probatorios admitidos en el proceso, los cuales se encuentran citados en los considerandos precedentes, y sobre la base de los gastos ocasionados por el traslado y la separación de su familia, esta Sala infiere el propósito de la impugnante de ocasionarle perjuicio al trabajador, en adición a no haber quedado acreditada la razonabilidad de la medida adoptada por la impugnante."}]}, {"id": "2024-006", "anio": 2024, "numero": "006-2024", "tipo": "Precedente", "titulo": "Tipo infractor del numeral 25.14 (actos de hostilidad)", "criterio": "Criterio sobre el tipo infractor del numeral 25.14 del artículo 25 del RLGIT, referido a actos de hostilidad (fund. 6.9 a 6.13 y 6.16).", "fundamentos": "6.9, 6.10, 6.11, 6.12, 6.13 y 6.16", "palabras": ["25.14", "hostilidad", "tipo infractor", "actos de hostilidad"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Actos de hostilidad (25.14 y 25.15)"]], "archivo": "pdf/2024-006.pdf", "archivo_nombre": "Resolucion-006-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.9", "texto": "Toda relación laboral supone para el trabajador el cumplimiento de obligaciones y para el empleador, el derecho a normar reglamentariamente las funciones y labores a desarrollarse, dictar las órdenes y sancionar la falta de acatamiento de las mismas. Esto último, es traducido como el poder de dirección, que no puede ser ejercido de forma arbitraria, pues debe practicarse de acuerdo a ciertos parámetros: a) sujeción a la Constitución y la ley; b) respeto de los derechos fundamentales y c) el respeto del principio de razonabilidad que limita el poder del empleador a tomar decisiones arbitrarias."}, {"fundamento": "6.10", "texto": "Se trata, por tanto, de la consideración de la legitimidad de la medida desplegada en uso del poder de dirección y de la estimación de cierto grado de afectación de un derecho fundamental de la parte trabajadora. De esta manera, se advierte que todo acto de hostilidad implica un uso desmedido de la facultad de dirección, a la cual se encuentra sujeto el trabajador, por la relación de subordinación-dependencia existente en el contrato laboral. La inspección de trabajo tiene la carga de determinar esta afectación a los derechos de la parte trabajadora con atención a la desproporción de los medios y fines disponibles en el ejercicio de las facultades del poder de dirección, las garantías de indemnidad de los derechos fundamenales y el respeto de las normas laborales vigentes. Todo ello a efectos de determinar si corresponde o no un reproche administrativo ante cierto hecho reputado como comportamiento hostil."}, {"fundamento": "6.11", "texto": "Así, cuando la determinación de una conducta hostil por parte del empleador contra uno o varios trabajadores (as), la inspección del trabajo debe cumplir con determinar, con las actuaciones investigadoras necesarias y la valoración de las piezas probatorias disponibles, la existencia del daño (o del comportamiento tendente a producir ese resultado antijurídico) y la conexión entre este comportamiento (acción u omisión) y el empleador. Estos extremos son suficientes para determinar la responsabilidad administrativa por la comisión de un acto de hostilidad."}, {"fundamento": "6.12", "texto": "Por tanto, y siguiendo la línea resolutiva de la Sala en las Resoluciones Nros. 068, 106, 188, 233 y 257-2022-SUNAFIL/TFL-Primera Sala, así como las Resoluciones Nros. 626, 747, 762, 928, 989, 1054, 1060, 1105, 1141-2023-SUNAFIL/TFL-Primera Sala y la Resolución Nº 139-2024-SUNAFIL/TFL-Primera Sala, entre otras; no resultará suficiente que la inspección de trabajo y/o el órgano administrativo sancionador solo haga mención o descripción de un cierto comportamiento del sujeto inspeccionado para concluir la existencia de un comportamiento hostil. Además, deberá acreditarse con medios de prueba directos o indirectos la responsabilidad administrativa por la comisión de actos de hostilidad laboral. Es decir, se debe evidenciar cuáles son los motivos por los cuales se haya afectado la dignidad de uno o más trabajadores o el ejercicio de sus derechos constitucionales, practicándose de esa forma la subsunción correcta dentro del numeral 25.14 del artículo 25 del RLGIT."}, {"fundamento": "6.13", "texto": "Es imperativo recalcar que las instancias del sistema responsables de la tramitación del procedimiento administrativo sancionador deben garantizar que la motivación comprenda las alegaciones de los administrados que resulten razonables para el análisis del caso, analizando sus fundamentos de hecho y de derecho y valorando los medios probatorios que resulten justificados con relación a la materia analizada."}, {"fundamento": "6.16", "texto": "Por ello, la importancia de que los inspectores de trabajo y la autoridad administrativa a cargo del procedimiento administrativo sancionador, en la evaluación de estos casos, consideren mediante los medios de investigación que recoge la LGIT y el RLGIT, recabar medios de prueba o indicios suficientes, que permitan la comprobación del elemento objetivo y subjetivo del acto de hostilidad, objeto de la Orden de Inspección. Sobre las conductas imputadas"}]}, {"id": "2024-007", "anio": 2024, "numero": "007-2024", "tipo": "Precedente", "titulo": "Incorrecta tipificación cuando no se delimitó la desnaturalización de las modalidades formativas", "criterio": "Criterio sobre la incorrecta tipificación, por el personal inspectivo, de la conducta imputada al empleador cuando no se ha delimitado previamente la desnaturalización de las modalidades formativas laborales (fund. 6.45, 6.46, 6.48 y 6.50).", "fundamentos": "6.45, 6.46, 6.48 y 6.50", "palabras": ["modalidades formativas", "prácticas", "desnaturalización", "tipificación", "formativo"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Modalidades formativas (desnaturalización)"]], "archivo": "pdf/2024-007.pdf", "archivo_nombre": "Resolucion-007-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.45", "texto": "Es pertinente tener en cuenta que la infracción contenida en el numeral 44-B.1 del artículo 44-B del RLGIT hace referencia expresa al incumplimiento resultante de la falta de inscripción de trabajadores u otras personas respecto de las que exista la obligación de inscripción en el régimen de seguridad social en salud. Sin embargo, conforme se ha mencionado en párrafos anteriores, once de las personas comprendidas en la investigación son practicantes, por lo que, conforme con la ley material aplicable, dichos sujetos no podrían ser considerados como “trabajadores afectados”."}, {"fundamento": "6.46", "texto": "En el caso examinado, el inspector comisionado no ha efectuado un análisis respecto a la configuración de un supuesto de desnaturalización de las modalidades formativas. No podría concluirse que el fiscalizador haya establecido que las personas sujetas a modalidades formativas no eran practicantes sino trabajadores de la Inspeccionada. Por ende, no resulta válido inferir que la impugnante se encontraría en la obligación de inscribir a sus practicantes preprofesionales y profesionales en el régimen de seguridad social en salud. Este es un punto determinante para comprobar si el Sujeto inspeccionado estaba incurriendo en una infracción en materia de seguridad social en salud, en perjuicio de once personas."}, {"fundamento": "6.48", "texto": "De lo expuesto, se colige que en el caso examinado no se ha acreditado un supuesto de desnaturalización de las modalidades formativas laborales —conforme al artículo 51 de la referida norma— ni se ha observado razonamiento en el Acta de Infracción que permita deducir ello. Del mismo modo, si bien existe una obligación del empleador de asegurar a los practicantes ante un posible riesgo de enfermedad o accidente, la propia norma contempla que esto puede brindarse mediante EsSalud o de un seguro privado. Por consiguiente, se determina que el incumplimiento detectado por el personal inspectivo pudo, en todo caso, sancionarse como una infracción en materia de promoción y formación para el trabajo contenida en el Capítulo V del RLGIT. Por tal motivo, no se evidencia que la infracción imputada se ajuste al tenor del tipo legal contenido en el numeral 44-B.1 del artículo 44-B del RLGIT."}, {"fundamento": "6.50", "texto": "Respecto a este extremo, correspondía que el inspector efectúe una correcta calificación y subsunción del tipo infractor imputado, debido a que, en ninguna parte del Acta de Infracción se determina que los once practicantes en realidad eran trabajadores de la Inspeccionada, realizando para ello el análisis correspondiente, en virtud de la aplicación del Principio de Primacía de la realidad, y que por tanto, se demuestre con suficiencia que el empleador tenía la obligación de inscribirlos en el régimen de seguridad social en salud. No obstante, esto no ha sucedido. Por el contrario, se ha corroborado que existe una indebida catalogación de los once practicantes como prestadores de servicios, considerándolos como trabajadores afectados sin que previamente se haya establecido con fehaciencia que sí eran empleados de la empresa."}]}, {"id": "2024-008", "anio": 2024, "numero": "008-2024", "tipo": "Precedente", "titulo": "Riesgo grave e inminente para la seguridad y salud de los trabajadores (numeral 28.7)", "criterio": "Criterio sobre el tipo infractor del numeral 28.7 del artículo 28 del RLGIT, referido al riesgo grave e inminente para la seguridad y salud de los trabajadores (fund. 6.5, 6.6, 6.13 y 6.14).", "fundamentos": "6.5, 6.6, 6.13 y 6.14", "palabras": ["28.7", "riesgo grave", "riesgo inminente", "seguridad y salud", "SST"], "temas": [["Seguridad y salud en el trabajo", "Tipificación en SST (arts. 27 y 28 RLGIT)", "Riesgo grave e inminente (28.7)"]], "archivo": "pdf/2024-008.pdf", "archivo_nombre": "Resolucion-008-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.5", "texto": "El Tribunal Constitucional ha sostenido que el Principio de presunción de inocencia se constituye “en un límite al principio de libre apreciación de la prueba por parte del juez, puesto que dispone la exigencia de un mínimo de suficiencia probatoria para declarar la culpabilidad, más allá de toda duda razonable”17. Siguiendo tal criterio, en sede administrativa fiscalizadora y sancionadora, podemos afirmar que el Principio de Presunción de Licitud opera como lineamiento exigible a los órganos correspondientes del Sistema de Inspección del Trabajo, en los casos en los que los tipos sancionadores no establezcan un régimen objetivo de responsabilidad."}, {"fundamento": "6.6", "texto": "Resulta de vital importancia que la administración satisfaga un estándar probatorio razonable sobre la comisión de la infracción por la que se imputa a una inspeccionada, teniendo en cuenta que el nivel de probanza de la acusación es que ésta se encuentre acreditada más allá de toda duda razonable. La Administración Pública no solo debe encargarse de mostrar pruebas de la acusación, sino que tiene que encargarse de valorar y argumentar que tales piezas sustentan el análisis sobre los hechos probados del caso y en debida consideración del principio de tipicidad."}, {"fundamento": "6.13", "texto": "Por tanto, atendiendo a la conjunción copulativa “riesgo grave e inminente23” del tipo infractor del numeral 28.7 del artículo 28 del RLGIT, para el juicio de subsunción del comportamiento reprochado no será suficiente que los inspectores de trabajo acrediten la gravedad por acción u omisión del incumplimiento en materia de seguridad y salud en el trabajo por parte del sujeto inspeccionado. De conformidad con el principio de tipicidad, también se deberán desarrollar las razones que sustentan la inminencia en la configuración de dicho riesgo grave en materia de seguridad y salud de los trabajadores que la administración considere como afectados (y, eventualmente, de las personas que prestan servicios dentro del ámbito del centro de labores)."}, {"fundamento": "6.14", "texto": "Por tanto, y siguiendo la línea resolutiva de la Sala en las Resoluciones Nros. 463-2021, 565-2022-SUNAFIL/ TFL-Primera Sala, así como las Resoluciones Nros. 1116, 1135,1163-2023-SUNAFIL/TFL-Primera Sala y la Resolución Nº 127-2024-SUNAFIL/TFL-Primera Sala, entre otras; el Tribunal de Fiscalización Laboral sienta como criterio vinculante que la imputación del numeral 28.7 del artículo 28 del RLGIT implica necesariamente la verificación, por parte de la inspección del trabajo, del incumplimiento en la adopción de medidas preventivas sobre las condiciones de trabajo que implique un grave riesgo e inminente para la seguridad y salud de los trabajadores y prestadores de servicios en el centro de labores. Por ello, la autoridad administrativa debe efectuar el análisis y sustentar si efectivamente la Inspeccionada incurrió en la infracción en materia de seguridad y salud en el trabajo, en los términos establecidos en el tipo señalado, conforme al considerando anterior."}]}, {"id": "2024-009", "anio": 2024, "numero": "009-2024", "tipo": "Precedente", "titulo": "Tipo infractor del numeral 25.17 en el supuesto de discriminación", "criterio": "Criterio sobre el tipo infractor del numeral 25.17 del artículo 25 del RLGIT, bajo el supuesto de discriminación (fund. 6.28 a 6.30, 6.33 y 6.34).", "fundamentos": "6.28, 6.29, 6.30, 6.33 y 6.34", "palabras": ["25.17", "discriminación", "tipo infractor"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Discriminación (25.17)"]], "archivo": "pdf/2024-009.pdf", "archivo_nombre": "Resolucion-009-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.28", "texto": "Respecto al caso en concreto, esta Sala considera que la decisión del empleador de no otorgar a los 22 trabajadores sindicalizados de SITROSANFER el incremento remunerativo de S/1.80 diarios en su jornal, se basó solo en su condición de afiliado a dicha organización, es decir, en el ejercicio de su libertad sindical positiva respecto de esta última. La impugnante alega que no podría hacerse extensivo este beneficio, al no haberse obtenido a través de un convenio colectivo, argumento que no resulta razonable, pues se ha verificado que dicho incremento sí fue otorgado a los trabajadores afiliados a los otros dos sindicatos (SUNTSANFER y Sindicato Nacional de Trabajadores de la Empresa de San Fernando Sur)."}, {"fundamento": "6.29", "texto": "Es decir, puede advertirse que el tipo contenido en el inciso 25.10 del artículo 25 del RLGIT está compuesto por una premisa suficiente que, leída con la consecuencia jurídica prescrita, puede entenderse de la siguiente manera: [“son muy graves las infracciones consistentes en la realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores”]. Por ende, la extensión de beneficios del convenio (Constitucionales, Judiciales y Administrativos) colectivo de trabajo de eficacia limitada a los no afiliados al sindicato minoritario está contemplada en esta premisa del tipo sancionador de forma suficiente, infracción que es sancionada con la graduación máxima en el ordenamiento administrativo laboral. La subsunción de la extensión de los beneficios de un convenio colectivo de eficacia limitada a los no afiliados al sindicato minoritario pactante es viable dentro de este extremo del tipo sancionador por cuanto la práctica objetada en el presente expediente sancionador es una que afecta, per se, la libertad sindical, conforme a lo desarrollado en los considerandos anteriores."}, {"fundamento": "6.30", "texto": "Adicionalmente, el desarrollo ejemplificativo referido a la “promoción de la desafiliación de la organización sindical” añade a esta premisa un supuesto concreto, por lo que, para esos casos determinados, torna a la afirmación descrita en el párrafo anterior como una “premisa mayor” con respecto a esta premisa menor, en específico. Así, la premisa menor, añadida a la premisa mayor a título de desarrollo ejemplificativo, arroja la siguiente fórmula: [“la promoción de la desafiliación a la organización sindical actúa como una infracción muy grave por consistir en la realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores”]. Entonces, de igual forma, la subsunción de los hechos determinados en este caso resultaría, incluso, viable en esta fórmula del inciso 25.10 del artículo 25 del RLGIT por cuanto la práctica objetada despliega efectos que tienden a promover la desafiliación, al dejarse sin base tangible a la utilidad de la afiliación para los trabajadores que podrían sindicalizarse, dada la extensión de los beneficios del sindicato minoritario por acción unilateral del empleador.” (énfasis añadido) 6.27. Asimismo, la Resolución de Sala Plena N°004-2023SUNAFIL/TFL-Primera Sala también delimito los siguientes supuestos de observancia obligatoria: “6.36 Entonces, esta Sala debe proceder al análisis de validez de la invocación de la cláusula celebrada por un sindicato minoritario con el empleador que permitiría extender ciertos beneficios económicos y la denunciada afectación de la afiliación sindical de otro sindicato minoritario. Esto, para establecer si este acuerdo representa una formula válida, conforme con el derecho constitucional de libertad sindical, a propósito del sindicato minoritario pactante, en el ámbito de su actuación. 6.37 Con respecto a la primera cuestión, es necesario analizar si el sindicato pactante puede celebrar un acuerdo consistente para autorizar o reconocer que el empleador tiene la facultad de ecualizar ciertas condiciones salariales entre afiliados a su organización, afiliados a otras organizaciones y no sindicalizados en general. Es decir, debe establecerse si el sindicato pactante es el titular de un acto de disposición de semejante alcance. 6.38 En el entendimiento de esta Sala, este acuerdo podría tener un efecto antisindical subyacente si es que, en el ámbito respectivo, existe otra organización sindical minoritaria (como ocurre en este caso) o, incluso, si se estuviera formando un sindicato.” (énfasis añadido) 6.28. Respecto al caso en concreto, esta Sala considera que la decisión del empleador de no otorgar a los 22 trabajadores sindicalizados de SITROSANFER el incremento remunerativo de S/1.80 diarios en su jornal, se basó solo en su condición de afiliado a dicha organización, es decir, en el ejercicio de su libertad sindical positiva respecto de esta última. La impugnante alega que no podría hacerse extensivo este beneficio, al no haberse obtenido a través de un convenio colectivo, argumento que no resulta razonable, pues se ha verificado que dicho incremento sí fue otorgado a los trabajadores afiliados a los otros dos sindicatos (SUNTSANFER y Sindicato Nacional de Trabajadores de la Empresa de San Fernando Sur). 6.29. De esta forma, a fin de evitar la afectación de un derecho fundamental, como es el ejercicio de la libertad sindical positiva, este Tribunal exige una mayor justificación por parte de los empleadores sobre el motivo por el cual no correspondería extender los beneficios laborales obtenidos por convenios colectivos a trabajadores no afiliados a una organización sindical minoritaria en particular, siendo que sí los otorga a sindicalizados de otras organizaciones de las mismas características. Por lo tanto, al analizar los argumentos y documentales del presente procedimiento administrativo sancionador, resulta claro el acto discriminatorio en perjuicio de los trabajadores afiliados al SITROSANFER por su condición de afiliados a esta organización, sin considerar que lo pactado en los convenios colectivos no los excluía, y por el contrario, se habían otorgado a los trabajadores no afiliados dicho beneficio remunerativo al igual que los afiliados de los sindicatos SUNTSANFER y Sindicato Nacional de Trabajadores de la Empresa de San Fernando Sur. 6.30. Es así como los veintidós trabajadores detallados en el cuadro N°01 del Acta de Infracción debieron percibir el mismo incremento remunerativo, máxime si no se ha acreditado con medios probatorios pertinentes cuáles son los criterios objetivos que justificasen dicha diferencia remunerativa. Por lo tanto, se ha podido corroborar que existió un trato desigual en contra de los trabajadores afectados, incurriendo la impugnante en una discriminación por motivo sindical; razón por la que se debió dar cumplimiento al pago del incremento de S/ 1.80 soles sobre el jornal diario de todos los trabajadores afiliados al SITROSANFER a partir del mes de octubre de 2019, hasta la fecha en que fue requerido, a través de la medida inspectiva de requerimiento de fecha 8 de setiembre de 2020."}, {"fundamento": "6.33", "texto": "Por consiguiente, al verificarse que se está ante un tipo de comportamiento discriminatorio que alude a una discriminación directa que incide en un motivo prohibido, se aplicará el contenido del artículo 48.1-C19 del RLGIT. Así, esta Sala considera que los casos de discriminación salarial que se basen comprobadamente en motivos prohibidos bajo actos u omisiones de discriminación directa o indirecta, deben ser tratados con la regla punitiva referida para el cálculo de una sanción mayor, situación que ha sucedido en el presente caso, al evidenciarse que el motivo de discriminación se basó en el ejercicio de la libertad sindical de los trabajadores afiliados al Sindicato SITROSANFER, a los cuales su empleador les negó hacer extensivo la aplicación del incremento remunerativo obtenido por convenio colectivo por el Sindicato SUNTSANFER y el Sindicato Nacional de Trabajadores de la Empresa de San Fernando Sur, y que fue extendido a los trabajadores no afiliados."}, {"fundamento": "6.34", "texto": "De acuerdo con lo señalado precedentemente, la impugnante no logró acreditar una causa objetiva y razonable que justifique su actuar, al no hacer extensivo el incremento remunerativo a los trabajadores afiliados al Sindicato SITROSANFER. Por lo tanto, al no existir una justificación clara y precisa para que los trabajadores afectados no percibieran dicho incremento, se quebrantó el principio de igualdad y la prohibición de discriminación, advirtiéndose la discriminación directa por motivos del ejercicio de su libertad sindical, al no otorgárseles el incremento remunerativo que les correspondería percibir."}]}, {"id": "2024-010", "anio": 2024, "numero": "010-2024", "tipo": "Precedente", "titulo": "Acuerdos desmaterializados en plataformas digitales para adelantar o fraccionar vacaciones", "criterio": "Criterio referido a los acuerdos desmaterializados a través de plataformas digitales en el adelanto o fraccionamiento de vacaciones de los trabajadores (fund. 6.20, 6.23, 6.26 a 6.28 y 6.32 a 6.34).", "fundamentos": "6.20, 6.23, 6.26, 6.27, 6.28, 6.32, 6.33 y 6.34", "palabras": ["vacaciones", "plataforma digital", "digital", "fraccionamiento", "adelanto de vacaciones", "acuerdo"], "temas": [["Relación de trabajo y derechos laborales", "Vacaciones", "Acuerdos digitales de vacaciones"]], "archivo": "pdf/2024-010.pdf", "archivo_nombre": "Resolucion-010-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.20", "texto": "A mayor abundamiento, el artículo 17 del Decreto Legislativo N° 713, establece que a “solicitud escrita del trabajador, el disfrute del período vacacional puede ser fraccionado”, es decir, que la solicitud no es aprobada automáticamente, sino que es necesario un “acuerdo escrito entre las partes”. Se deduce, entonces, de la legislación vigente, que la anuencia del empleador es indispensable para que un trabajador pueda hacer uso del goce vacacional. En consecuencia, la empresa no ha vulnerado el derecho a vacaciones de sus trabajadores por manifestar su acuerdo o desacuerdo ante las propuestas que ellos presenten sobre la oportunidad y la forma del goce vacacional."}, {"fundamento": "6.23", "texto": "Así, resulta innegable que el empleo de medios digitales acelera los procesos y simplifica los trámites. Sin embargo, es responsabilidad de los empleadores y de la Administración Pública utilizarlos garantizando los derechos de los trabajadores y en estricta observancia de la legislación vigente. Condición que, a criterio de esta Sala, se ha cumplido en el caso en que los trabajadores proponen unas fechas determinadas y la empresa las aprueba. En este caso, se emplea un mecanismo que hasta donde puede observarse, da cuenta de que la manifestación de voluntad del trabajador no se encuentre afectada por vicio, dolo o intimidación, y que, al goce de vacaciones, haya precedido un procedimiento que da lugar a la posibilidad del acuerdo exigido por ley, lo que es plasmado en la solicitud que presenta el trabajador en la plataforma digital y en la respuesta de la división de Recursos Humanos. De esta forma, de acuerdo con el SGV, si en el plazo de cinco días útiles la parte trabajadora no recibe indicación en contrario del jefe inmediato, se convalida la solicitud y otorga las vacaciones. Del mismo modo, que no fuera autorizada dicha (Constitucionales, Judiciales y Administrativos) solicitud, se le comunica al trabajador quien deberá coordinar la nueva fecha y, de llegar a un acuerdo, ingresará al sistema la nueva fecha acordada."}, {"fundamento": "6.26", "texto": "Teniendo en cuenta lo expuesto, se observa que esta situación también ha concurrido en el presente procedimiento, puesto que la empresa ha podido demostrar que su SGV contiene acuerdos desmaterializados que plasman la voluntad de las partes intervinientes, sin que una pueda alterar la de la otra, las cuales constan en un registro en el que se pueden identificar claramente las fechas de inicio y fin de vacaciones, así como el periodo laboral al que corresponden."}, {"fundamento": "6.27", "texto": "Si bien es cierto que aún no existe una norma que expresamente regule esta figura en el ámbito laboral, el Título Preliminar de la LPAG permite concluir su validez y legitimidad porque los principios que inspiran el procedimiento administrativo sirven de “criterio interpretativo para resolver las cuestiones que puedan suscitarse en la aplicación de las reglas de procedimiento, como parámetros para la generación de otras disposiciones administrativas de carácter general, y para suplir los vacíos en el ordenamiento administrativo”."}, {"fundamento": "6.28", "texto": "En virtud de estas consideraciones, en aplicación del principio de presunción de veracidad, según el cual, en la tramitación del procedimiento administrativo, se presume que los documentos y declaraciones formulados por los administrados responden a la verdad de los hechos que ellos afirman, salvo que se pruebe lo contrario11, se debe dar por cierto lo afirmado por la impugnante. Esta presunción de veracidad es invocable puesto que no resulta aplicable la presunción de certeza del acta de infracción ni de la imputación de responsabilidad que contiene, ya que no está sustentada (para el caso concretamente analizado) en una conducta infractora sustancial, puesto que, razonablemente, no es exigible la forma escrita, por su falta de idoneidad, al acreditarse el uso de herramientas digitales para la gestión de las relaciones de trabajo."}, {"fundamento": "6.32", "texto": "Sin embargo, en aplicación del principio de presunción de veracidad, corresponde dar credibilidad a lo afirmado por la impugnante, ya que las normas vigentes no excluyen los medios informáticos para plasmar la voluntad de las partes y que, con las nuevas tecnologías, ese consentimiento es viable en el SGV implementado por la empresa. Mas bien, no se ha observado que el administrado haya impuesto el goce de vacaciones a trabajadores que no estaban de acuerdo con el fraccionamiento, ni que el empleador sea quien active el derecho a gozar de ese beneficio en estos casos."}, {"fundamento": "6.33", "texto": "Conforme se ha sostenido previamente, es importante rescatar que no puede deducirse una regla general válida para todo el tipo de prácticas que pudieran darse a propósito de un programa de vacaciones del tipo que se ha presentado en este expediente, pero lo cierto es que la inspección del trabajo, como el procedimiento sancionador, deben evaluar elementos que permitan determinar si este tipo de prácticas cumplen o no con ponderar adecuadamente los intereses de los empleadores con los derechos a los trabajadores."}, {"fundamento": "6.34", "texto": "Entre otros elementos que la investigación debiera recoger, se encuentran el hecho de que la plataforma a través de la que se hagan las invitaciones a fraccionar vacaciones y los registros de las solicitudes respectivas sea una de carácter accesible, de uso rutinario para sus usuarios trabajadores y que además, tengan un tiempo razonable para poder adoptar medidas que maximicen la posibilidad de que puedan adecuar su vida familiar y personal respecto a los periodos de vacaciones fraccionadas propuestas, y que puedan buscar asesoramiento -a través de la empresa, de alguna organización sindical o de manera externa- sobre el propio fraccionamiento o sobre la denegatoria a la propuesta del empleador, lo que, desde luego, en ningún caso debiera significar el riesgo a ser objeto de represalia alguna. Estos elementos deben ser tomados en cuenta por los inspectores al momento de analizar los casos donde se adopten medidas empresariales que faciliten el adelanto o fraccionamiento de vacaciones a través de plataformas informáticas, a fin de observar que cumpla con los límites de ejercicio extrínsecos al poder de dirección, como son los derechos fundamentales de los trabajadores."}]}, {"id": "2024-011", "anio": 2024, "numero": "011-2024", "tipo": "Precedente", "titulo": "Tipicidad y debida motivación para determinar responsabilidad administrativa", "criterio": "Criterio referido al principio de tipicidad y a la debida motivación para la determinación de responsabilidad administrativa por la autoridad (fund. 6.11, 6.12, 6.14, 6.24 y 6.35).", "fundamentos": "6.11, 6.12, 6.14, 6.24 y 6.35", "palabras": ["tipicidad", "motivación", "debida motivación", "responsabilidad administrativa"], "temas": [["Procedimiento sancionador y principios", "Principios del procedimiento", "Tipicidad y debida motivación"]], "archivo": "pdf/2024-011.pdf", "archivo_nombre": "Resolucion-011-2024-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.11", "texto": "En estricto sentido, la marcación ex post del horario de trabajo no implica que, de forma necesaria, deba concluirse que se ha vulnerado el contenido imperativo de las obligaciones de registro ordenadas al empleador en el Decreto Supremo Nº 0042006-TR. En efecto, en ejercicio de su facultad fiscalizadora, el empleador puede determinar qué trabajadores han incumplido el deber de completar el registro diario y ordenar las rectificaciones correspondientes, bajo el principio de razonabilidad y proporcionalidad, dentro de una inmediatez exigible que denote un comportamiento diligente respecto del deber jurídico establecido por la legislación laboral. Sobre el particular, este Tribunal recuerda que es exigible a la Administración Pública el desarrollar una fundamentación debida de las decisiones adoptadas, más aún en sede sancionadora. Así, la garantía de motivación bien cumplida permite desvirtuar adecuadamente a la presunción de licitud para imputar y sancionar adecuadamente un ilícito administrativo laboral."}, {"fundamento": "6.12", "texto": "De otro lado, el Tribunal de Fiscalización Laboral debe pronunciarse con relación a un elemento propio de la gobernanza privada de las relaciones laborales privadas y que se desprende de la facultad organizativa del empleador fiscalizado en el presente caso. Con relación a las omisiones de marcado determinadas por la SUNAFIL en el periodo de abril-diciembre de 2020, la recurrente informó a la inspección de trabajo y a la autoridad sancionadora que implementó un Módulo de Asistencia y Compensación (MAC) para que el personal que no hubiese cumplido con registrar su ingreso y salida pueda justificar tales omisiones (por olvido de marcado, entre otros). Asimismo, el administrado ha insistido que en su política ha establecido que, en caso que el trabajador no subsane el deber del marcado del registro de asistencia, procederá a realizar los descuentos respectivos. Como se observa, en este caso, el empleador argumenta que en ejercicio de su potestad normativa ha regulado que los sujetos obligados a efectuar el registro (su personal) debe cumplir con efectuar el comportamiento establecido. Sobre el particular, debe destacarse que ni en el expediente inspectivo ni en el sancionador se ha analizado si es que tales descuentos operaron ante evidencia de trabajo realizado pese a la ausencia de registro en una jornada específica. En vez de ello, el procedimiento sancionador se ha decantado por un análisis formal que invalida los actos de rectificación del registro del tiempo de trabajo per se, criterio con el que esta instancia de revisión no concuerda."}, {"fundamento": "6.14", "texto": "Así, no se aprecian razones suficientes por las que se establezca que las “omisiones” en el registro no puedan ser “justificadas” por medio de un mecanismo digital como el implementado por este empleador para gestionar sus relaciones laborales. Tampoco se observa que la Administración del Trabajo haya cumplido, en este caso, con motivar el por qué el uso de este recurso tecnológico resulta insuficiente para los fines normativamente impuestos sobre el registro del ingreso y salida de los trabajadores, el control del tiempo de trabajo y el respeto del tiempo de descanso del personal. En consecuencia, no se advierte una debida motivación que permita desvirtuar el principio de presunción de licitud, de modo suficiente."}, {"fundamento": "6.24", "texto": "En este caso, la conducta que se atribuye a la impugnante es: inconsistencias en el registro de marcado del 2 y 9 de diciembre de 2020 y, las omisiones en el ingreso y salida de seis trabajadores. Sin embargo, conforme con el principio de tipicidad es importante determinar que el tipo sancionador previsto en el numeral 25.19 del artículo 25 del 5 RLGIT (vigente a la fecha de la comisión de las supuestas infracciones, esto es, abril-diciembre de 2020), prevé taxativamente como infracción muy grave: “No contar con el registro de control de asistencia, o impedir o sustituir al trabajador en el registro de su tiempo de trabajo”. Es decir, se reprime a: i. La ausencia del mecanismo de control del tiempo de trabajo que la ley laboral ordena al empleador a implementar y llevar con diligencia; ii. Los comportamientos fraudulentos y abusivos por los que se afecta la veracidad del tiempo de trabajo inscrito jornada tras jornada, en la que un ejercicio desviado del poder privado afecta la verdad material en un registro privado de suma importancia."}, {"fundamento": "6.35", "texto": "Es imperativo recalcar que las instancias del sistema responsables de la tramitación del procedimiento administrativo sancionador deben garantizar que la motivación comprenda todas las alegaciones de los admin
