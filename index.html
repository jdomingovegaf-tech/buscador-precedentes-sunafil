  /* Marca personal (mi-marca/marca.md): lienzo blanco, tinta #212120, acento navy #243C54, dorado #B48444 */

    --lienzo: #FFFFFF;

    margin: 0; background: var(--lienzo); color: var(--tinta);

  .arco { display: block; width: 100%; height: 26px; margin-top: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 40px; }

  .tab {
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--tinta-suave);
    padding: 10px 16px; cursor: pointer; font: 600 1rem var(--texto); margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--acento); border-bottom-color: var(--dorado); }
  .tab:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--acento); outline-offset: 2px;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 14px; font-size: .92rem; color: var(--tinta-suave); }

    display: flex; flex-direction: column; gap: 6px; min-height: 96px;

  .node:hover { border-color: var(--dorado); border-top-color: var(--dorado); }

  a.pdf {

  mark { background: var(--resalte); color: inherit; border-radius: 2px; padding: 0 2px; }
  .searchbox { display: flex; gap: 8px; flex-wrap: wrap; }

  footer {

  footer .firma { font: 600 1.1rem var(--titulo); color: var(--acento); margin: 0; }

  @media (max-width: 520px) {

<script>
const DATOS = {"temas_generales": ["Procedimiento sancionador y principios", "Función inspectiva y medidas inspectivas", "Tipificación de infracciones (RLGIT)", "Seguridad y salud en el trabajo", "Relación de trabajo y derechos laborales", "Libertad sindical y negociación colectiva"], "contador": {"goatcounter": "precedentes-sunafil", "nota": "Código de su cuenta en goatcounter.com (solo letras, números y guiones). Dejar vacío = sin contador."}, "precedentes": [{"id": "2021-001", "anio": 2021, "numero": "001-2021", "tipo": "Precedente", "titulo": "Actos que dificultan la labor inspectiva, actas de infracción, jornada máxima minera y COVID-19", "criterio": "Reúne criterios sobre los actos que impiden o dificultan la labor inspectiva (fund. 9), la motivación de las actas de infracción (fund. 15 y 16), el test de protección de la jornada máxima en la minería (fund. 23) y la actuación inspectiva durante las medidas por COVID-19 (fund. 24 y 25).", "fundamentos": "9, 15, 16, 23, 24 y 25", "palabras": ["obstrucción", "labor inspectiva", "acta de infracción", "motivación", "jornada máxima", "minería", "COVID-19", "covid", "pandemia", "test de protección"], "temas": [["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Obstrucción a la labor inspectiva y actas de infracción"], ["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Jornada máxima"]], "archivo": "pdf/2021-001.pdf", "archivo_nombre": "Resolucion-001-2021-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "9", "texto": "Por consiguiente, en tanto que el ordenamiento jurídico no disponga cosa distinta, los actos o hechos que impiden o dificulten la labor inspectiva y que se consignan en el acta de infracción, constituyen infracciones que no tienen una naturaleza secundaria, adjunta ni dependiente, respecto de posibles infracciones ocurridas y detectadas en la visita inspectiva referentes a aspectos sustantivos objeto de control por la inspección del trabajo. B. Sobre la demora en la respuesta a un requerimiento de información efectuado por el inspector de trabajo y su subsunción en las normas sancionadoras contempladas en el art. 45.2 o en el 46.3 del Reglamento de la Ley General de Inspección del Trabajo, según las circunstancias."}, {"fundamento": "15", "texto": "De esta manera, en la formulación de actas de infracción y en su calificación posterior, deberá observarse que, cuando la fiscalización pueda proseguir desplegando sus funciones, a pesar del comportamiento del inspeccionado que haya perturbado o retrasado la investigación, deberá imputarse la infracción prevista en el artículo 45.2 del RLGIT. En cambio, cuando la demora del sujeto inspeccionado frustre la fiscalización, la tipificación invocable será la del artículo 46.3 del RLGIT."}, {"fundamento": "16", "texto": "Para la aplicación de este criterio, siempre será determinante el examen de la motivación que consta en el Acta de Infracción, que debe ser no sólo puntual y concisa, sino también suficiente, para poder concluir que la conducta del administrado constituye una falta al deber de colaboración de acuerdo al artículo 45.2 del RLGIT, o al artículo 46.3 del RLGIT, según se haya acreditado en el procedimiento. C. Sobre las jornadas acumulativas y el bloque de legalidad aplicable respecto de acuerdos de excepción durante la pandemia de la Covid-19."}, {"fundamento": "23", "texto": "En consecuencia, como ya ha sido señalado por este Tribunal, en nuestro ordenamiento jurídico el papel del test de protección de la jornada máxima de trabajo minero elaborado por la jurisprudencia constitucional se encuentra vigente. Sin embargo, su aplicación en la situación de pandemia, que afecta al Perú y al mundo, debe realizarse teniendo en cuenta que se dictaron medidas gubernamentales extraordinarias para detener la propagación del virus, que tuvieron -y tienen- un gran impacto en las relaciones laborales debido, entre otros motivos, a las inmovilizaciones ciudadanas y restricciones en el transporte público y privado. Por tanto, fue necesario adoptar medidas excepcionales para que las empresas pudieran realizar sus actividades, evitando los riesgos del contagio y, a la vez, respetando el derecho al descanso de los trabajadores. En este orden de ideas, el Tribunal entiende que esas medidas sólo son aceptables en el caso que hayan sido los actores sociales -empleadores y trabajadores- quienes hayan pactado la extensión excepcional de la jornada de trabajo en forma temporal. Para la validez del acuerdo es necesario que los trabajadores hayan sido representados por uno o más sindicatos, que en su conjunto representen a la mayoría de los que se vean afectados por esas medidas. Será ésta la garantía de que se acordarán los tiempos de trabajo y de descanso de acuerdo a las circunstancias concretas de cada centro de trabajo y de cada trabajador involucrado, puesto que podrán vigilar directamente el cumplimiento de los acuerdos. Por tanto, no cabe que la autoridad administrativa de trabajo se sustituya en la autonomía colectiva, salvo que se denunciase que estos acuerdos ya cumplieron su cometido o el plazo acordado o que estuvieran generando daños a la salud mental o física, al descanso o alimentación de los trabajadores, que deban ser investigados y, de proceder, sancionados."}, {"fundamento": "24", "texto": "Por lo que, a juicio de este Tribunal entre las medidas adoptadas frente al riesgo de contagio por la COVID-19, la modificación convencional de la jornada de trabajo acumulativa, por encima del máximo contemplado en la Sentencia del Tribunal Constitucional y su resolución aclaratoria, será legítima si observa los lineamientos de ese precedente, con las precisiones detalladas en el presente acuerdo de Sala Plena del Tribunal de la SUNAFIL., que se detallan a continuación 2 OIT (2018). Estudio General relativo a los instrumentos sobre el tiempo de trabajo. Informe de la Comisión de Expertos en Aplicación de Convenios y Recomendaciones. Ginebra: OIT. Disponible en: https://www.ilo.org/ wcmsp5/groups/public/---ed_norm/---relconf/documents/meetingdocument/ wcms_618490.pdf (Constitucionales, Judiciales y Administrativos)"}, {"fundamento": "25", "texto": "Durante el contexto de las medidas de restricción a que de lugar la prevención del contagio por COVID-19, el Sistema de Inspección del Trabajo deberá analizar casuísticamente la concurrencia de los siguientes elementos, a fin de establecer si la modificación convencional de la jornada de trabajo acumulativa es legítima: a. El acuerdo deberá ser pactado con un sindicato que esté acreditado como organización representativa de la mayoría de los trabajadores afectados por la modificación; b. El acuerdo correspondiente deberá ser adoptado por un lapso determinado, siendo esta provisionalidad objeto del control preferente por los propios sujetos colectivos; c. Se deberá considerar la naturaleza y características del centro de trabajo, con relación a sus elementos (lejanía respecto a lugares de residencia habitual de los trabajadores, riesgos existentes en dicho centro, entre otros); La medida se deberá adoptar con sustento de seguridad y salud en el trabajo y articularse con ellas, con la validación de los órganos correspondientes en materia de prevención de riesgos y se deberá desplegar mecanismos compensatorios al desgaste físico y emocional. En este punto, deberá tomarse en cuenta las orientaciones del test de protección de la jornada máxima de trabajo para los trabajadores mineros de la resolución aclaratoria del Tribunal Constitucional, en el fundamento 15, recogida en el punto 19 del presente acuerdo de Sala Plena. DECISIÓN 1. La Sala Plena del Tribunal de Fiscalización Laboral, por unanimidad, considera que los criterios contenidos en los numerales 9, 15, 16, 23, 24 y 25 del presente Acuerdo Plenario ameritan ser declaradas como precedente de observancia obligatoria para todas las entidades conformantes del Sistema de Inspección del Trabajo. 2. En atención a lo expuesto, la Sala Plena del Tribunal de Fiscalización Laboral, de conformidad con lo dispuesto CONTACTO COMERCIAL en el último párrafo del artículo 2 del Reglamento del Tribunal de Fiscalización Laboral respecto a la emisión de precedentes administrativos de observancia obligatoria;"}]}, {"id": "2021-002", "anio": 2021, "numero": "002-2021", "tipo": "Precedente (Acuerdo Plenario)", "titulo": "Trabajo infantil, razonabilidad de la multa, facultades de requerimiento y culpabilidad en contexto COVID-19", "criterio": "Precisa que las sanciones del artículo 25.7 del RLGIT se reservan para las peores formas de trabajo infantil (fund. 7 a 9), exige razonabilidad en la determinación de la multa (fund. 8), reconoce las facultades de requerimiento de la inspección (fund. 19) y fija criterios de culpabilidad para situaciones especiales, incluido el contexto COVID-19 (fund. 26 a 41).", "fundamentos": "7, 8, 9, 14, 15, 16, 19, 23, 26, 27, 28, 33, 34, 35, 36, 39, 40 y 41", "palabras": ["trabajo infantil", "menores", "25.7", "multa", "razonabilidad", "culpabilidad", "COVID-19", "covid", "requerimiento", "entidades públicas"], "temas": [["Tipificación de infracciones (RLGIT)", "Relaciones laborales (art. 25 RLGIT)", "Trabajo infantil (25.7)"], ["Procedimiento sancionador y principios", "Sanciones", "Razonabilidad y exceso de punición"]], "archivo": "pdf/2021-002.pdf", "archivo_nombre": "Resolucion-002-2021-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "7", "texto": "Así, el artículo 25.7 del RLGIT prevé la tipificación de las faltas contra las normas relativas al trabajo de menores de edad, incluyendo, tanto a las infracciones comunes como a las peores formas de trabajo infantil, atribuyéndoles la misma consecuencia punitiva, esto es, una tabla de multas agravada (artículo 48.1-D). No obstante, a consideración de este Tribunal, esta equiparación resulta ajena al principio de razonabilidad y a la correcta aplicación del principio de tipicidad en la determinación de la conducta reprochada."}, {"fundamento": "8", "texto": "Entonces, en aplicación del principio de razonabilidad, resulta incompatible que sea inelegible el llevar a los niveles de multa máximos (50, 100 o 200 UIT’s, según el tipo de empleador) a incumplimientos que recaigan en faltas formales, por lo que, a consideración del Tribunal de Fiscalización Laboral, dichas sanciones no podrán ser ejecutadas por constituir un supuesto de exceso de punición, criterio adoptado anteriormente en la Resolución N° 169-2021-SUNAFIL/TFL-Primera Sala. Las faltas formales referidas al procedimiento de autorización ante la Autoridad Administrativa de Trabajo, deberán ser apreciadas conforme a los elementos concurrentes de cada caso, como son la disponibilidad de una Autoridad Administrativa con competencias para autorizar el trabajo infantil, el comportamiento diligente del propio imputado para evitar el incumplimiento o, incluso, las situaciones límite como la reducida cantidad de días faltantes para el cumplimiento de la mayoría de edad del trabajador que es menor de 18 años."}, {"fundamento": "9", "texto": "En ese sentido, las sanciones previstas en el artículo 25.7 del RLGIT se reservarán para las peores formas de trabajo infantil, conforme con el Convenio núm. 182 de la OIT, así como para las afectaciones de los derechos sustantivos de los menores de edad, conforme la legislación nacional. b) Sobre la antigüedad como criterio para establecer diferencias salariales."}, {"fundamento": "14", "texto": "Este Tribunal, habiendo examinado varios casos, tales como las Resoluciones N° 103-2021, 269-2021, 2722021 y 337-2021 SUNAFIL/TFL-Primera Sala, considera que, por vía unilateral o por convenio colectivo de trabajo, pueden establecerse diferencias salariales entre trabajadores pertenecientes a una misma categoría a partir de la antigüedad en el puesto de trabajo, entre otros criterios objetivos, algunos de los cuales son mencionados en el artículo 6 del Reglamento de la Ley N° 30709. Aunado a ello, cabe señalar que el reconocimiento de la trayectoria laboral de los trabajadores no constituye un acto de discriminación laboral, conforme se ha determinado en la Casación Laboral N° 6783-2018-Lima Este, en su fundamento jurídico décimo quinto."}, {"fundamento": "15", "texto": "En consecuencia, para la determinación de los supuestos de antigüedad, la Inspección del Trabajo deberá establecer las trayectorias de los trabajadores, cuando sea la base objetiva del trato salarial distinto entre dos personas en situación comparable. Por tanto, los pagos de remuneraciones que establezcan distinciones basadas en la antigüedad, pueden ser objeto de análisis de la Inspección del Trabajo, a fin de determinar si dichas distinciones generan alguna situación de discriminación indirecta, especialmente, en el caso de las mujeres, quienes podrían sufrir un número mayor de interrupciones en su récord laboral para atender responsabilidades familiares. En tales casos, la determinación del comportamiento infractor deberá satisfacer un estándar de motivación, que explique el nexo causal y la culpabilidad del agente que comete el acto."}, {"fundamento": "16", "texto": "Adicionalmente, es preciso señalar que no serán compatibles con el estándar exigible de motivación y el respeto del principio de licitud, el hecho que las imputaciones de responsabilidad administrativa laboral se basen en razonamientos presuntivos sobre el acto de discriminación salarial. c) Sobre el soporte o la modalidad de entrega de documentación laboral objeto de una medida de requerimiento de información."}, {"fundamento": "19", "texto": "Por tanto, teniendo en cuenta las amplias facultades que el ordenamiento jurídico reconoce a los fiscalizadores, la inspección del trabajo podrá requerir al sujeto inspeccionado, mediante una medida de requerimiento, la presentación de información en formato físico o digital. No existiendo una predeterminación obligatoria sobre la forma o modalidad de entrega, por lo que el requerimiento de información, bajo uno u otro soporte, deberá regirse por los principios de razonabilidad y buena fe procedimental."}, {"fundamento": "23", "texto": "Por consiguiente, cuando el inspector requiera la exhibición de información bajo una de las modalidades mencionadas y se le alcance documentación bajo un soporte distinto al requerido, será de cargo del inspector el justificar —de rechazar tal exhibición— porque no resulta satisfactoria para la práctica de la inspección del trabajo. Asimismo, el administrado deberá expresar las razones por las cuales 3 presenta la documentación en formato distinto al requerido por el inspector originalmente. En tal supuesto, el inspector actuante deberá explicar las razones operativas por las que el medio elegido por el sujeto inspeccionado, en atención a lo solicitado en la medida de requerimiento de información, no resulta idóneo o, cuando así ocurra, resulte un acto de mala fe procedimental. d) Sobre la inexigibilidad de la audiencia oral ante la instancia de revisión."}, {"fundamento": "26", "texto": "Al respecto, el Tribunal Constitucional en la sentencia recaída en el expediente Nº 01147-2012-PA/TC, ha sido enfático al considerar que no cualquier restricción del uso de medios legales de defensa supone un agravio al derecho constitucional de defensa ni, mucho menos, podría suponer el dejar al administrado en estado de indefensión. De esa forma, el informe oral ante el órgano que resuelve el recurso de revisión no es un componente indispensable para la eficacia real del derecho de defensa cuando los argumentos de la parte interesada ya se hicieron constar por escrito como sustento de su pretensión impugnatoria."}, {"fundamento": "27", "texto": "En el expediente administrativo que se eleva ante este Tribunal, deben constar (o deberían constar) los argumentos de defensa del administrado y aquellos que fundamentan la imputación efectuada por la Administración. Excepcionalmente, el Tribunal de Fiscalización Laboral puede ejercer la facultad descrita en el artículo 18.3 de su Reglamento, aprobado mediante el Decreto Supremo Nº 004-2017-TR, y requerir al impugnante la presentación de informaciones complementarias. Cabe precisar que, el trámite del recurso de revisión no da lugar a un proceso de conocimiento con estaciones probatorias ni audiencias. Por consiguiente, en situaciones ordinarias, el Tribunal de Fiscalización Laboral resolverá en base a los actuados en el expediente."}, {"fundamento": "28", "texto": "Por tanto, si bien los administrados pueden solicitar una audiencia ante las Salas del Tribunal de Fiscalización Laboral, dicho elemento no es indispensable ni necesario para la ejecución de las competencias que el ordenamiento jurídico le ha asignado a la instancia de revisión."}, {"fundamento": "33", "texto": "En consecuencia, conforme con el principio de culpabilidad, los empleadores que acrediten fehacientemente situaciones especiales por las cuales su disponibilidad patrimonial se encuentre supeditada a la aprobación, autorización o desafectación de terceras partes, exceptuando las situaciones de fraude, no podrán ser objeto de medidas de requerimiento a fin de que efectúen el desembolso de pagos debidos."}, {"fundamento": "34", "texto": "En tales circunstancias, pudiendo la inspección del trabajo determinar y proponer la sanción por el incumplimiento de normas laborales, no podrá añadirse una medida de requerimiento de pago, por existir una situación manifiesta que impide al obligado cumplir con dicha medida inspectiva. Por ende, el emitir una medida inspectiva de requerimiento, teniéndose conocimiento de la imposibilidad de su cumplimiento por parte del inspeccionado, desnaturaliza la finalidad de la misma y vulnera el principio de culpabilidad."}, {"fundamento": "35", "texto": "Son ejemplos de esta afectación patrimonial los embargos trabados por la Autoridad Tributaria contra la totalidad del patrimonio del empleador o una parte sustancial que le impida afrontar los gastos operativos en un periodo determinado, o la intervención de una administración concursal o situación de liquidación que impida al sujeto obligado de hacerse de obligaciones económicas adicionales."}, {"fundamento": "36", "texto": "No son ejemplos de la afectación patrimonial a la que se refiere este criterio la simple pérdida económica en los registros financieros, contables y/o económicos de la empresa, y la existencia de meras acreencias con otras personas naturales o jurídicas (incluidas entidades financieras). f) Sobre el principio de culpabilidad y disponibilidad presupuestal de entidades públicas"}, {"fundamento": "39", "texto": "Por tanto, las entidades públicas que acrediten, a través de documentos de gestión interna y, concurrentemente, de trámite ante otras entidades que resolvieran decisivamente sobre su asignación presupuestal, autorización de gasto y ejecución, podrán verse exceptuadas de la aplicación de la sanción administrativa originada por el incumplimiento de una norma laboral de contenido económico si, conforme con el numeral 1 del artículo 257 del TUO de la LPAG, se apreciase que han agotado todas las gestiones razonablemente exigibles para poder efectuar la provisión y/o el gasto necesario para cumplir con las obligaciones laborales."}, {"fundamento": "40", "texto": "En ese sentido, los órganos del Sistema de Inspección del Trabajo deberán evaluar el comportamiento del administrado (en este caso, entidad pública) conforme al principio de culpabilidad, estableciendo si, durante la etapa de la fiscalización, se ha proporcionado al inspector de trabajo medios probatorios adecuados respecto de las circunstancias mencionadas, en cumplimiento del deber de colaboración."}, {"fundamento": "41", "texto": "Finalmente, esta eximente se deberá apreciar de forma ponderada por la inspección de trabajo, cuando en el transcurso del tiempo, la entidad que se encontrase en la situación exculpante antes descrita, no acredite el impulso, seguimiento o gestión para la aprobación de las autorizaciones aludidas en los párrafos anteriores. III. DECISIÓN 1. La Sala Plena del Tribunal de Fiscalización Laboral, por unanimidad, considera que los criterios contenidos en los numerales 7, 8, 9, 14, 15, 16, 19, 23, 26, 27, 28, 33, 34, 35, 36, 39, 40 y 41 del presente Acuerdo Plenario ameritan ser declaradas como precedente de observancia obligatoria para todas las entidades conformantes del Sistema de Inspección del Trabajo. 2. Conforme a lo expuesto, la Sala Plena del Tribunal de Fiscalización Laboral, de conformidad con lo dispuesto en el último párrafo del artículo 2 del Reglamento del Tribunal de Fiscalización Laboral, respecto a la emisión de precedentes administrativos de observancia obligatoria;"}]}, {"id": "2022-001", "anio": 2022, "numero": "001-2022", "tipo": "Precedente", "titulo": "Obstrucción a la labor inspectiva en las visitas a centros o lugares de trabajo", "criterio": "Criterio referido a la obstrucción a la labor inspectiva en las visitas a los centros o lugares de trabajo (fund. 6.13 a 6.16).", "fundamentos": "6.13, 6.14, 6.15 y 6.16", "palabras": ["obstrucción", "visita inspectiva", "centro de trabajo", "labor inspectiva", "impedir la inspección"], "temas": [["Función inspectiva y medidas inspectivas", "Actuaciones inspectivas", "Obstrucción a la labor inspectiva y actas de infracción"]], "archivo": "pdf/2022-001.pdf", "archivo_nombre": "Resolucion-001-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.13", "texto": "En consecuencia, es razonable presumir que, como responsables de velar por el cumplimiento de las normas de seguridad y salud en el trabajo en las relaciones de trabajo, los inspectores pueden establecer los riesgos a los que se enfrentarán en su actividad fiscalizadora. Por la misma razón, pueden determinar -entre otras cosas- la necesidad de recibir inducciones adicionales para realizar la inspección en un centro de trabajo determinado o, si requieren, del acompañamiento de algún personal de la inspeccionada, así como establecer si los equipos de protección personal que portan son los adecuados para su labor fiscalizadora. Consecuentemente, en caso de que una inspeccionada asegure que la inspección implica exponerse a ciertos riesgos, los inspectores deben informarle, bajo su responsabilidad, sobre su capacitación en seguridad y salud en el trabajo en esos aspectos. También podrán solicitar los implementos adicionales, exigidos por la inspeccionada para realizar la inspección."}, {"fundamento": "6.14", "texto": "No obstante, en casos como el presente, pudiera ocurrir que el inspector y los representantes de la inspeccionada discrepen sobre si los inspectores cuentan con la preparación adecuada y suficiente para ingresar a una zona específica del centro de trabajo. En tal situación, es posible que se produzcan algunos supuestos que motiven responsabilidad administrativa del empleador. El primero es que, por decisión unilateral o reglamentación paritaria, el inspeccionado se niegue a dar las facilidades para que el inspector ingrese a la zona de interés para la fiscalización. El segundo, que, tras escuchar las alegaciones de los representantes del empleador, el inspector se retire, posponiendo la actuación inspectiva. En el primer supuesto, la sanción por obstrucción a la labor inspectiva resultará procedente si se constata, del relato de los hechos, la infracción laboral sancionada en el numeral 46.1 del artículo 46 del RLGIT. En el segundo supuesto, la sanción por obstrucción a la labor inspectiva resultará procedente si, en la continuidad de las actuaciones inspectivas, se aprecia que no existió justificación real para la negativa de ingreso, siendo esto determinable a través de la acreditación fehaciente de las razones que permiten establecer un riesgo inminente o actual que, documentadamente, exista en el lugar en el que se denegó el ingreso al inspector de trabajo."}, {"fundamento": "6.15", "texto": "Tal como hemos manifestado anteriormente, la LGIT faculta a los inspectores a entrar “libremente a cualquier hora del día o de la noche, y sin previo aviso, en todo centro de trabajo, establecimiento o lugar sujeto a inspección y a permanecer en el mismo”11. En en todos los casos, las visitas deben realizarse observando el principio de razonabilidad, este deber es especialmente importante cuando se realicen en horario nocturno. Este tipo de fiscalización puede originarse en una denuncia o en operativos de fiscalización que la autoridad considere necesario realizar."}, {"fundamento": "6.16", "texto": "Dejando a salvo los derechos de los inspeccionados, corresponde al inspector decidir si requiere o no compañía de un tercero, sea cualquier representante del empleador o del órgano paritario de seguridad y salud en el trabajo, tal como lo establece la LGIT, en el numeral 2 del artículo 512. Reafirma este criterio lo dispuesto en el Reglamento de la LGIT, aprobado por Decreto Supremo Nº 019-200-TR, numeral 13.2 del artículo 13, el cual establece que las visitas a los centros o lugares de trabajo “se realizan en presencia del sujeto inspeccionado o su representante, así como de los trabajadores, sus representantes o de las organizaciones sindicales que les representen”, y añade que, “de no encontrarse en el centro o lugar de trabajo, las actuaciones se realizan sin la presencia de los mismos, no afectando dicha circunstancia el resultado y validez de la investigación”."}]}, {"id": "2022-002", "anio": 2022, "numero": "002-2022", "tipo": "Precedente", "titulo": "Incumplimiento de las medidas inspectivas de requerimiento", "criterio": "Criterio referido al incumplimiento de las medidas inspectivas de requerimiento (fund. 6.8 a 6.10).", "fundamentos": "6.8, 6.9 y 6.10", "palabras": ["medida de requerimiento", "incumplimiento", "requerimiento", "medida inspectiva"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Incumplimiento de la medida"]], "archivo": "pdf/2022-002.pdf", "archivo_nombre": "Resolucion-002-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.8", "texto": "Así, los expedientes sancionadores que se tramitan en el Sistema de Inspección del Trabajo no son, sin embargo, unos que permitan distinguir imputaciones que solamente contengan casos “muy graves”, “graves” o bien “leves”, siendo habitual que en los casos sometidos a este Tribunal se encuentren imputaciones que contemplen infracciones calificadas normativamente como “muy graves” y alguna o algunas más de distinto grado. Ante este tipo de plataformas impugnatorias, el Tribunal de Fiscalización Laboral se encuentra obligado a distinguir lo que es materia de su estricta competencia de aquello que no lo es, conforme con la normativa glosada."}, {"fundamento": "6.9", "texto": "En ciertos casos —como el que es objeto de la presente resolución—el recurso de revisión propone el análisis de infracciones a la labor inspectiva consistentes en el incumplimiento de la medida de requerimiento contenidas en el numeral 46.7 del artículo 46 del RLGIT10, pero las materias objeto de la medida de requerimiento son calificadas por la normativa como faltas “graves” o “leves”, lo que deposita a tales causas fuera de la competencia material de este Tribunal."}, {"fundamento": "6.10", "texto": "De esta forma, la evaluación de los recursos de revisión interpuestos contra sanciones administrativas por inejecución de medidas de requerimiento deberá circunscribirse a un análisis estrictamente referido a la proporcionalidad, razonabilidad y legalidad de tales medidas, sin invadir una competencia administrativa vedada, como son las infracciones calificadas como graves y leves, que en expedientes como el presente, han adquirido firmeza con la expedición (y notificación) de la resolución de segunda instancia."}]}, {"id": "2022-003", "anio": 2022, "numero": "003-2022", "tipo": "Precedente", "titulo": "Recurso de revisión que no se sustenta en inaplicación o errónea interpretación de normas laborales", "criterio": "Criterio referido a la interposición del recurso de revisión que no se sustenta en la inaplicación, aplicación o interpretación errónea de las normas de derecho laboral (fund. 6.17 a 6.19).", "fundamentos": "6.17, 6.18 y 6.19", "palabras": ["recurso de revisión", "causales", "inaplicación", "interpretación errónea", "apartamiento inmotivado", "improcedente"], "temas": [["Procedimiento sancionador y principios", "Recurso de revisión", "Causales y fundamentación del recurso"]], "archivo": "pdf/2022-003.pdf", "archivo_nombre": "Resolucion-003-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.17", "texto": "Sobre la base de lo previsto en el literal a) del artículo 16 y el inciso 18.1 del artículo 18 del Reglamento (Constitucionales, Judiciales y Administrativos) del Tribunal de Fiscalización Laboral (Decreto Supremo Nº 004-2017-TR), tras el control de admisibilidad del recurso de revisión interpuesto, a cargo de la autoridad emisora de la decisión impugnada, este órgano de revisión tiene el deber de efectuar el control de procedencia del recurso. Así, se declarará la improcedencia del recurso de revisión en los siguientes supuestos: i) Cuando el acto impugnado no corresponda a resoluciones de segunda instancia que se pronuncian sobre la imposición de sanciones; ii) Cuando la infracción materia de sanción que se impugna, no esté tipificada como muy grave en el RLGIT; o iii) Cuando el recurso de revisión no se sustente en la inaplicación, o aplicación o interpretación errónea de las normas de derecho laboral, o en el apartamiento inmotivado de los precedentes de observancia obligatoria emitidos por este Tribunal."}, {"fundamento": "6.18", "texto": "Lo anterior exige al administrado una mayor rigurosidad en la formulación de sus escritos de revisión, en la medida que, al tratarse de un recurso extraordinario, para que los fundamentos contenidos en este puedan ser conocidos y evaluados por el Tribunal, no basta que la resolución recurrida contenga la imposición de sanciones por infracciones muy graves, sino que su impugnación debe ceñirse estrictamente a los presupuestos básicos establecidos en el artículo 14 del Reglamento del Tribunal, esto es: 1) Debe cuestionar al menos una infracción tipificada y calificada como muy grave, en el RLGIT, o en caso de omisión, el razonamiento empleado es suficiente para deducir ello, y; 2) Este cuestionamiento debe sustentarse necesariamente, en la inaplicación, o aplicación o interpretación errónea de las normas que rigen el derecho laboral, y/o en el apartamiento inmotivado de algún precedente de observancia obligatoria emitido por este Tribunal, que haya incidido directa o indirectamente, en la determinación de las infracciones."}, {"fundamento": "6.19", "texto": "Y es que, en ciertos casos, se aprecia la existencia de recursos de revisión donde, impugnándose una resolución que confirma la imposición de una sanción económica por la comisión de alguna infracción tipificada como muy grave en el RLGIT; no se cuestiona expresamente dicha infracción de forma directa o siquiera indirecta (cuando no se plantea algún razonamiento que pueda permitir deducir ello). Tal situación implica que tales recursos promueven asuntos fuera de la competencia material de este Tribunal, debiendo éste órgano colegiado declarar la improcedencia, conforme a la normativa que rige su actuación. Sobre el cumplimiento de requisitos en el presente recurso de revisión"}]}, {"id": "2022-004", "anio": 2022, "numero": "004-2022", "tipo": "Precedente", "titulo": "Jornadas de trabajo acumulativas", "criterio": "Criterio referido a las jornadas de trabajo acumulativas (fund. 6.21 a 6.23).", "fundamentos": "6.21, 6.22 y 6.23", "palabras": ["jornada acumulativa", "jornada", "tiempo de trabajo", "acumulativa"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Jornadas acumulativas"]], "archivo": "pdf/2022-004.pdf", "archivo_nombre": "Resolucion-004-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.21", "texto": "En esa línea, una medida como la que es objeto de análisis termina incidiendo en la jornada de trabajo minero. La implementación unilateral del empleador de estos centros de pernocte tiene un efecto peyorativo considerable para quien(es) no consintiesen con observar esta medida, prevista en el protocolo de Prevención y Control del Covid-19 adoptado por la impugnante. Esta afectación consiste en la obligación de permanecer en cuarentena dentro de tales instalaciones. Así, pese a haber culminado su turno laboral, los trabajadores que no quisieran acatar la obligación de permanecer en los centros de pernocte por 7 días serían objeto de una licencia con goce de haberes con posibilidad de recuperarse el tiempo de trabajo respectivo. Esto arroja tres problemas relevantes de validez, siendo cada uno de ellos suficiente para generar responsabilidad administrativa laboral conforme a lo examinado en el caso con respecto a la dignidad de los trabajadores objeto de la medida:"}, {"fundamento": "6.22", "texto": "Por ello, la hostilidad en el caso está dada porque, conforme a los actuados del expediente inspectivo, el efecto de la medida fue suficientemente eficaz para mellar los derechos fundamentales de los trabajadores y fue tomada de forma unilateral, lo que supone una forma radical de ius variandi, no tolerada por el ordenamiento. Así, tras su implementación, se ha registrado casos de trabajadores que pernoctaron 52 días seguidos, incluyendo los del turno de trabajo y los de descanso, lo que aclara el efecto que ha tenido sobre los trabajadores la represalia consistente en activar la compensación de la licencia con goce de haberes por no acatar la obligación de permanecer en el lugar de pernocte, en aislamiento dispuesto unilateralmente."}, {"fundamento": "6.23", "texto": "Adicionalmente, conviene precisar que las medidas adoptadas frente al riesgo de contagio por la COVID-19, por parte de los empleadores deben ser adoptadas bajo parámetros de control amplio, tanto de los propios agentes privados (el propio empleador, desde su deber de prevención; los trabajadores, conforme al principio de participación) como del Estado, a través de la fiscalización laboral, considerando, entre otros: - El cumplimiento del test de protección de la jornada máxima de trabajo para los trabajadores mineros sentada por la resolución aclaratoria de la Sentencia del Tribunal Constitucional en la Sentencia de fecha 17 de abril de 2006, recaída en el Expediente N° 4635-2004-AA/TC y lo contemplado en la Resolución de Sala Plena Nº 001-2021-SUNAFIL/TFL (fundamentos 23, 24 y 25). - La duración de la emergencia sanitaria decretada por el Estado peruano, en tanto constituye una situación excepcional y conforme al nivel de restricciones generales o específicos que sean relevantes para el caso, conforme al 11 marco legal y las condiciones dadas en el ámbito geográfico y socioeconómico en el que las medidas adoptadas se produzcan."}]}, {"id": "2022-005", "anio": 2022, "numero": "005-2022", "tipo": "Precedente", "titulo": "Tipificación de los numerales 28.10 y 28.11 del RLGIT y concurso de infracciones", "criterio": "Criterio referido a la tipificación de las infracciones reguladas en los numerales 28.10 y 28.11 del RLGIT, en materia de gestión interna de SST, registro de accidentes e incidentes (fund. 6.15 y 6.18 a 6.21), e incluye el concurso de infracciones (fund. 6).", "fundamentos": "6.15, 6.18, 6.19, 6.20 y 6.21", "palabras": ["28.10", "28.11", "gestión interna", "registro de accidentes", "incidentes", "concurso de infracciones", "SST"], "temas": [["Seguridad y salud en el trabajo", "Tipificación en SST (arts. 27 y 28 RLGIT)", "Gestión interna de SST (28.10 y 28.11)"], ["Procedimiento sancionador y principios", "Concurso y continuidad de infracciones", "Concurso de infracciones"]], "archivo": "pdf/2022-005.pdf", "archivo_nombre": "Resolucion-005-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.15", "texto": "En ese entendido, debemos señalar que el tipo de análisis de los accidentes de trabajo puede ser multicausal y, en esa medida, es posible que la imputación por la infracción contemplada en los numerales 28.10 y 28.11 del artículo 28 del RLGIT obedezca a más de una subsunción plausible, si el inspector actuante da cuenta del nexo de causalidad entre la falta determinada y el tipo sancionador de dichos artículos. De esa forma, dos o más incumplimientos pueden ser plenamente aptos de producir el hecho reprochado (el accidente de trabajo) y la subsunción en cualquiera de los citados numerales del artículo 28 del RLGIT es autorizada por la gravedad de la afectación al interés público al que la sanción atiende: la protección de la salud y la vida de los trabajadores."}, {"fundamento": "6.18", "texto": "De esta forma, una investigación de la inspección del trabajo puede bien determinar un árbol de causas, esto es, “todos los antecedentes recopilados que han dado lugar al accidente, así como los vínculos lógicos y cronológicos que los relacionan; se trata de una representación de la red de antecedentes que han provocado directa o indirectamente la lesión”.16 En el examen de la inspección del trabajo —que debe trasladarse al acta de infracción— los órganos del procedimiento administrativo sancionador deben ocuparse de establecer la suficiencia en la determinación de los nexos causales exigidos en los numerales 28.10 y 28.11 del artículo 28 del RLGIT, para así establecer si existe uno o más de un incumplimiento que sea suficientemente apto para convertirse en causa del accidente de trabajo y, por lo tanto, punible bajo el tipo sancionador correspondiente."}, {"fundamento": "6.19", "texto": "Como puede comprobarse, las citadas normas despliegan un reproche cualificado, cuando el comportamiento constitutivo de infracción tiene, además, un resultado dañoso determinado (“accidente de trabajo”). Esto afirma al elemento disuasivo de la sanción administrativa ante un hecho “que ocasiona” consecuencias especialmente graves dentro del sistema jurídico. De esta forma, si dos o más incumplimientos son causas suficientes del accidente de trabajo, podrían ser válidamente imputados de forma independiente a través de los numerales 28.10 o 28.11 del artículo 28 del RLGIT, según corresponda, si el inspector expresa los nexos de causalidad correspondientes."}, {"fundamento": "6.20", "texto": "Cabe señalar que, para la configuración de los tipos sancionadores previstos en los numerales 28.10 y 28.11 del artículo 28 del RLGIT —en tanto refieren a un resultado especialmente dañoso— se requiere de la concurrencia de los siguientes presupuestos: i) Para ambos supuestos: Que el incumplimiento a la normativa en seguridad y salud en el trabajo haya ocasionado el accidente de trabajo; y, ii) Para el supuesto establecido en el artículo 28.10 del artículo 28 del RLGIT: que como consecuencia de lo señalado en el literal i) se haya producido daños en el cuerpo o la salud del trabajo que requieran asistencia o descanso médico, conforme al certificado o informe médico legal. iii) Para el supuesto establecido en el artículo 28.11 del artículo 28 del RLGIT: que como consecuencia de lo señalado en el literal i) el accidente produzca el fallecimiento del trabajador."}, {"fundamento": "6.21", "texto": "Así, cuando se invoca alguna de estas normas sancionadoras, todas las premisas indicadas anteriormente deberían ser correctamente determinadas en el acta de infracción, con una expresión adecuada del nexo causal. En ese entendido, podemos establecer los siguientes criterios: i) El nexo causal es el elemento gravitante para determinar la responsabilidad del empleador en los tipos sancionadores previstos en los artículos 28.10 y 28.11; en ese sentido se entiende por nexo causal a la relación causal o causalidad entre la infracción cometida y el accidente sucedido, siendo el evento trágico consecuencia de la inobservancia o incumplimiento de la normativa laboral. ii) Respecto al examen del nexo causal, los tipos infractores materia de análisis, llevan a evaluar los actuados en la fiscalización a partir de la determinación del carácter causal de la infracción respecto a cada uno de los incumplimientos detectados en los que este factor causal se encuentre presente. Así, cada uno de los incumplimientos sancionados bajo los numerales 28.10 o 28.11 del artículo 28 del RLGIT, deben ser susceptibles de producir el accidente o contribuir a que este se desencadene, conforme con lo determinado en la fiscalización y conforme con las condiciones establecidas en ambos tipos normativos. De manera que, si la inobservancia de las normas de seguridad y salud en el trabajo ocasiona un accidente, esta podrá dar lugar a una o a más de una sanción, siendo analizadas de manera independiente cada una de ellas respecto de su carácter causal sobre el accidente ocurrido. Por tanto, corresponderá que, por cada vez donde ese juicio causal se vea satisfecho, se aplique una sanción."}]}, {"id": "2022-006", "anio": 2022, "numero": "006-2022", "tipo": "Precedente", "titulo": "Primacía de la realidad en la actuación de la autoridad administrativa", "criterio": "Criterio referido al principio de primacía de la realidad aplicado por la autoridad administrativa (fund. 6.22 a 6.24).", "fundamentos": "6.22, 6.23 y 6.24", "palabras": ["primacía de la realidad", "principio", "autoridad administrativa", "igualdad", "discriminación"], "temas": [["Procedimiento sancionador y principios", "Principios del procedimiento", "Primacía de la realidad"]], "archivo": "pdf/2022-006.pdf", "archivo_nombre": "Resolucion-006-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.22", "texto": "En tal sentido, el principio de primacía de realidad tiene la virtud de proporcionar al órgano administrativo, dentro de un procedimiento sancionador, una importante herramienta conceptual, orientada a superar formalidades con las que eventualmente se hubiere revestido un acto jurídico laboral para encontrar el trasfondo de la verdadera naturaleza de la relación laboral entre el sujeto inspeccionado y el trabajador o trabajadores afectados; descartando de esta manera las actitudes que en fraude a la ley hubieren podido consumarse, incluso con aceptación del trabajador."}, {"fundamento": "6.23", "texto": "Por lo anotado, en caso de discordancia entre los hechos constatados en la fiscalización y los documentos o acuerdos formales establecidos por el sujeto inspeccionado, debe darse preferencia a los primeros. Como se recuerda, el artículo 16 de la Ley Nº 28806, establece la presunción de certeza de los hechos constatados por los inspectores en las fiscalizaciones realizadas, por lo que la determinación de prevalencia de los hechos se sostiene en tal comprobación y en el hecho de que cualquier contraprueba que pudiera presentarse durante los descargos, al ser examinada, no desvirtúe la imputación."}, {"fundamento": "6.24", "texto": "Debe precisarse que la aplicación del principio de primacía de la realidad, por parte de la autoridad administrativa, debe estar debidamente motivado y sustentado en lo actuado en el procedimiento fiscalizador y en el procedimiento administrativo sancionador. En cada ámbito, se debe analizar si existe un correcto examen de los hechos y de su verificación; toda vez que la invocación a este principio debe estar justificada en la comprobación directa o indirecta de la infracción imputada."}]}, {"id": "2022-007", "anio": 2022, "numero": "007-2022", "tipo": "Precedente", "titulo": "Bloque de legalidad en la solicitud de suspensión perfecta de labores", "criterio": "Criterio referido al bloque de legalidad en las actuaciones de la autoridad administrativa sobre la solicitud de suspensión perfecta de labores (fund. 6.29 a 6.32).", "fundamentos": "6.29, 6.30, 6.31 y 6.32", "palabras": ["suspensión perfecta", "suspensión de labores", "bloque de legalidad", "legalidad"], "temas": [["Relación de trabajo y derechos laborales", "Suspensión perfecta de labores", "Bloque de legalidad en la solicitud de suspensión"]], "archivo": "pdf/2022-007.pdf", "archivo_nombre": "Resolucion-007-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.29", "texto": "En ese sentido, el bloque de legalidad aplicable a una suspensión perfecta invocada en el contexto de la emergencia sanitaria (contexto propio del expediente analizado), observa que: 1) El empleador, al solicitar la autorización para la ejecución de la suspensión perfecta de labores, debe comunicar la medida (y su sustento) a los trabajadores afectados, aplicándose el deber de fomento de negociación colectiva en esta etapa; 2) Esta decisión no puede significar una afectación de los derechos fundamentales de los trabajadores; 3) La competencia administrativa para autorizar la aplicación de la suspensión perfecta de labores en el contexto de la pandemia Covid-19, excepcionalmente activada, permite que el empleador no se encuentre obligado al pago de las remuneraciones, incluso antes de la aprobación de su solicitud; en cambio, en caso que la solicitud empresarial sea desaprobada, tendrá como consecuencia la obligación en el pago del salario de los trabajadores afectados, por el tiempo que la medida de la suspensión se haya prolongado; 4) Esta competencia administrativa para calificar la solicitud de suspensión perfecta de labores es exclusiva de la autoridad administrativa de trabajo, conforme con lo previsto en la legislación aplicable; 5) La inspección del trabajo coadyuva a la formación de la decisión administrativa, a cargo de la autoridad administrativa de trabajo, al determinar elementos fácticos relevantes sobre el fenómeno objeto de control; esto, sin perjuicio de las labores de supervisión que la fiscalización laboral podría ejecutar en forma simultánea o posterior, sobre aspectos distintos a la procedencia de la suspensión perfecta de labores resulta procedente o improcedente. 21 Decreto Supremo Nº 011-2020-TR Artículo 6.- Comunicación de la suspensión perfecta de labores a la Autoridad Administrativa de Trabajo 6.1 Tratándose de suspensiones perfectas de labores de carácter suprarregional o nacional, conforme a lo señalado en el Decreto Supremo Nº 017-2012-TR, Determinan dependencias que tramitarán y resolverán las solicitudes y reclamaciones que se inicien ante las Autoridades Administrativas de Trabajo, las comunicaciones por vía remota efectuadas por el empleador se realizan como máximo hasta el día siguiente de adoptada la suspensión, únicamente, a través de la plataforma virtual del Ministerio de Trabajo y Promoción del Empleo, la que valida los datos de cada trabajador con la información de la Planilla Electrónica, para el posterior trámite por parte de la Dirección General de Trabajo del referido Ministerio. 6.2 Tratándose de suspensiones perfectas de labores de carácter local o regional, conforme a lo señalado en el Decreto Supremo Nº 017-2012TR, Determinan dependencias que tramitarán y resolverán las solicitudes y reclamaciones que se inicien ante las Autoridades Administrativas de Trabajo, las comunicaciones por vía remota efectuadas por el empleador se realizan como máximo hasta el día siguiente de adoptada la suspensión, únicamente, a través de la plataforma virtual del Ministerio de Trabajo y Promoción del Empleo, la que valida los datos de cada trabajador con la información de la Planilla Electrónica, para el posterior trámite por parte de la Dirección de Prevención y Solución de Conflictos o quien haga sus veces en cada Dirección o Gerencia Regional de Trabajo y Promoción del Empleo. 22 7 6.3 Los empleadores que deseen acogerse al procedimiento de suspensión perfecta de labores deben comunicarlo previamente a los trabajadores afectados y a sus representantes elegidos, de existir, de manera física o utilizando los medios informáticos correspondientes. Efectuado ello, el empleador presenta la comunicación de suspensión perfecta de labores, por vía remota, a la Autoridad Administrativa de Trabajo, según el formato anexo al Decreto de Urgencia Nº 038-2020, pudiendo adjuntar, de ser el caso, cualquier documento que el empleador estime conveniente remitir a fin de respaldar su comunicación. 6.4 Al presentar su comunicación de inicio de suspensión perfecta de labores en la plataforma virtual del Ministerio de Trabajo y Promoción del Empleo, los empleadores señalan su dirección de correo electrónico, así como la de los trabajadores comprendidos y la de sus representantes, de ser el caso; a efecto que la Autoridad Administrativa de Trabajo proceda a notificar de las resoluciones e incidentes que se generen durante la tramitación del procedimiento. La veracidad de la información consignada en la plataforma virtual del Ministerio de Trabajo y Promoción del Empleo es responsabilidad del empleador recurrente 7.2 La Autoridad Inspectiva de Trabajo, en el marco de la verificación indicada en el numeral precedente, reporta lo hallado, que incluye lo siguiente: a) Información del empleador sobre la naturaleza de sus actividades o el nivel de afectación económica, según sea el caso, que sustente que no puede aplicar el trabajo remoto y otorgar licencia con goce de haber, de acuerdo con lo consignado por el empleador en la comunicación a la que hace referencia el numeral 3.2 del artículo 3 del Decreto de Urgencia Nº 038-2020. Para tal efecto, a fin de verificar lo dispuesto en el numeral 3.2.1 del artículo 3 de la presente norma, el empleador presenta copia de la declaración jurada presentada mediante el Formulario Nº 621-Declaraciones mensuales de IGV-Renta, obtenida a través del Portal SUNAT-Operaciones en Línea (SOL), que permita identificar lo reportado en la casilla 301 del referido formulario. En caso no se hubiera presentado el Formulario Nº 621-Declaraciones mensuales de IGV-Renta, por no haber vencido aún el plazo de presentación, el empleador debe calcular el monto que corresponde reportarse como “Ingreso Neto del mes” en la casilla 301 y acreditarlo con su registro de ventas, u otros libros contables que hagan sus veces. Una vez que el Formulario Nº 621-Declaraciones mensuales de IGV-Renta sea presentado ante la SUNAT, la copia debe ser remitida a la Autoridad Administrativa de Trabajo. b) Los formularios del PDT 601 - Planilla Electrónica (PLAME) con la información declarada sobre remuneraciones de los trabajadores del mes correspondiente, que haya sido empleada para el cálculo de los ratios previstos en el numeral 3.2.1 del artículo 3 de la presente norma. De no haberse presentado dicho PDT, por no haber vencido aún el plazo de presentación, el empleador alcanza la información de remuneraciones de los trabajadores declarados en T-Registro cuyo periodo laboral no indique fecha de fin al último día del mes correspondiente. Una vez que el PDT 601 - Planilla Electrónica (PLAME) sea presentado ante la SUNAT, la copia debe ser remitida a la Autoridad Administrativa de Trabajo. c) Información del empleador sobre el acceso y destino de los subsidios de origen público otorgados en el marco de la Emergencia Sanitaria. d) Verificación de que los trabajadores comprendidos en la suspensión perfecta de las labores efectivamente se mantengan inactivos, y que sus puestos de trabajo se encuentren desocupados e) De tratarse de una paralización parcial, se verifica si en otros puestos de trabajo persiste la prestación de servicios de manera presencial o mediante la aplicación del trabajo remoto. De ser así, señala los motivos informados por el empleador para determinar las actividades que continúan ejecutándose durante la suspensión perfecta de las labores f) Verificación que el motivo de la inclusión de los trabajadores sindicalizados o de representantes de trabajadores en la suspensión perfecta de labores, según sea el caso, esté vinculado al puesto de trabajo que ha paralizado, para lo cual recaba la información que lo acredita g) Cuando sea exigible, verificación de si el empleador procuró la adopción de medidas para mantener la vigencia del vínculo laboral y la percepción de remuneraciones, privilegiando el acuerdo con los trabajadores; y los motivos en caso ello no haya sido realizado.” h) La manifestación del empleador, así como de la organización sindical, o a falta de ésta de los trabajadores o sus representantes, de ser posible. Las actividades descritas pueden ser realizadas, mediante acciones preliminares o por actuaciones inspectivas de Supervisores Inspectores, Inspectores del Trabajo o Inspectores Auxiliares, y se desarrollan preferentemente mediante el uso de tecnologías de la información y la comunicación, empleando a tal efecto los mecanismos de interoperabilidad entre entidades de la Administración Pública, excluyéndose la información protegida por reserva tributaria. Los empleadores podrán rectificar cualquier error material sobre la información prevista en los literales a) y b) del numeral 7.2 precedente, hasta cinco (5) días anteriores al plazo máximo de expedición de la resolución por parte de la Autoridad Administrativa de Trabajo competente. 7.3 La Autoridad Inspectiva de Trabajo en el marco de sus competencias realiza la verificación antes mencionada y remite la información indicada en el numeral 7.2 del artículo 7 del presente decreto supremo a la Autoridad Administrativa de Trabajo, observando el plazo no mayor a treinta (30) días hábiles de presentada la comunicación del empleador, mediante los canales de comunicación que se establezcan sobre el particular. (Constitucionales, Judiciales y Administrativos)"}, {"fundamento": "6.30", "texto": "Asimismo, se advierte que, conforme el artículo 7 del Decreto Supremo Nº 011-2020-TR, la actuación de la autoridad inspectiva de trabajo no tiene por objeto calificar la solicitud de suspensión perfecta de labores, sino que coadyuva a la autoridad administrativa de trabajo competente para resolver la procedencia o improcedencia de dicha petición. Esto, sin perjuicio del control desplegado con la fiscalización laboral sobre posibles hechos derivados de la petición de la suspensión perfecta, que constituyan materia distinta del objeto del pronunciamiento en el procedimiento de aprobación o el de impugnación de la suspensión perfecta de labores, hasta la emisión del acto administrativo firme."}, {"fundamento": "6.31", "texto": "En este bloque de legalidad sobre la calificación de hechos que puedan guardar conexión con un expediente administrativo de solicitud de suspensión perfecta de labores, sobre el que aún no exista un acto administrativo firme, resulta relevante la observancia de los principios de legalidad23, verdad material24 y de presunción de licitud25, entre otros, que deben seguir la autoridad inspectiva y sancionadora, antes de proponer o determinar la posible responsabilidad administrativa del sujeto inspeccionado."}, {"fundamento": "6.32", "texto": "En ese sentido, si al momento de las actuaciones inspectivas se evidencia que se encuentra pendiente una solicitud de suspensión perfecta de labores, que debe ser atendida por la autoridad competente, el inspector no deberá presumir la ilegalidad de la conducta del empleador, al no realizar el pago de remuneraciones, ya que el procedimiento de la suspensión perfecta aún no ha concluido. Ello en aplicación estricta del mencionado bloque de legalidad y del reparto competencial establecido en el ordenamiento administrativo laboral."}]}, {"id": "2022-008", "anio": 2022, "numero": "008-2022", "tipo": "Precedente", "titulo": "Jornada máxima de trabajo", "criterio": "Criterio referido a la jornada máxima de trabajo (fund. 6.10 a 6.12).", "fundamentos": "6.10, 6.11 y 6.12", "palabras": ["jornada máxima", "horas de trabajo", "jornada"], "temas": [["Relación de trabajo y derechos laborales", "Jornada y tiempo de trabajo", "Jornada máxima"]], "archivo": "pdf/2022-008.pdf", "archivo_nombre": "Resolucion-008-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.10", "texto": "En ese entendido, se advierte de las boletas exhibidas por el sujeto inspeccionado que la jornada impuesta al trabajador superaba en forma permanente la jornada ordinaria máxima de trabajo de ocho (8) horas diarias o cuarenta y ocho (48) horas semanales establecida por la Constitución Política del Perú y demás normas acotadas. Sobre el particular, resulta conveniente indicar que, si bien el sujeto inspeccionado pagó las sobretasas por trabajo en día de descanso semanal obligatorio, así como de los días feriados no laborables, ello no la exime de responsabilidad, tomando en consideración que el otorgamiento de mínimamente un día de descanso a la semana tiene como finalidad, que el trabajador descanse para retomar sus labores y restablecer sus fuerzas. Asimismo, el día de descanso semanal (segundo párrafo del artículo 25 de la Constitución) protege los derechos al disfrute del tiempo libre (inciso 22 del artículo 2 de la Constitución) y permite la vida comunitaria adecuada. Por ello, el legislador ha reconocido, en el artículo 1 del Decreto Legislativo núm. 713 que las 24 horas de descanso semanal debe otorgarse preferentemente en día domingo; mientra que el artículo 2 del mismo cuerpo normativo reconoce la posibilidad de que el empleador fije un día de descanso distinto al domingo, cuando los requerimientos de la producción lo hagan indispensable."}, {"fundamento": "6.11", "texto": "Contrario sensu, si el trabajador no goza de un día de descanso semanal, se denota una evidente vulneración a su derecho a descansar del trabajo efectuado, máxime si dicho derecho se encuentra reconocido en las normas constitucionales citadas previamente. Conforme esta Sala ha reconocido en otros casos (por todos, véase el considerando 6.6 de la Resolución 004-2021-SUNAFIL/TFL.Primera Sala, del 21 de mayo de 2021), debe entenderse que el descanso semanal debe asignarse preferentemente en día domingo (conforme a la tradición en nuestra sociedad) y, de no ser así, el día correspondiente deberá ser un día natural, con una duración no menor a veinticuatro (24) horas consecutivas, esto es, desde las 0:00 horas hasta las 23:59 del misno día, como mínimo."}, {"fundamento": "6.12", "texto": "Sobre el particular, sin bien conforme al artículo 3 del Decreto Legislativo Nº 713 se establece que “Los trabajadores que laboren en su día de descanso, sin sustituirlo por otro día en la misma semana, tendrán derecho al pago de la retribución correspondiente a la labor efectuada más una sobretasa del 100%”, asimismo, conforme al artículo 9 del mismo cuerpo normativo “El trabajo efectuado en los días feriados no laborables sin descanso sustitutorio dará lugar al pago de la retribución correspondiente por la labor efectuada, con una sobretasa de 100%”, cabe precisar que, es evidente que la razón de la norma trata de reconocer el pago de los días de descanso no compensados, pero de forma excepcional, de lo contrario permitiría excesos en la gestión de la jornada que resultarían contrarios a los derechos a la limitación de la jornada, a la salud y otros derechos fundamentales en el trabajo, como en el presente caso, donde se obliga a un subordinado a trabajar de lunes a domingo, contraviniéndose la Constitución Política del Perú por más que se haya establecido el pago de una retribución económica compensatoria por la extensión de jornada."}]}, {"id": "2022-009", "anio": 2022, "numero": "009-2022", "tipo": "Precedente", "titulo": "Extensión de beneficios de convenios colectivos minoritarios", "criterio": "Criterio referido a la extensión de beneficios de los convenios colectivos minoritarios por parte de los empleadores (fund. 6.22, 6.29 y 6.30).", "fundamentos": "6.22, 6.29 y 6.30", "palabras": ["convenio colectivo", "minoritario", "extensión de beneficios", "beneficios", "sindicato"], "temas": [["Libertad sindical y negociación colectiva", "Negociación colectiva", "Extensión de beneficios de convenios"]], "archivo": "pdf/2022-009.pdf", "archivo_nombre": "Resolucion-009-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.22", "texto": "Como puede comprobarse, la doctrina, con base constitucional, ha subrayado que, por aplicación sincronizada de los artículos 9, 46 y 47 de la LRCT, se pueden producir las siguientes variables con respecto a la representatividad y los efectos del convenio colectivo de trabajo resultante en el nivel de empresa:"}, {"fundamento": "6.29", "texto": "Es decir, puede advertirse que el tipo contenido en el inciso 25.10 del artículo 25 del RLGIT está compuesto por una premisa suficiente que, leída con la consecuencia jurídica prescrita, puede entenderse de la siguiente manera: [“son muy graves las infracciones consistentes en la realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores”]. Por ende, la extensión de beneficios del convenio colectivo de trabajo de eficacia limitada a los no afiliados al sindicato minoritario está contemplada en esta premisa del tipo sancionador de forma suficiente, infracción que es sancionada con la graduación máxima en el ordenamiento administrativo laboral. La subsunción de la extensión de los beneficios de un convenio colectivo de eficacia limitada a los no afiliados al sindicato minoritario pactante es viable dentro de este extremo del tipo sancionador por cuanto la práctica objetada en el presente expediente sancionador es una que afecta, per se, la libertad sindical, conforme a lo desarrollado en los considerandos anteriores."}, {"fundamento": "6.30", "texto": "Adicionalmente, el desarrollo ejemplificativo referido a la “promoción de la desafiliación de la organización sindical” añade a esta premisa un supuesto concreto, por lo que, para esos casos determinados, torna a la afirmación descrita en el párrafo anterior como una “premisa mayor” con respecto a esta premisa menor, en específico. Así, la premisa menor, añadida a la premisa mayor a título de desarrollo ejemplificativo, arroja la siguiente fórmula: [“la promoción de la desafiliación a la organización sindical actúa como una infracción muy grave por consistir en la realización de actos que afecten la libertad sindical del trabajador o de la organización de trabajadores”]. Entonces, de igual forma, la subsunción de los hechos determinados en este caso resultaría, incluso, viable en esta fórmula del inciso 25.10 del artículo 25 del RLGIT por cuanto la práctica objetada despliega efectos que tienden a promover la desafiliación, al dejarse sin base tangible a la utilidad de la afiliación para los trabajadores que podrían sindicalizarse, dada la extensión de los beneficios del sindicato minoritario por acción unilateral del empleador."}]}, {"id": "2022-010", "anio": 2022, "numero": "010-2022", "tipo": "Precedente", "titulo": "Existencia de infracciones continuadas", "criterio": "Criterio referido a la existencia de infracciones continuadas (fund. 6.31 a 6.33). La sumilla también menciona la acumulación de dos expedientes.", "fundamentos": "6.31, 6.32 y 6.33", "palabras": ["infracción continuada", "continuidad", "acumulación", "infracciones", "expedientes"], "temas": [["Procedimiento sancionador y principios", "Concurso y continuidad de infracciones", "Infracciones continuadas"], ["Procedimiento sancionador y principios", "Concurso y continuidad de infracciones", "Acumulación de procedimientos"]], "archivo": "pdf/2022-010.pdf", "archivo_nombre": "Resolucion-010-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.31", "texto": "Por ello, en aplicación del criterio señalado en el fundamento 6.15 de la presente Resolución, existirá una infracción continuada en aquellos supuestos en los cuales las autoridades del Sistema Inspectivo de Trabajo identifiquen la ocurrencia de (i) más de una conducta (acciones u omisiones) que constituiría cada una de ellas, por separado, una infracción; (ii) que infrinjan el mismo precepto o preceptos de similar naturaleza (homogeneidad de la norma violada o del bien jurídico lesionado); (iii) dentro de un proceso unitario (en contra de uno o más trabajadores por parte de un mismo empleador y repetición de una misma acción típica guiada por un mismo propósito); (iv) actuando el administrado con voluntad duradera (de forma perdurable y constante); y, (v) con una conexión espaciotemporal."}, {"fundamento": "6.32", "texto": "En dichos supuestos, atenta contra el principio de razonabilidad (y consecuentemente constituye un supuesto de exceso de punición) la emisión consecutiva de órdenes de inspección seguidas sobre tales hechos. En tales casos la administración deberá acumular los procedimientos administrativos sancionadores que de éstas se generen en un solo procedimiento, cuando dicha competencia corresponda a una sola intendencia regional de la SUNAFIL. En cambio, cuando el fenómeno sea de carácter supraregional, cada Intendencia Regional debe evaluar su propia competencia conforme con la legislación aplicable y proseguir con los procedimientos administrativos respectivos, de forma independiente. Lo anterior sin perjuicio de la aplicación uniforme de los criterios establecidos por este Tribunal a cada caso en concreto."}, {"fundamento": "6.33", "texto": "Conforme lo reconoce la legislación, jurisprudencia y la doctrina nacional, el tipo infractor a aplicarse en este tipo de infracciones (continuadas) debe regirse por lo dispuesto por la normativa vigente al momento de cometerse la última infracción, comprendiéndose bajo este criterio el valor de la unidad impositiva tributaria (UIT), para el cálculo de la multa. 24 25 BACA ONETO, Víctor Sebastián. (2011). La Prescripción de las Infracciones y su Clasificación en la Ley del Procedimiento Administrativo General (En Especial, Análisis de los Supuestos de Infracciones Permanentes y Continuadas). Revista Derecho & Sociedad, (Nº 37), páginas 263-274. Recuperado a partir de https://revistas.pucp.edu.pe/index.php/ derechoysociedad/article/view/13178 CORTEZ, Luis (2019) “La diferencia entre infracciones instantáneas y permanentes: A propósito de la infracción tipificada en el numeral 66) del artículo 134 del reglamento de la Ley General de Pesca”. Revista Vox Juris Nº 37(2) páginas 44-45. Fondo editorial de la Universidad de San Martín de Porres. Recuperado a partir de https://www.aulavirtualusmp.pe/ojs/index. php/VJ/article/view/1606/pdf05. (Constitucionales, Judiciales y Administrativos)"}]}, {"id": "2022-011", "anio": 2022, "numero": "011-2022", "tipo": "Precedente", "titulo": "Supervisión en materia de seguridad y salud en el trabajo", "criterio": "Criterio referente a la supervisión en materia de seguridad y salud en el trabajo (fund. 6.5.14 a 6.5.16).", "fundamentos": "6.5.14, 6.5.15 y 6.5.16", "palabras": ["supervisión", "seguridad y salud", "SST", "inspección"], "nota": "El PDF incluye, al final, texto correspondiente al precedente de la Resolución 012-2022 (protección de la mujer gestante). Conviene verificar la versión oficial publicada en El Peruano.", "temas": [["Seguridad y salud en el trabajo", "Función inspectiva en SST", "Supervisión en SST"]], "archivo": "pdf/2022-011.pdf", "archivo_nombre": "Resolucion-011-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.5.14", "texto": "En tal sentido, la supervisión en la seguridad y salud en el trabajo constituye un concepto amplio que define a acciones significativas que posibilitan la mejora continua, siendo entonces un instrumento trascendente en el diseño, desarrollo, guía y parámetros dentro de un sistema de gestión de seguridad y salud en el trabajo. Es decir, la “supervisión” no se reduce a la figura de un personal (“supervisor”) cuya función en concreto sea la de realizar la labor de ejecutar dichas acciones de control (“supervisar”). El concepto, en realidad, alude a los procedimientos y métodos diseñados y establecidos por el empleador — deudor de seguridad— para medir, recopilar y prevenir con ello los riesgos y peligros en el trabajo. Dicha metodología y procedimientos deben ser comprobables por la inspección del trabajo a través del deber de colaboración y el ejercicio de las facultades de la inspección del trabajo."}, {"fundamento": "6.5.15", "texto": "Así las cosas, sobre este aspecto, lo que es objeto de sanción para la administración es la ausencia de este complejo y estructural esquema y/o diseño que conlleva la supervisión en materia de seguridad, cuya responsabilidad recae en el empleador, el cual debe llevar y estructurar el mismo, además de verificar su cumplimiento y medir sus resultados."}, {"fundamento": "6.5.16", "texto": "Por lo anotado, la administración debe diferenciar, como lo hace el Tribunal, (i) la falta de conocimiento de los trabajadores sobre el riesgo; y, (ii) la ausencia de supervisión. Si bien ambos conceptos se complementan en la estructura de la seguridad y salud en el trabajo; no obstante, constituyen supuestos disímiles. La primera está orientada a la falta de formación e información de los trabajadores sobre los peligros y riesgos en la prestación de servicios, y la segunda, a la carencia de un sistema o medio de supervisión por parte del empleador."}]}, {"id": "2022-012", "anio": 2022, "numero": "012-2022", "tipo": "Precedente", "titulo": "Protección a favor de la mujer gestante en el ámbito laboral", "criterio": "Criterio referido a la protección a favor de la mujer gestante en el ámbito laboral (fund. 6.1.15 a 6.1.20).", "fundamentos": "6.1.15, 6.1.16, 6.1.17, 6.1.18, 6.1.19 y 6.1.20", "palabras": ["gestante", "embarazada", "mujer", "despido", "no renovación de contrato", "contrato", "terminación", "lactancia", "maternidad", "discriminación por sexo"], "temas": [["Relación de trabajo y derechos laborales", "Protección de trabajadoras", "Mujer gestante y lactancia"]], "archivo": "pdf/2022-012.pdf", "archivo_nombre": "Resolucion-012-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.1.15", "texto": "En este sentido, debe resaltarse la tutela reforzada en favor de las mujeres gestantes en el ámbito laboral, contemplada en nuestro ordenamiento constitucional. Dicha tutela reforzada, entre otros aspectos, exige brindarles estabilidad y seguridad laboral durante el periodo de gestación y lactancia. Consecuentemente, y en virtud a una interpretación tuitiva de los derechos de las mujeres, se presume que la garantía se extiende a toda trabajadora del sector público o del sector privado que se encuentre en tal situación, independientemente del régimen laboral al que pertenezca, pues la Constitución -en tanto norma suprema del Estado- irradia sus efectos normativos a todos los espacios de interacción laboral, sin excepción alguna."}, {"fundamento": "6.1.16", "texto": "A este respecto, la protección a la madre gestante señalada no está condicionada a la comunicación previa al empleador, siendo suficiente demostrar el estado de gestación para que opere el “fuero maternal”, el cual impide al empleador poner fin al contrato unilateralmente, salvo causa justa debidamente contemplada en nuestro ordenamiento jurídico."}, {"fundamento": "6.1.17", "texto": "Por tal motivo, acreditado el estado de gravidez de la mujer gestante, se concluye que el despido, terminación o no renovación de contrato que origine la culminación de la relación laboral es injustificado. Se sostiene lo anterior dado que la causa de la culminación fue el estado de embarazo de la trabajadora ya que el empleador no ha demostrado la existencia de una causa distinta para poner fin a la relación laboral."}, {"fundamento": "6.1.18", "texto": "Sobre el particular, debe resaltarse que la impugnante ha expresado que la culminación de la relación laboral responde a la necesidad de dar cumplimiento a un mandato judicial y a que se cuenta con personal a plazo indeterminado que puede cubrir las funciones de la extrabajadora. Ambas afirmaciones resultan -cuanto menos- ligeras y carentes de contrastación fáctica. En primer lugar, el mandato judicial ya se encontraba cumplido en el momento en el cual la impugnante decidió culminar la relación laboral con la extrabajadora. En segundo lugar, la impugnante rotó a una persona que cumplía funciones distintas a cubrir aquellas que dejó de desarrollar la extrabajadora. Por tanto, resultan insubsistentes las alegaciones de la impugnante ya que el mandato judicial fue emitido con anterioridad a la contratación de la extrabajadora y la propia impugnante ordenó a otra trabajadora dejar de realizar sus propias funciones por suplir las que dejaron de ser cubierta por la ex trabajadora."}, {"fundamento": "6.1.19", "texto": "En ese sentido, en los casos en que, por despido, terminación o no renovación de contrato de trabajo a causa o con ocasión de encontrarse en estado de embarazo, por hostigamientos o cualquier otro acto de amedrantamiento que tenga por objeto la renuncia de una trabajadora embarazada, deberá presumirse que se trata de un despido, generando así una situación de discriminación por razón de sexo y condición de gestante."}, {"fundamento": "6.1.20", "texto": "Ahora bien, la extensión de la protección contra el despido, terminación o no renovación de contrato de trabajo por el estado de embarazo de una trabajadora deberá ser hasta que culmine el periodo de permiso de lactancia reconocido por la Ley Nº 27240 – Ley que otorga permiso para lactancia materna (hasta que el menor hijo cumpla un año), en tanto la madre aún acarrea las consecuencias biológicas de su embarazo en el ámbito laboral, y esta obligación maternal bajo ningún motivo puede implicar una amenaza a sus derechos."}]}, {"id": "2022-013", "anio": 2022, "numero": "013-2022", "tipo": "Precedente", "titulo": "Non bis in ídem en la actuación de la autoridad administrativa", "criterio": "Criterio referido a la aplicación del principio de non bis in ídem por parte de la autoridad administrativa (fund. 6.9 a 6.11).", "fundamentos": "6.9, 6.10 y 6.11", "palabras": ["non bis in idem", "doble sanción", "principio", "identidad de hecho"], "temas": [["Procedimiento sancionador y principios", "Principios del procedimiento", "Non bis in ídem"]], "archivo": "pdf/2022-013.pdf", "archivo_nombre": "Resolucion-013-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.9", "texto": "En tal sentido, de lo descrito precedentemente, se aprecia que se configura una afectación del principio de non bis in idem, al evidenciarse (i) la identidad subjetiva, que consiste en que ambas pretensiones punitivas sean ejercidas contra el mismo administrado; (ii) la identidad de hecho u objetiva, que consiste en que la conducta incurrida por el administrado debe ser la misma en ambas pretensiones punitivas, bajo los mismos criterios de objetivación (el acto reprochado, durante el mismo periodo fiscalizado); y (iii) la identidad de fundamento, que consiste en que el bien jurídico protegido y los intereses tutelados por las distintas normas sancionadores sean los mismos."}, {"fundamento": "6.10", "texto": "Es preciso recordar que, conforme con la dogmática, el non bis in ídem es un principio que adquiere una faz material, que impide la aplicación de dos o más sanciones ante la verificación de la llamada “triple identidad”; así como una faz procedimental, que impide desplegar múltiples procedimientos sancionadores, cuando entre ellos se pueda deducir la llamada triple identidad. Esto último, claro está, sin perjuicio de la punición de actos continuos o de infracciones permanentes, lo que corresponde a hechos y/o fundamentos distinguibles, cada vez."}, {"fundamento": "6.11", "texto": "En particular, es importante que el órgano de la Administración que conociere un caso donde se invoca al non bis in ídem, deba verificar la identidad de sujetos, hechos y, singularmente (por requerir un análisis más detenido y en algunas ocasiones obviado), la llamada identidad de fundamento punitivo. Por esta última identidad, se entiende que “busca determinar si las normas concurrentes protegen o no un mismo bien jurídico”.11 De esta forma, es preciso que los órganos de la Administración verifiquen si dos procesamientos significan o no la superposición de regímenes sancionadores con idénticos o distintos bienes jurídicos."}]}, {"id": "2022-014", "anio": 2022, "numero": "014-2022", "tipo": "Precedente", "titulo": "Razonabilidad del plazo para cumplir la medida inspectiva de requerimiento", "criterio": "Criterio referido a la razonabilidad del plazo otorgado para el cumplimiento de la medida inspectiva de requerimiento (fund. 6.10, 6.14 y 6.16).", "fundamentos": "6.10, 6.14 y 6.16", "palabras": ["plazo", "requerimiento", "razonabilidad", "cumplimiento", "medida inspectiva"], "temas": [["Función inspectiva y medidas inspectivas", "Medida inspectiva de requerimiento", "Plazo para cumplir la medida"]], "archivo": "pdf/2022-014.pdf", "archivo_nombre": "Resolucion-014-2022-SUNAFIL-TFL.pdf", "textos": [{"fundamento": "6.10", "texto": "De esta forma, la evaluación de los recursos de revisión interpuestos contra sanciones administrativas por inejecución de medidas de requerimiento deberá circunscribirse a un análisis estrictamente referido a la proporcionalidad, razonabilidad y legalidad de tales medidas, sin invadir una competencia administrativa vedada, como son las infracciones calificadas como graves y leves, que en expedientes como el presente, han adquirido firmeza con la expedición (y notificación) de la resolución de segunda instancia” (énfasis añadido). 6.8 Así, el análisis de las medidas inspectivas de requerimiento, desde esa fecha, se ciñó a los alcances de proporcionalidad, razonabilidad y legalidad de las mismas, otorgándose contenido (a través de la casuística de la Primera Sala) a cada uno de estos elementos. Así, por ejemplo, constituye una vulneración al principio de legalidad la emisión de una medida de requerimiento disponiéndose el cumplimiento de una orden contraria a derecho (Resoluciones N° 886-2022-SUNAFIL/TFL-Primera Sala, N° 904-2022-SUNAFIL/ TFL-Primera Sala) o habiéndose acreditado el cumplimiento de las obligaciones sustantivas durante las actuaciones inspectivas (Resolución N° 658-2022-SUNAFIL/TFL-Primera Sala). 6.9 A su vez, la línea resolutiva de esta instancia de revisión ha dejado sentado que se producen atentados contra el princ
